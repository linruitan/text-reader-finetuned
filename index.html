ara":true,"t":[990.69,997.13]},{"text":"若独若在众，说法悉皆现。虽未得无漏 法性之妙身，","para":true,"t":[997.73,1004.69]},{"text":"以清净常体，一切于中现。","para":true,"t":[1005.29,1009.06]},{"text":"‘复次、常精进，若善男子、善女人，如来灭后、受持是经，若读、若诵，若解说，若书写，得千二百意功德。","para":false,"t":[1009.65,1022.33]},{"text":"以是清净意根，乃至闻一偈一句，通达无量无边之义，解是义已，能演说一句一偈、至于一月、四月、乃至一岁，诸所说法，随其义趣，皆与实相不相违背。","para":false,"t":[1022.58,1037.5]},{"text":"若说俗间经书、治世语言、资生业等，皆顺正法。三千大千世界、六趣众生，心之所行，心所动作，心所戏论，皆悉知之，虽未得无漏智慧，而其意根、清净如此。","para":false,"t":[1037.75,1056.07]},{"text":"是人有所思惟、筹量、言说，皆是佛法，无不真实，亦是先佛、经中所说。’","para":true,"t":[1056.32,1065.58]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[1066.16,1069.76]},{"text":"是人意清净，明利无浊秽，以此妙意根，知上中下法，","para":true,"t":[1070.36,1076.92]},{"text":"乃至闻一偈，通达无量义，次第如法说，月四月至岁。","para":true,"t":[1077.52,1085.16]},{"text":"是世界内外、一切诸众生，若天龙及人，夜叉鬼神等，","para":true,"t":[1085.76,1091.59]},{"text":"其在六趣中、所念若干种，持法华之报，一时皆悉知。","para":true,"t":[1092.16,1098.32]},{"text":"十方无数佛，百福庄严相，为众生说法，悉闻能受持。","para":true,"t":[1098.91,1106.36]},{"text":"思惟无量义，说法亦无量，终始不忘错，以持法华故。","para":true,"t":[1106.95,1113.39]},{"text":"悉知诸法相，随义识次第，达名字语言，如所知演说。","para":true,"t":[1114.0,1121.92]},{"text":"此人有所说，皆是先佛法，以演此法故，于众无所畏。","para":true,"t":[1122.52,1129.88]},{"text":"持法华经者，意根净若斯，虽未得无漏，先有如是相，","para":true,"t":[1130.48,1137.12]},{"text":"是人持此经，安住稀有地，为一切众生、欢喜而爱敬。","para":true,"t":[1137.72,1144.73]},{"text":"能以千万种，善巧之语言，分别而说法，持法华经故。","para":true,"t":[1145.32,1151.32]}]},{"title":"常不轻菩萨品第二十","stem":"021_常不轻菩萨品第二十","dur":552.48,"src":"audio/021.mp3","pieces":[{"text":"常不轻菩萨品第二十","para":true,"t":[0.0,2.96]},{"text":"尔时佛告得大势菩萨摩诃萨：‘汝今当知，若比丘、比丘尼、优婆塞、优婆夷、持法华经者，若有恶口、骂詈诽谤，获大罪报，如前所说，其所得功德，如向所说、","para":false,"t":[3.56,24.28]},{"text":"眼耳鼻舌身意清净。得大势，乃往古昔，过无量无边不可思议阿僧祇劫，有佛、名威音王如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[24.53,48.86]},{"text":"劫名离衰，国名大成。","para":false,"t":[49.1,52.18]},{"text":"其威音王佛，于彼世中，为天、人、阿修罗、说法，为求声闻者、说应四谛法，度生老病死，究竟涅槃，为求辟支佛者、说应十二因缘法，为诸菩萨、因阿耨多罗三藐三菩提，","para":false,"t":[52.43,70.78]},{"text":"说应六波罗蜜法，究竟佛慧。得大势，是威音王佛、寿四十万亿那由他恒河沙劫，正法住世劫数、如一阎浮提微尘，像法住世劫数、如四天下微尘，其佛饶益众生已，然后灭度。","para":false,"t":[71.04,95.04]},{"text":"正法像法灭尽之后，于此国土、复有佛出，亦号威音王如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。如是次第有二万亿佛，皆同一号。’","para":true,"t":[95.31,117.05]},{"text":"‘最初威音王如来、既已灭度，正法灭后，于像法中，增上慢比丘有大势力。","para":false,"t":[117.65,124.89]},{"text":"尔时有一菩萨比丘、名常不轻，得大势以何因缘、名常不轻，是比丘、凡有所见，若比丘、比丘尼、优婆塞、优婆夷，皆悉礼拜赞叹、而作是言：“我深敬汝等，不敢轻慢。","para":false,"t":[125.14,148.9]},{"text":"所以者何。汝等皆行菩萨道，当得作佛。”而是比丘、不专读诵经典，但行礼拜，乃至远见四众，亦复故往礼拜赞叹、而作是言：“我不敢轻于汝等，汝等皆当作佛。”","para":false,"t":[149.15,169.99]},{"text":"四众之中，有生嗔恚、心不净者，恶口骂詈言：“是无智比丘、从何所来？自言我不轻汝，而与我等授记，当得作佛，我等不用如是虚妄授记。”","para":false,"t":[170.24,189.84]},{"text":"如此经历多年，常被骂詈，不生嗔恚，常作是言：“汝当作佛。”说是语时，众人或以杖木瓦石而打掷之，避走远住，犹高声唱言：“我不敢轻于汝等，汝等皆当作佛。”","para":false,"t":[190.09,212.21]},{"text":"以其常作是语故，增上慢比丘、比丘尼、优婆塞、优婆夷，号之为常不轻。’","para":true,"t":[212.46,222.22]},{"text":"‘是比丘、临欲终时，于虚空中，具闻威音王佛、先所说法华经二十千万亿偈，悉能受持，即得如上眼根清净、耳鼻舌身意根清净。","para":false,"t":[222.82,238.99]},{"text":"得是六根清净已，更增寿命二百万亿那由他岁，广为人说是法华经。","para":false,"t":[239.23,248.23]},{"text":"于时增上慢四众，比丘、比丘尼、优婆塞、优婆夷，轻贱是人、为作不轻名者，见其得大神通力、乐说辩力、大善寂力，闻其所说，皆信伏随从。","para":false,"t":[248.48,266.88]},{"text":"是菩萨复化千万亿众，令住阿耨多罗三藐三菩提。","para":false,"t":[267.13,272.85]},{"text":"命终之后，得值二千亿佛，皆号日月灯明，于其法中、说是法华经，以是因缘，复值二千亿佛，同号云自在灯王，于此诸佛法中、受持读诵，为诸四众说此经典故，得是常眼清净、","para":false,"t":[273.1,294.15]},{"text":"耳鼻舌身意诸根清净，于四众中说法，心无所畏。’","para":true,"t":[294.43,301.07]},{"text":"‘得大势，是常不轻菩萨摩诃萨、供养如是若干诸佛，恭敬、尊重、赞叹、种诸善根，于后复值千万亿佛，亦于诸佛法中、说是经典，功德成就，当得作佛。","para":false,"t":[301.68,318.58]},{"text":"得大势，于意云何，尔时常不轻菩萨、岂异人乎，则我身是。","para":false,"t":[318.8,327.64]},{"text":"若我于宿世、不受持读诵此经、为他人说者，不能疾得阿耨多罗三藐三菩提，我于先佛所、受持读诵此经、为人说故，疾得阿耨多罗三藐三菩提。","para":false,"t":[327.89,345.1]},{"text":"得大势，彼时四众、比丘、比丘尼、优婆塞、优婆夷，以嗔恚意、轻贱我故，二百亿劫、常不值佛，不闻法，不见僧，千劫于阿鼻地狱受大苦恼，毕是罪已，复遇常不轻菩萨，","para":false,"t":[345.34,365.66]},{"text":"教化阿耨多罗三藐三菩提。","para":false,"t":[365.91,369.26]},{"text":"得大势，于汝意云何，尔时四众常轻是菩萨者、岂异人乎，今此会中、跋陀婆罗等五百菩萨，师子月等五百比丘，尼思佛等、五百优婆塞，皆于阿耨多罗三藐三菩提不退转者是。","para":false,"t":[369.48,393.04]},{"text":"得大势，当知是法华经，大饶益诸菩萨摩诃萨，能令至于阿耨多罗三藐三菩提，是故诸菩萨摩诃萨、于如来灭后，常应受持、读诵、解说、书写是经。’","para":true,"t":[393.29,409.97]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[410.56,414.31]},{"text":"过去有佛，号威音王，神智无量，将导一切，","para":true,"t":[414.89,421.39]},{"text":"天人龙神、所共供养。是佛灭后，法欲尽时，","para":true,"t":[422.01,428.89]},{"text":"有一菩萨、名常不轻。时诸四众、计著于法。","para":true,"t":[429.49,434.48]},{"text":"不轻菩萨、往到其所，而语之言，我不轻汝，","para":true,"t":[435.09,442.41]},{"text":"汝等行道，皆当作佛。诸人闻已，轻毁骂詈，","para":true,"t":[443.0,448.73]},{"text":"不轻菩萨，能忍受之。其罪毕已，临命终时，","para":true,"t":[449.33,455.97]},{"text":"得闻此经，六根清净，神通力故，增益寿命，","para":true,"t":[456.57,463.08]},{"text":"复为诸人，广说是经。诸著法众，皆蒙菩萨，","para":true,"t":[463.65,469.81]},{"text":"教化成就、令住佛道。不轻命终，值无数佛，","para":true,"t":[470.43,476.29]},{"text":"说是经故，得无量福，渐具功德，疾成佛道。","para":true,"t":[476.89,483.05]},{"text":"彼时不轻，则我身是。时四部众、著法之者，","para":true,"t":[483.65,490.29]},{"text":"闻不轻言、汝当作佛，以是因缘，值无数佛。","para":true,"t":[490.89,497.77]},{"text":"此会菩萨、五百之众，并及四部，清信士女，","para":true,"t":[498.37,503.17]},{"text":"今于我前，听法者是。我于前世，劝是诸人，","para":true,"t":[503.77,510.93]},{"text":"听受斯经，第一之法。开示教人，令住涅槃，","para":true,"t":[511.54,518.65]},{"text":"世世受持，如是经典。亿亿万劫，至不可议，","para":true,"t":[519.25,525.41]},{"text":"时乃得闻，是法华经。亿亿万劫，至不可议，","para":true,"t":[526.01,532.25]},{"text":"诸佛世尊、时说是经。是故行者、于佛灭后，","para":true,"t":[532.85,539.66]},{"text":"闻如是经，勿生疑惑。应当一心、广说此经，","para":true,"t":[540.29,547.35]},{"text":"世世值佛，疾成佛道。","para":true,"t":[547.93,551.81]}]},{"title":"如来神力品第二十一","stem":"022_如来神力品第二十一","dur":389.04,"src":"audio/022.mp3","pieces":[{"text":"如来神力品第二十一","para":true,"t":[0.0,2.44]},{"text":"尔时千世界微尘等菩萨摩诃萨、从地涌出者，皆于佛前、一心合掌，瞻仰尊颜，而白佛言：‘世尊，我等于佛灭后，世尊分身所在国土、灭度之处，当广说此经，所以者何。","para":false,"t":[3.04,21.24]},{"text":"我等亦自欲得是真净大法，受持、读诵、解说、书写、而供养之。’","para":true,"t":[21.49,29.98]},{"text":"尔时世尊于文殊师利等、无量百千万亿旧住娑婆世界菩萨摩诃萨、及诸比丘、比丘尼、优婆塞、优婆夷、天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等，","para":false,"t":[30.61,49.25]},{"text":"一切众前，现大神力，出广长舌上至梵世，一切毛孔、放于无量无数色光，皆悉遍照十方世界。众宝树下、师子座上诸佛，亦复如是，出广长舌、放无量光。","para":false,"t":[49.5,65.25]},{"text":"释迦牟尼佛、及宝树下诸佛、现神力时、满百千岁，然后还摄舌相。一时謦欬、俱共弹指，是二音声，遍至十方诸佛世界，地皆六种震动。","para":false,"t":[65.51,82.43]},{"text":"其中众生，天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等，以佛神力故，皆见此娑婆世界、无量无边百千万亿众宝树下、师子座上诸佛，及见释迦牟尼佛、","para":false,"t":[82.68,108.84]},{"text":"共多宝如来、在宝塔中、坐师子座，又见无量无边百千万亿菩萨摩诃萨、及诸四众，恭敬围绕释迦牟尼佛，既见是已，皆大欢喜，得未曾有。","para":true,"t":[109.09,127.56]},{"text":"即时诸天、于虚空中、高声唱言：‘过此无量无边百千万亿阿僧祇世界，有国、名娑婆，是中有佛、名释迦牟尼，今为诸菩萨摩诃萨说大乘经，名妙法莲华、教菩萨法、佛所护念，","para":false,"t":[128.17,147.13]},{"text":"汝等当深心随喜，亦当礼拜供养释迦牟尼佛。’彼诸众生、闻虚空中声已，合掌向娑婆世界、作如是言：‘南无释迦牟尼佛。南无释迦牟尼佛。’","para":false,"t":[147.38,165.67]},{"text":"以种种华、香、璎珞、幡盖、及诸严身之具、珍宝妙物，皆共遥散娑婆世界。所散诸物、从十方来，譬如云集，变成宝帐，遍覆此间诸佛之上。于时十方世界，通达无碍，如一佛土。","para":true,"t":[165.91,188.91]},{"text":"尔时佛告上行等菩萨大众：‘诸佛神力，如是无量无边、不可思议，若我以是神力，于无量无边百千万亿阿僧祇劫，为嘱累故、说此经功德，犹不能尽。","para":false,"t":[189.51,206.19]},{"text":"以要言之，如来一切所有之法，如来一切自在神力，如来一切所秘要之藏，如来一切甚深之事，皆于此经、宣示显说。","para":false,"t":[206.44,219.36]},{"text":"是故汝等于如来灭后，应一心受持、读诵、解说、书写、如说修行。","para":false,"t":[219.61,227.21]},{"text":"所在国土，若有受持、读诵、解说、书写、如说修行，若经卷所住之处，若于园中，若于林中，若于树下，若于僧坊，若白衣舍，若在殿堂，若山谷旷野，是中皆应起塔供养。","para":false,"t":[227.46,249.9]},{"text":"所以者何。当知是处、即是道场，诸佛于此、得阿耨多罗三藐三菩提，诸佛于此、转于法轮，诸佛于此、而般涅槃。’","para":true,"t":[250.15,265.67]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[266.27,270.21]},{"text":"诸佛救世者，住于大神通，为悦众生故，现无量神力，","para":true,"t":[270.79,277.95]},{"text":"舌相至梵天，身放无数光，为求佛道者、现此稀有事。","para":true,"t":[278.55,285.4]},{"text":"诸佛謦欬声、及弹指之声，周闻十方国，地皆六种动。","para":true,"t":[285.99,293.19]},{"text":"以佛灭度后、能持是经故，诸佛皆欢喜，现无量神力。","para":true,"t":[293.79,300.75]},{"text":"嘱累是经故，赞美受持者，于无量劫中、犹故不能尽。","para":true,"t":[301.36,307.86]},{"text":"是人之功德，无边无有穷，如十方虚空，不可得边际。","para":true,"t":[308.47,314.76]},{"text":"能持是经者，则为已见我，亦见多宝佛、及诸分身者，","para":true,"t":[315.35,321.97]},{"text":"又见我今日、教化诸菩萨。能持是经者，令我及分身、","para":true,"t":[322.55,329.32]},{"text":"灭度多宝佛，一切皆欢喜。十方现在佛、并过去未来，","para":true,"t":[329.95,336.55]},{"text":"亦见亦供养，亦令得欢喜。诸佛坐道场，所得秘要法，","para":true,"t":[337.15,344.35]},{"text":"能持是经者，不久亦当得。能持是经者，于诸法之义、","para":true,"t":[344.95,351.57]},{"text":"名字及言辞，乐说无穷尽，如风于空中，一切无障碍。","para":true,"t":[352.15,357.99]},{"text":"于如来灭后，知佛所说经，因缘及次第，随义如实说，","para":true,"t":[358.59,366.39]},{"text":"如日月光明，能除诸幽冥。斯人行世间，能灭众生闇，","para":true,"t":[366.99,373.91]},{"text":"教无量菩萨、毕竟住一乘。是故有智者、闻此功德利，","para":true,"t":[374.5,381.46]},{"text":"于我灭度后，应受持斯经，是人于佛道，决定无有疑。","para":true,"t":[382.06,388.39]}]},{"title":"嘱累品第二十二","stem":"023_嘱累品第二十二","dur":147.34,"src":"audio/023.mp3","pieces":[{"text":"嘱累品第二十二","para":true,"t":[0.0,2.08]},{"text":"尔时释迦牟尼佛从法座起，现大神力，以右手摩无量菩萨摩诃萨顶，而作是言：‘我于无量百千万亿阿僧祇劫、修习是难得阿耨多罗三藐三菩提法，今以付嘱汝等，","para":false,"t":[2.68,20.08]},{"text":"汝等应当一心流布此法，广令增益。’","para":false,"t":[20.33,24.85]},{"text":"如是三摩诸菩萨摩诃萨顶、而作是言：‘我于无量百千万亿阿僧祇劫、修习是难得阿耨多罗三藐三菩提法，今以付嘱汝等，汝等当受持、读诵、广宣此法，令一切众生、普得闻知。","para":false,"t":[25.1,44.42]},{"text":"所以者何。如来有大慈悲，无诸悭吝，亦无所畏，能与众生、佛之智慧、如来智慧、自然智慧，如来是一切众生之大施主。","para":false,"t":[44.65,59.97]},{"text":"汝等亦应随学如来之法，勿生悭吝，于未来世，若有善男子、善女人、信如来智慧者，当为演说此法华经，使得闻知，为令其人得佛慧故。","para":false,"t":[60.22,74.94]},{"text":"若有众生不信受者，当于如来余深法中、示教利喜，汝等若能如是，则为已报诸佛之恩。’","para":true,"t":[75.19,85.27]},{"text":"时诸菩萨摩诃萨、闻佛作是说已，皆大欢喜、遍满其身，益加恭敬，屈躬、低头、合掌向佛，俱发声言：‘如世尊敕，当具奉行，唯、然，世尊，愿不有虑。’","para":false,"t":[85.87,104.74]},{"text":"诸菩萨摩诃萨众，如是三反、俱发声言：‘如世尊敕，当具奉行，唯、然，世尊，愿不有虑。’","para":false,"t":[104.96,116.72]},{"text":"尔时释迦牟尼佛令十方来诸分身佛、各还本土，而作是言：‘诸佛各随所安，多宝佛塔、还可如故。’","para":false,"t":[116.97,128.61]},{"text":"说是语时，十方无量分身诸佛、坐宝树下师子座上者，及多宝佛，并上行等无边阿僧祇菩萨大众，舍利弗等声闻四众，及一切世间、天、人、阿修罗、等，闻佛所说，皆大欢喜。","para":true,"t":[128.86,146.66]}]},{"title":"药王菩萨本事品第二十三","stem":"024_药王菩萨本事品第二十三","dur":954.1,"src":"audio/024.mp3","pieces":[{"text":"药王菩萨本事品第二十三","para":true,"t":[0.0,3.06]},{"text":"尔时宿王华菩萨白佛言：‘世尊，药王菩萨、云何游于娑婆世界，世尊，是药王菩萨、有若干百千万亿那由他难行苦行，善哉、世尊，愿少解说。’","para":false,"t":[3.64,22.85]},{"text":"诸天、龙、神、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等，又他国土、诸来菩萨，及此声闻众，闻皆欢喜。","para":true,"t":[23.09,37.89]},{"text":"尔时佛告宿王华菩萨：‘乃往过去无量恒河沙劫，有佛、号日月净明德如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[38.49,58.3]},{"text":"其佛有八十亿大菩萨摩诃萨，七十二恒河沙大声闻众，佛寿四万二千劫，菩萨寿命亦等。","para":false,"t":[58.54,68.18]},{"text":"彼国无有女人、地狱、饿鬼、畜生、阿修罗、等，及以诸难，地平如掌，琉璃所成，宝树庄严，宝帐覆上，垂宝华幡，宝瓶香炉、周遍国界，七宝为台，一树一台，其树去台、","para":false,"t":[68.42,91.79]},{"text":"尽一箭道。此诸宝树，皆有菩萨、声闻、而坐其下，诸宝台上，各有百亿诸天、作天伎乐，歌叹于佛，以为供养。’","para":true,"t":[92.04,105.8]},{"text":"‘尔时彼佛为一切众生喜见菩萨、及众菩萨、诸声闻众、说法华经。","para":false,"t":[106.39,114.24]},{"text":"是一切众生喜见菩萨，乐习苦行，于日月净明德佛法中、精进经行，一心求佛、满万二千岁已，得现一切色身三昧。","para":false,"t":[114.48,127.75]},{"text":"得此三昧已，心大欢喜，即作念言，我得现一切色身三昧，皆是得闻法华经力，我今当供养日月净明德佛、及法华经。","para":false,"t":[127.99,141.04]},{"text":"即时入是三昧，于虚空中、雨曼陀罗华、摩诃曼陀罗华、细末坚黑栴檀，满虚空中、如云而下，又雨海此岸栴檀之香，此香六铢、价值娑婆世界，以供养佛。’","para":true,"t":[141.27,158.44]},{"text":"作是供养已，从三昧起，而自念言：“我虽以神力供养于佛，不如以身供养。”","para":false,"t":[159.03,167.54]},{"text":"即服诸香，栴檀、薰陆、兜楼婆、毕力迦、沉水、胶香，又饮瞻卜诸华香油，满千二百岁已，香油涂身，于日月净明德佛前，以天宝衣而自缠身，灌诸香油，以神通力愿、而自燃身，","para":false,"t":[167.76,189.36]},{"text":"光明遍照八十亿恒河沙世界。其中诸佛、同时赞言：“善哉、善哉，善男子，是真精进，是名真法供养如来。","para":false,"t":[189.61,204.85]},{"text":"若以华、香、璎珞、烧香、末香、涂香、天缯、幡盖、及海此岸栴檀之香、如是等种种诸物供养，所不能及，假使国城、妻子、布施，亦所不及。","para":false,"t":[205.1,223.3]},{"text":"善男子，是名第一之施，于诸施中、最尊最上，以法供养诸如来故。”作是语已，而各默然。其身火燃、千二百岁，过是已后，其身乃尽。","para":false,"t":[223.55,240.59]},{"text":"一切众生喜见菩萨、作如是法供养已，命终之后，复生日月净明德佛国中，于净德王家、结跏趺坐，忽然化生。即为其父而说偈言：","para":true,"t":[240.84,255.56]},{"text":"大王今当知，我经行彼处，即时得一切，现诸身三昧，","para":true,"t":[256.16,263.56]},{"text":"勤行大精进，舍所爱之身，供养于世尊、为求无上慧。","para":true,"t":[264.16,271.6]},{"text":"‘说是偈已，而白父言：“日月净明德佛、今故现在。我先供养佛已，得解一切众生语言陀罗尼，复闻是法华经八百千万亿那由他、甄迦罗、频婆罗、阿婆、等，偈。","para":false,"t":[272.2,291.76]},{"text":"大王，我今当还供养此佛。”白已即坐七宝之台，上升虚空，高七多罗树，往到佛所，头面礼足，合十指爪，以偈赞佛：","para":true,"t":[292.01,309.42]},{"text":"容颜甚奇妙，光明照十方，我适曾供养，今复还亲觐。","para":true,"t":[310.01,318.95]},{"text":"尔时一切众生喜见菩萨说是偈已，而白佛言：“世尊，世尊犹故在世。”","para":false,"t":[319.57,329.37]},{"text":"尔时日月净明德佛、告一切众生喜见菩萨：“善男子，我涅槃时到，灭尽时至，汝可安施床座，我于今夜、当般涅槃。”","para":false,"t":[329.62,344.22]},{"text":"又敕一切众生喜见菩萨：“善男子，我以佛法、嘱累于汝、及诸菩萨、大弟子，并阿耨多罗三藐三菩提法，亦以三千大千七宝世界、诸宝树、宝台、及给侍诸天、悉付于汝，","para":false,"t":[344.47,363.71]},{"text":"我灭度后，所有舍利、亦付嘱汝，当令流布，广设供养，应起若干千塔。”如是日月净明德佛、敕一切众生喜见菩萨已，于夜后分、入于涅槃。","para":true,"t":[363.96,381.53]},{"text":"尔时一切众生喜见菩萨见佛灭度，悲感、懊恼，恋慕于佛，即以海此岸栴檀为□、供养佛身，而以烧之。","para":false,"t":[382.12,396.12]},{"text":"火灭已后，收取舍利，作八万四千宝瓶、以起八万四千塔，高三世界，表刹庄严，垂诸幡盖，悬众宝铃。","para":true,"t":[396.37,409.69]},{"text":"‘尔时一切众生喜见菩萨复自念言：“我虽作是供养，心犹未足，我今当更供养舍利。”","para":false,"t":[410.29,420.84]},{"text":"便语诸菩萨大弟子、及天龙、夜叉、等一切大众：“汝等当一心念，我今供养日月净明德佛舍利。”","para":false,"t":[421.12,430.46]},{"text":"作是语已，即于八万四千塔前，燃百福庄严臂七万二千岁、而以供养，令无数求声闻众、无量阿僧祇人、发阿耨多罗三藐三菩提心，皆使得住现一切色身三昧。’","para":true,"t":[430.71,449.99]},{"text":"‘尔时诸菩萨、天、人、阿修罗、等，见其无臂，忧恼悲哀、而作是言：“此一切众生喜见菩萨，是我等师，教化我者，而今烧臂，身不具足。”","para":false,"t":[450.59,466.11]},{"text":"于时一切众生喜见菩萨、于大众中立此誓言：“我舍两臂，必当得佛金色之身，若实不虚，令我两臂还复如故。”作是誓已，自然还复，由斯菩萨福德智慧淳厚所致。","para":false,"t":[466.36,487.38]},{"text":"当尔之时，三千大千世界、六种震动，天雨宝华，一切人天、得未曾有。’","para":true,"t":[487.61,497.13]},{"text":"佛告宿王华菩萨：‘于汝意云何，一切众生喜见菩萨，岂异人乎，今药王菩萨是也，其所舍身布施，如是无量百千万亿那由他数。","para":false,"t":[497.73,515.05]},{"text":"宿王华，若有发心欲得阿耨多罗三藐三菩提者，能燃手指、乃至足一指、供养佛塔，胜以国城妻子、及三千大千国土山林河池、诸珍宝物、而供养者，若复有人，","para":false,"t":[515.3,533.26]},{"text":"以七宝满三千大千世界，供养于佛、及大菩萨、辟支佛、阿罗汉，是人所得功德，不如受持此法华经、乃至一四句偈，其福最多。’","para":true,"t":[533.51,546.63]},{"text":"‘宿王华，譬如一切川流江河，诸水之中，海为第一，此法华经、亦复如是，于诸如来所说经中，最为深大。","para":false,"t":[547.25,561.19]},{"text":"又如土山、黑山、小铁围山、大铁围山、及十宝山，众山之中，须弥山为第一，此法华经、亦复如是，于诸经中、最为其上。","para":false,"t":[561.44,576.72]},{"text":"又如众星之中，月天子最为第一，此法华经亦复如是，于千万亿种诸经法中、最为照明。又如日天子能除诸闇，此经亦复如是，能破一切不善之闇。","para":false,"t":[576.97,594.53]},{"text":"又如诸小王中，转轮圣王最为第一，此经亦复如是，于众经中、最为其尊。又如帝释、于三十三天中王，此经亦复如是，诸经中王。","para":false,"t":[594.78,609.13]},{"text":"又如大梵天王、一切众生之父，此经亦复如是，一切贤圣、学、无学、及发菩萨心者之父。","para":false,"t":[609.39,620.83]},{"text":"又如一切凡夫人中，须陀洹、斯陀含、阿那含、阿罗汉、辟支佛、为第一，此经亦复如是，一切如来所说、若菩萨所说、若声闻所说、诸经法中，最为第一，有能受持是经典者，","para":false,"t":[621.08,642.36]},{"text":"亦复如是，于一切众生中、亦为第一。一切声闻辟支佛中，菩萨为第一，此经亦复如是，于一切诸经法中、最为第一。如佛为诸法王，此经亦复如是，诸经中王。’","para":true,"t":[642.61,665.29]},{"text":"‘宿王华，此经能救一切众生者，此经能令一切众生离诸苦恼，此经能大饶益一切众生，充满其愿。","para":false,"t":[665.89,676.11]},{"text":"如清凉池、能满一切诸渴乏者，如寒者得火，如裸者得衣，如商人得主，如子得母，如渡得船，如病得医，如暗得灯，如贫得宝，如民得王，如贾客得海，如炬除暗，","para":false,"t":[676.34,698.1]},{"text":"此法华经亦复如是，能令众生离一切苦、一切病痛，能解一切生死之缚。若人得闻此法华经，若自书，若使人书，所得功德，以佛智慧、筹量多少，不得其边。","para":false,"t":[698.35,719.43]},{"text":"若书是经卷，华、香、璎珞、烧香、末香、涂香，幡盖、衣服，种种之灯，酥灯、油灯、诸香油灯、瞻卜油灯、须曼那油灯、波罗罗油灯、婆利师迦油灯、那婆摩利油灯、供养，","para":false,"t":[719.68,740.52]},{"text":"所得功德，亦复无量。’","para":true,"t":[740.76,743.89]},{"text":"‘宿王华，若有人、闻是药王菩萨本事品者，亦得无量无边功德。若有女人、闻是药王菩萨本事品，能受持者，尽是女身，后不复受。","para":false,"t":[744.49,758.77]},{"text":"若如来灭后、后五百岁中，若有女人、闻是经典，如说修行，于此命终，即往安乐世界，阿弥陀佛、大菩萨众，围绕住处，生莲华中，宝座之上，不复为贪欲所恼，","para":false,"t":[759.02,777.77]},{"text":"亦复不为嗔恚愚痴所恼，亦复不为憍慢嫉妒诸垢所恼，得菩萨神通、无生法忍。得是忍已，眼根清净，以是清净眼根，见七百万二千亿那由他恒河沙等诸佛如来。","para":false,"t":[778.03,798.55]},{"text":"是时诸佛遥共赞言：“善哉、善哉，善男子，汝能于释迦牟尼佛法中、受持读诵思惟是经，为他人说，所得福德、无量无边，火不能烧，水不能漂，汝之功德，千佛共说、不能令尽。","para":false,"t":[798.79,821.28]},{"text":"汝今已能破诸魔贼，坏生死军，诸余怨敌、皆悉摧灭。","para":false,"t":[821.53,827.97]},{"text":"善男子，百千诸佛，以神通力、共守护汝，于一切世间、天人之中，无如汝者，惟除如来，其诸声闻、辟支佛、乃至菩萨，智慧禅定、无有与汝等者。”","para":false,"t":[828.22,847.02]},{"text":"宿王华，此菩萨成就如是功德智慧之力。’","para":true,"t":[847.27,852.07]},{"text":"‘若有人闻是药王菩萨本事品，能随喜赞善者，是人现世、口中常出青莲华香，身毛孔中常出牛头栴檀之香，所得功德，如上所说。","para":false,"t":[852.68,867.59]},{"text":"是故宿王华，以此药王菩萨本事品、嘱累于汝，我灭度后、后五百岁中，广宣流布于阎浮提，无令断绝，恶魔、魔民、诸天龙、夜叉、鸠槃荼等，得其便也。’","para":true,"t":[867.84,885.0]},{"text":"‘宿王华，汝当以神通之力、守护是经。所以者何。此经则为阎浮提人、病之良药，若人有病，得闻是经，病即消灭，不老不死。","para":false,"t":[885.6,902.42]},{"text":"宿王华，汝若见有受持是经者，应以青莲花、盛满末香，供散其上，散已、作是念言：“此人不久、必当取草坐于道场，破诸魔军，当吹法螺、击大法鼓，度脱一切众生、","para":false,"t":[902.69,921.17]},{"text":"老病死海。”是故求佛道者、见有受持是经典人，应当如是生恭敬心。’","para":true,"t":[921.42,930.18]},{"text":"说是药王菩萨本事品时，八万四千菩萨、得解一切众生语言陀罗尼。","para":false,"t":[930.78,937.26]},{"text":"多宝如来、于宝塔中赞宿王华菩萨言：‘善哉、善哉，宿王华，汝成就不可思议功德，乃能问释迦牟尼佛如此之事，利益无量一切众生。’","para":true,"t":[937.51,953.43]}]},{"title":"妙音菩萨品第二十四","stem":"025_妙音菩萨品第二十四","dur":691.8,"src":"audio/025.mp3","pieces":[{"text":"妙音菩萨品第二十四","para":true,"t":[0.0,2.6]},{"text":"尔时释迦牟尼佛放大人相、肉髻光明，及放眉间白毫相光，遍照东方百八万亿那由他恒河沙等诸佛世界。","para":false,"t":[3.2,15.16]},{"text":"过是数已，有世界、名净光庄严，其国有佛，号净华宿王智如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊，为无量无边菩萨大众恭敬围绕、","para":false,"t":[15.41,37.41]},{"text":"而为说法，释迦牟尼佛白毫光明遍照其国。","para":true,"t":[37.66,43.02]},{"text":"尔时一切净光庄严国中，有一菩萨、名曰妙音，久已植众德本，供养亲近无量百千万亿诸佛，而悉成就甚深智慧，得妙幢相三昧、法华三昧、净德三昧、宿王戏三昧、无缘三昧、","para":false,"t":[43.62,68.69]},{"text":"智印三昧、解一切众生语言三昧、集一切功德三昧、清净三昧、神通游戏三昧、慧炬三昧、庄严王三昧、净光明三昧、净藏三昧、不共三昧、日旋三昧、","para":false,"t":[69.03,87.19]},{"text":"得如是等百千万亿恒河沙等诸大三昧。","para":false,"t":[87.44,92.24]},{"text":"释迦牟尼佛光照其身，即白净华宿王智佛言：‘世尊，我当往诣娑婆世界，礼拜、亲近、供养、释迦牟尼佛，及见文殊师利法王子菩萨、药王菩萨、勇施菩萨、宿王华菩萨、","para":false,"t":[92.49,112.77]},{"text":"上行意菩萨、庄严王菩萨、药上菩萨。’","para":true,"t":[113.02,117.58]},{"text":"尔时净华宿王智佛告妙音菩萨：‘汝莫轻彼国，生下劣想。","para":false,"t":[118.18,127.5]},{"text":"善男子，彼娑婆世界，高下不平，土石诸山、秽恶充满，佛身卑小，诸菩萨众、其形亦小，而汝身四万二千由旬，我身六百八十万由旬，汝身第一端正，百千万福、光明殊妙，","para":false,"t":[127.75,148.95]},{"text":"是故汝往、莫轻彼国、若佛菩萨、及国土，生下劣想。’妙音菩萨白其佛言：‘世尊，我今诣娑婆世界，皆是如来之力，如来神通游戏，如来功德智慧庄严。’","para":false,"t":[149.19,169.73]},{"text":"于是妙音菩萨不起于座，身不动摇，而入三昧，以三昧力，于耆阇崛山、去法座不远，化作八万四千众宝莲华，阎浮檀金为茎，白银为叶，金刚为须，甄叔迦宝以为其台。","para":true,"t":[169.97,189.97]},{"text":"尔时文殊师利法王子、见是莲华，而白佛言：‘世尊，是何因缘，先现此瑞，有若干千万莲华，阎浮檀金为茎，白银为叶，金刚为须，甄叔迦宝以为其台。’","para":false,"t":[190.57,212.13]},{"text":"尔时释迦牟尼佛告文殊师利：‘是妙音菩萨摩诃萨，欲从净华宿王智佛国，与八万四千菩萨、围绕而来，至此娑婆世界，供养、亲近、礼拜、于我，亦欲供养、听法华经。’","para":true,"t":[212.38,232.34]},{"text":"文殊师利白佛言：‘世尊，是菩萨种何善本？修何功德？而能有是大神通力？行何三昧？愿为我等说是三昧名字，我等亦欲勤修行之，行此三昧，乃能见是菩萨色相大小，威仪进止。","para":false,"t":[232.94,256.98]},{"text":"惟愿世尊以神通力，彼菩萨来，令我得见。’尔时释迦牟尼佛告文殊师利：‘此久灭度多宝如来、当为汝等而现其相。’","para":true,"t":[257.23,271.03]},{"text":"时多宝佛告彼菩萨：‘善男子、来，文殊师利法王子欲见汝身。’","para":false,"t":[271.63,281.19]},{"text":"于时妙音菩萨于彼国没，与八万四千菩萨、俱共发来，所经诸国，六种震动，皆悉雨于七宝莲华，百千天乐，不鼓自鸣。","para":false,"t":[281.44,295.24]},{"text":"是菩萨目如广大青莲华叶，正使和合百千万月，其面貌端正、复过于此，身真金色，无量百千功德庄严，威德炽盛，光明照曜，诸相具足，如那罗延坚固之身。","para":false,"t":[295.5,315.93]},{"text":"入七宝台，上升虚空，去地七多罗树，诸菩萨众恭敬围绕、而来诣此娑婆世界耆阇崛山。","para":true,"t":[316.18,328.34]},{"text":"到已下七宝台，以价值百千璎珞、持至释迦牟尼佛所，头面礼足，奉上璎珞，而白佛言：‘世尊，净华宿王智佛问讯世尊，少病、少恼，起居轻利，安乐行否，四大调和否，","para":false,"t":[328.95,347.42]},{"text":"世事可忍否，众生易度否，无多贪欲、嗔恚、愚痴、嫉妒、悭慢否，无不孝父母、不敬沙门、邪见、不善心、不摄五情否，世尊，众生能降伏诸魔怨否，久灭度多宝如来在七宝塔中、","para":false,"t":[347.67,372.28]},{"text":"来听法否，又问讯多宝如来，安隐、少恼，堪忍久住否。世尊，我今欲见多宝佛身，惟愿世尊，示我令见。’","para":true,"t":[372.56,386.56]},{"text":"尔时释迦牟尼佛语多宝佛：‘是妙音菩萨欲得相见。’时多宝佛告妙音言：‘善哉、善哉，汝能为供养释迦牟尼佛、及听法华经，并见文殊师利等，故来至此。’","para":true,"t":[387.16,407.0]},{"text":"尔时华德菩萨白佛言：‘世尊，是妙音菩萨，种何善根，修何功德，有是神力。’","para":false,"t":[407.6,417.08]},{"text":"佛告华德菩萨：‘过去有佛，名云雷音王多陀阿伽度、阿罗诃、三藐三佛陀，国名现一切世间，劫名喜见，妙音菩萨于万二千岁，以十万种伎乐、供养云雷音王佛，","para":false,"t":[417.33,436.25]},{"text":"并奉上八万四千七宝钵，以是因缘果报，今生净华宿王智佛国，有是神力。","para":false,"t":[436.5,445.06]},{"text":"华德，于汝意云何，尔时云雷音王佛所、妙音菩萨，伎乐供养、奉上宝器者，岂异人乎，今此妙音菩萨摩诃萨是。","para":false,"t":[445.31,459.19]},{"text":"华德，是妙音菩萨，已曾供养亲近无量诸佛，久植德本，又值恒河沙等百千万亿那由他佛。’","para":true,"t":[459.42,470.24]},{"text":"‘华德，汝但见妙音菩萨、其身在此，而是菩萨、现种种身，处处为诸众生说是经典，或现梵王身，或现帝释身，或现自在天身，或现大自在天身，或现天大将军身，","para":false,"t":[470.84,488.8]},{"text":"或现毗沙门天王身，或现转轮圣王身，或现诸小王身，或现长者身，或现居士身，或现宰官身，或现婆罗门身，或现比丘、比丘尼、优婆塞、优婆夷身，或现长者居士妇女身，","para":false,"t":[489.06,508.69]},{"text":"或现宰官妇女身，或现婆罗门妇女身，或现童男童女身，或现天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等身，而说是经。","para":false,"t":[508.94,527.02]},{"text":"诸有地狱、饿鬼、畜生、及众难处，皆能救济，乃至于王后宫，变为女身、而说是经。’","para":true,"t":[527.27,536.71]},{"text":"‘华德，是妙音菩萨，能救护娑婆世界诸众生者，是妙音菩萨如是种种变化现身，在此娑婆国土，为诸众生说是经典，于神通、变化、智慧、无所损减。","para":false,"t":[537.31,554.83]},{"text":"是菩萨，以若干智慧、明照娑婆世界，令一切众生、各得所知，于十方恒河沙世界中，亦复如是，若应以声闻形得度者，现声闻形而为说法，应以辟支佛形得度者，","para":false,"t":[555.08,573.44]},{"text":"现辟支佛形而为说法，应以菩萨形得度者，现菩萨形而为说法，应以佛形得度者，即现佛形而为说法，如是种种、随所应度而为现形，乃至应以灭度而得度者，示现灭度，华德，","para":false,"t":[573.69,592.46]},{"text":"妙音菩萨摩诃萨、成就大神通智慧之力，其事如是。’","para":true,"t":[592.7,598.86]},{"text":"尔时华德菩萨白佛言：‘世尊，是妙音菩萨、深种善根，世尊，是菩萨、住何三昧，而能如是在所变现，度脱众生？’","para":false,"t":[599.46,614.38]},{"text":"佛告华德菩萨：‘善男子，其三昧、名现一切色身，妙音菩萨住是三昧中，能如是饶益无量众生。’","para":false,"t":[614.63,625.63]},{"text":"说是妙音菩萨品时，与妙音菩萨俱来者八万四千人，皆得现一切色身三昧，此娑婆世界无量菩萨，亦得是三昧、及陀罗尼。","para":true,"t":[625.88,638.12]},{"text":"尔时妙音菩萨摩诃萨供养释迦牟尼佛、及多宝佛塔已，还归本土，所经诸国，六种震动，雨宝莲华，作百千万亿种种伎乐。","para":false,"t":[638.72,652.56]},{"text":"既到本国，与八万四千菩萨、围绕至净华宿王智佛所，白佛言：‘世尊，我到娑婆世界、饶益众生，见释迦牟尼佛、及见多宝佛塔，礼拜、供养，又见文殊师利法王子菩萨，","para":false,"t":[652.81,673.37]},{"text":"及见药王菩萨、得勤精进力菩萨、勇施菩萨等，亦令是八万四千菩萨、得现一切色身三昧。说是妙音菩萨来往品时，四万二千天子、得无生法忍，华德菩萨、得法华三昧。’","para":true,"t":[673.62,691.14]}]},{"title":"观世音菩萨普门品第二十五","stem":"026_观世音菩萨普门品第二十五","dur":705.77,"src":"audio/026.mp3","pieces":[{"text":"观世音菩萨普门品第二十五","para":true,"t":[0.0,3.28]},{"text":"尔时无尽意菩萨、即从座起，偏袒右肩，合掌向佛、而作是言：‘世尊，观世音菩萨、以何因缘、名观世音？’","para":false,"t":[3.88,16.08]},{"text":"佛告无尽意菩萨：‘善男子，若有无量百千万亿众生、受诸苦恼，闻是观世音菩萨，一心称名，观世音菩萨即时观其音声，皆得解脱。","para":false,"t":[16.33,33.93]},{"text":"若有持是观世音菩萨名者，设入大火，火不能烧，由是菩萨威神力故。若为大水所漂，称其名号，即得浅处。","para":false,"t":[34.2,48.46]},{"text":"若有百千万亿众生，为求金、银、琉璃、砗磲、玛瑙、珊瑚、琥珀、真珠、等宝，入于大海，假使黑风吹其船舫、飘堕罗刹鬼国，其中若有乃至一人、称观世音菩萨名者，是诸人等，","para":false,"t":[48.71,67.63]},{"text":"皆得解脱罗刹之难。以是因缘，名观世音。’","para":true,"t":[67.88,73.88]},{"text":"‘若复有人、临当被害，称观世音菩萨名者，彼所执刀杖、寻段段坏，而得解脱。","para":false,"t":[74.48,84.04]},{"text":"若三千大千国土，满中夜叉、罗刹，欲来恼人，闻其称观世音菩萨名者，是诸恶鬼、尚不能以恶眼视之，况复加害。","para":false,"t":[84.29,100.05]},{"text":"设复有人，若有罪、若无罪，杻械、枷锁、检系其身，称观世音菩萨名者，皆悉断坏，即得解脱。","para":false,"t":[100.3,112.26]},{"text":"若三千大千国土、满中怨贼，有一商主，将诸商人，赍持重宝、经过险路，其中一人、作是唱言：“诸善男子、勿得恐怖，汝等应当一心称观世音菩萨名号，","para":false,"t":[112.51,130.03]},{"text":"是菩萨能以无畏施于众生，汝等若称名者，于此怨贼、当得解脱。”众商人闻，俱发声言：“南无观世音菩萨。”称其名故，即得解脱。’","para":true,"t":[130.28,145.32]},{"text":"‘无尽意，观世音菩萨摩诃萨威神之力、巍巍如是。若有众生、多于淫欲，常念恭敬观世音菩萨，便得离欲。若多嗔恚，常念恭敬观世音菩萨，便得离嗔。","para":false,"t":[145.91,163.56]},{"text":"若多愚痴，常念恭敬观世音菩萨，便得离痴。无尽意，观世音菩萨、有如是等大威神力，多所饶益，是故众生、常应心念。","para":false,"t":[163.81,180.13]},{"text":"若有女人、设欲求男，礼拜供养观世音菩萨，便生福德智慧之男，设欲求女，便生端正有相之女，宿植德本，众人爱敬。","para":false,"t":[180.38,193.7]},{"text":"无尽意，观世音菩萨有如是力，若有众生、恭敬礼拜观世音菩萨，福不唐捐，是故众生皆应受持观世音菩萨名号。’","para":true,"t":[193.95,205.23]},{"text":"‘无尽意，若有人、受持六十二亿恒河沙菩萨名字，复尽形供养饮食、衣服、卧具、医药，于汝意云何，是善男子、善女人、功德多否？’","para":true,"t":[205.83,221.3]},{"text":"无尽意言：‘甚多，世尊。’","para":false,"t":[221.87,225.23]},{"text":"佛言：‘若复有人、受持观世音菩萨名号，乃至一时礼拜、供养，是二人福，正等无异，于百千万亿劫、不可穷尽，无尽意，受持观世音菩萨名号，得如是无量无边福德之利。’","para":true,"t":[225.48,243.13]},{"text":"无尽意菩萨白佛言：‘世尊，观世音菩萨、云何游此娑婆世界，云何而为众生说法，方便之力，其事云何？’","para":false,"t":[243.72,256.56]},{"text":"佛告无尽意菩萨：‘善男子，若有国土众生、应以佛身得度者，观世音菩萨即现佛身而为说法。应以辟支佛身得度者，即现辟支佛身而为说法。","para":false,"t":[256.81,275.37]},{"text":"应以声闻身得度者，即现声闻身而为说法。应以梵王身得度者，即现梵王身而为说法。应以帝释身得度者，即现帝释身而为说法。应以自在天身得度者，即现自在天身而为说法。","para":false,"t":[275.62,295.47]},{"text":"应以大自在天身得度者，即现大自在天身而为说法。应以天大将军身得度者，即现天大将军身而为说法。应以毗沙门身得度者，即现毗沙门身而为说法。","para":false,"t":[295.71,312.67]},{"text":"应以小王身得度者，即现小王身而为说法。应以长者身得度者，即现长者身而为说法。应以居士身得度者，即现居士身而为说法。应以宰官身得度者，即现宰官身而为说法。","para":false,"t":[312.92,332.48]},{"text":"应以婆罗门身得度者，即现婆罗门身而为说法。应以比丘、比丘尼、优婆塞、优婆夷身得度者，即现比丘、比丘尼、优婆塞、优婆夷身而为说法。","para":false,"t":[332.73,349.41]},{"text":"应以长者、居士、宰官、婆罗门妇女身得度者，即现妇女身而为说法。应以童男、童女身得度者，即现童男、童女身而为说法。","para":false,"t":[349.66,366.06]},{"text":"应以天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等身、得度者，即皆现之而为说法。应以执金刚神得度者，即现执金刚神而为说法。’","para":true,"t":[366.31,384.55]},{"text":"‘无尽意，是观世音菩萨成就如是功德，以种种形、游诸国土，度脱众生，是故汝等应当一心供养观世音菩萨。","para":false,"t":[385.15,395.89]},{"text":"是观世音菩萨摩诃萨，于怖畏急难之中、能施无畏，是故此娑婆世界、皆号之为施无畏者。’","para":true,"t":[396.12,408.52]},{"text":"无尽意菩萨白佛言：‘世尊，我今当供养观世音菩萨。’即解颈众宝珠璎珞、价值百千两金，而以与之，作是言：‘仁者，受此法施珍宝璎珞。’时观世音菩萨不肯受之。","para":false,"t":[409.12,428.54]},{"text":"无尽意复白观世音菩萨言：‘仁者，愍我等故，受此璎珞。’","para":true,"t":[428.77,436.25]},{"text":"尔时佛告观世音菩萨：‘当愍此无尽意菩萨、及四众、天、龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等故，受是璎珞。’","para":false,"t":[436.85,456.41]},{"text":"即时观世音菩萨愍诸四众、及于天、龙、人非人、等，受其璎珞，分作二分，一分奉释迦牟尼佛，一分奉多宝佛塔。‘无尽意，观世音菩萨有如是自在神力，游于娑婆世界。’","para":true,"t":[456.66,475.62]},{"text":"尔时无尽意菩萨以偈问曰：","para":true,"t":[476.22,480.47]},{"text":"世尊妙相具，我今重问彼，佛子何因缘，名为观世音。","para":true,"t":[481.06,488.51]},{"text":"具足妙相尊，偈答无尽意。汝听观音行，善应诸方所，","para":true,"t":[489.1,497.98]},{"text":"宏誓深如海，历劫不思议，侍多千亿佛，发大清净愿。","para":true,"t":[498.58,506.98]},{"text":"我为汝略说，闻名及见身，心念不空过，能灭诸有苦。","para":true,"t":[507.58,514.06]},{"text":"假使兴害意，推落大火坑，念彼观音力，火坑变成池。","para":true,"t":[514.66,521.22]},{"text":"或漂流巨海，龙鱼诸鬼难，念彼观音力，波浪不能没。","para":true,"t":[521.82,527.84]},{"text":"或在须弥峰、为人所推堕，念彼观音力，如日虚空住。","para":true,"t":[528.42,535.3]},{"text":"或被恶人逐，堕落金刚山，念彼观音力，不能损一毛。","para":true,"t":[535.89,542.22]},{"text":"或值怨贼绕，各执刀加害，念彼观音力，咸即起慈心。","para":true,"t":[542.82,550.34]},{"text":"或遭王难苦，临刑欲寿终，念彼观音力，刀寻段段坏。","para":true,"t":[550.94,558.23]},{"text":"或囚禁枷锁，手足被杻械，念彼观音力，释然得解脱。","para":true,"t":[558.82,566.02]},{"text":"咒诅诸毒药、所欲害身者，念彼观音力，还著于本人。","para":true,"t":[566.62,572.88]},{"text":"或遇恶罗刹、毒龙诸鬼等，念彼观音力，时悉不敢害。","para":true,"t":[573.46,579.78]},{"text":"若恶兽围绕，利牙爪可怖，念彼观音力，疾走无边方。","para":true,"t":[580.38,587.46]},{"text":"蚖蛇及蝮蝎，气毒烟火燃，念彼观音力，寻声自回去。","para":true,"t":[588.06,595.54]},{"text":"云雷鼓掣电，降雹澍大雨，念彼观音力，应时得消散。","para":true,"t":[596.14,603.3]},{"text":"众生被困厄，无量苦逼身，观音妙智力，能救世间苦。","para":true,"t":[603.9,612.5]},{"text":"具足神通力，广修智方便，十方诸国土，无刹不现身。","para":true,"t":[613.1,618.8]},{"text":"种种诸恶趣，地狱鬼畜生，生老病死苦，以渐悉令灭。","para":true,"t":[619.37,625.46]},{"text":"真观清净观，广大智慧观，悲观及慈观，常愿常瞻仰。","para":true,"t":[626.06,634.02]},{"text":"无垢清净光、慧日破诸闇，能伏灾风火，普明照世间。","para":true,"t":[634.61,641.01]},{"text":"悲体戒雷震，慈意妙大云，澍甘露法雨，灭除烦恼焰。","para":true,"t":[641.61,649.69]},{"text":"诤讼经官处，怖畏军阵中，念彼观音力，众怨悉退散。","para":true,"t":[650.29,657.46]},{"text":"妙音观世音、梵音海潮音，胜彼世间音，是故须常念，","para":true,"t":[658.05,664.85]},{"text":"念念勿生疑。观世音净圣，于苦恼死厄、能为作依怙。","para":true,"t":[665.45,672.89]},{"text":"具一切功德，慈眼视众生，福聚海无量，是故应顶礼。","para":true,"t":[673.49,680.61]},{"text":"尔时持地菩萨即从座起，前白佛言：‘世尊，若有众生、闻是观世音菩萨品、自在之业，普门示现神通力者，当知是人功德不少。’","para":false,"t":[681.21,696.49]},{"text":"佛说是普门品时，众中八万四千众生，皆发无等等阿耨多罗三藐三菩提心。","para":true,"t":[696.74,705.1]}]},{"title":"陀罗尼品第二十六","stem":"027_陀罗尼品第二十六","dur":387.86,"src":"audio/027.mp3","pieces":[{"text":"陀罗尼品第二十六","para":true,"t":[0.0,1.64]},{"text":"尔时药王菩萨、即从座起，偏袒右肩，合掌向佛、而白佛言：‘世尊，若善男子、善女人，有能受持法华经者。若读诵通利，若书写经卷，得几所福？’","para":false,"t":[2.24,20.44]},{"text":"佛告药王：‘若有善男子、善女人，供养八百万亿那由他恒河沙等诸佛，于汝意云何，其所得福、宁为多否？’‘甚多，世尊。’","para":false,"t":[20.69,34.73]},{"text":"佛言：‘若善男子、善女人，能于是经，乃至受持一四句偈，读诵、解义，如说修行，功德甚多。’尔时药王菩萨白佛言：‘世尊，我今当与说法者陀罗尼咒、以守护之。’","para":false,"t":[34.98,54.46]},{"text":"即说咒曰：","para":true,"t":[54.71,55.91]},{"text":"安尔 曼尔 摩祢 摩摩祢 旨隶 遮梨第 赊□ 赊履多玮 膻帝 目帝 目多履 娑履 阿玮娑覆 桑履 娑履 叉裔 阿叉裔 阿耆腻 膻帝 赊履 陀罗尼 阿卢伽婆娑簸蔗毗叉腻 祢毗剃 阿便哆逻祢履剃 阿亶哆波隶输地 沤究隶 牟究隶 阿罗隶 波罗隶 首迦差 阿三磨三履 佛驮毗吉利□帝 达磨波利差帝 僧伽涅瞿沙祢 婆舍婆舍输地 曼哆逻 曼哆逻叉夜多 邮楼哆 邮楼哆憍舍略 恶叉逻 恶叉冶多冶 阿婆卢 阿磨若那多夜","para":true,"t":[56.51,95.07]},{"text":"‘世尊，是陀罗尼神咒，六十二亿恒河沙等诸佛所说，若有侵毁此法师者，则为侵毁是诸佛已。’","para":true,"t":[95.67,105.07]},{"text":"时释迦牟尼佛赞药王菩萨言：‘善哉、善哉，药王，汝愍念拥护此法师故，说是陀罗尼，于诸众生、多所饶益。’","para":true,"t":[105.67,116.67]},{"text":"尔时勇施菩萨白佛言：‘世尊，我亦为拥护读诵受持法华经者，说陀罗尼，若此法师得是陀罗尼，若夜叉、若罗刹、若富单那、若吉遮、若鸠槃荼、若饿鬼、等，伺求其短，","para":false,"t":[117.27,135.91]},{"text":"无能得便。’即于佛前而说咒曰：","para":true,"t":[136.16,140.14]},{"text":"痤隶 摩诃痤隶 郁枳 目枳 阿隶 阿罗婆第 涅隶第 涅隶多婆第 伊致柅 韦致柅 旨致柅 涅隶墀柅 涅犁墀婆底","para":true,"t":[140.72,151.64]},{"text":"‘世尊，是陀罗尼神咒，恒河沙等诸佛所说，亦皆随喜，若有侵毁此法师者，则为侵毁是诸佛已。’","para":true,"t":[152.24,163.32]},{"text":"尔时毗沙门天王护世者白佛言：‘世尊，我亦为愍念众生、拥护此法师故，说是陀罗尼。’即说咒曰：","para":true,"t":[163.92,176.04]},{"text":"阿梨 那梨 □那梨 阿那卢 那履 拘那覆","para":true,"t":[176.64,182.69]},{"text":"‘世尊，以是神咒、拥护法师，我亦自当拥护持是经者，令百由旬内、无诸衰患。’","para":true,"t":[183.28,192.12]},{"text":"尔时持国天王、在此会中，与千万亿那由他乾闼婆众，恭敬围绕，前诣佛所，合掌白佛言：‘世尊，我亦以陀罗尼神咒、拥护持法华经者。’即说咒曰：","para":true,"t":[192.72,211.36]},{"text":"阿伽祢 伽祢 瞿利 乾陀利 旃陀利 摩蹬耆 常求利 浮楼莎柅 頞底","para":true,"t":[211.96,218.28]},{"text":"‘世尊，是陀罗尼神咒，四十二亿诸佛所说，若有侵毁此法师者，则为侵毁是诸佛已。’","para":true,"t":[218.91,228.86]},{"text":"尔时有罗刹女等，一名蓝婆，二名毗蓝婆，三名曲齿，四名华齿，五名黑齿，六名多发，七名无厌足，八名持璎珞，九名睾帝，十名夺一切众生精气，是十罗刹女，与鬼子母、","para":false,"t":[229.43,246.67]},{"text":"并其子、及眷属，俱诣佛所，同声白佛言：‘世尊，我等亦欲拥护读诵受持法华经者，除其衰患，若有伺求法师短者，令不得便。’即于佛前，而说咒曰：","para":true,"t":[246.93,264.44]},{"text":"伊提履 伊提泯 伊提履 阿提履 伊提履 泥履 泥履 泥履 泥履 泥履 楼醯 楼醯 楼醯 楼醯 多醯 多醯 多醯 兜醯 □醯","para":true,"t":[265.04,273.13]},{"text":"‘宁上我头上，莫恼于法师。","para":false,"t":[273.72,276.91]},{"text":"若夜叉、若罗刹、若饿鬼、若富单那、若吉遮、若毗陀罗、若犍驮、若乌摩勒伽、若阿跋摩罗、若夜叉吉遮、若人吉遮、若热病、若一日、若二日、若三日、若四日、乃至七日、","para":false,"t":[277.17,296.12]},{"text":"若常热病，若男形、若女形、若童男形、若童女形，乃至梦中，亦复莫恼。’即于佛前、而说偈言：","para":true,"t":[296.34,308.52]},{"text":"若不顺我咒，恼乱说法者，头破作七分，如阿梨树枝。","para":true,"t":[309.1,314.66]},{"text":"如杀父母罪，亦如压油殃，斗秤欺诳人，调达破僧罪。","para":true,"t":[315.26,322.34]},{"text":"犯此法师者，当获如是殃。","para":true,"t":[322.94,326.55]},{"text":"诸罗刹女说此偈已，白佛言：‘世尊，我等亦当身自拥护受持、读诵、修行、是经者，令得安隐，离诸衰患，消众毒药。’","para":false,"t":[327.14,342.54]},{"text":"佛告诸罗刹女：‘善哉、善哉，汝等但能拥护受持法华名者，福不可量，何况拥护具足受持，供养经卷，华、香、璎珞，末香、涂香、烧香，幡盖、伎乐，燃种种灯，酥灯、油灯、","para":false,"t":[342.79,365.87]},{"text":"诸香油灯、苏摩那华油灯、瞻卜华油灯、婆师迦华油灯、优钵罗华油灯，如是等百千种供养者。睾帝，汝等及眷属，应当拥护如是法师。’","para":false,"t":[366.12,382.12]},{"text":"说是陀罗尼品时，六万八千人、得无生法忍。","para":true,"t":[382.37,387.21]}]},{"title":"妙庄严王本事品第二十七","stem":"028_妙庄严王本事品第二十七","dur":565.51,"src":"audio/028.mp3","pieces":[{"text":"妙庄严王本事品第二十七","para":true,"t":[0.0,3.24]},{"text":"尔时佛告诸大众：‘乃往古世、过无量无边不可思议阿僧祇劫，有佛、名云雷音宿王华智、多陀阿伽度、阿罗诃、三藐三佛陀，国名光明庄严，劫名喜见。’","para":true,"t":[3.84,21.24]},{"text":"‘彼佛法中有王，名妙庄严，其王夫人、名曰净德，有二子，一名净藏，二名净眼。","para":false,"t":[21.84,30.87]},{"text":"是二子、有大神力，福德智慧，久修菩萨所行之道，所谓檀波罗蜜、尸罗波罗蜜、羼提波罗蜜、毗梨耶波罗蜜、禅波罗蜜、般若波罗蜜、方便波罗蜜，慈悲喜舍，","para":false,"t":[31.09,47.61]},{"text":"乃至三十七品助道法、皆悉明了通达。又得菩萨净三昧、日星宿三昧、净光三昧、净色三昧、净照明三昧、长庄严三昧、大威德藏三昧，于此三昧、亦悉通达。’","para":true,"t":[47.86,65.14]},{"text":"‘尔时彼佛欲引导妙庄严王、及愍念众生故，说是法华经。时净藏净眼二子、到其母所，合十指爪掌、白言：“愿母往诣云雷音宿王华智佛所，我等亦当侍从、亲近供养礼拜。","para":false,"t":[65.74,84.22]},{"text":"所以者何。此佛于一切天人众中、说法华经，宜应听受。”母告子言：“汝父信受外道，深著婆罗门法，汝等应往白父，与共俱去。”","para":false,"t":[84.47,97.8]},{"text":"净藏、净眼、合十指爪掌白母：“我等是法王子，而生此邪见家。”母告子言：“汝等当忧念汝父，为现神变，若得见者，心必清净，或听我等，往至佛所。”’","para":true,"t":[98.04,116.4]},{"text":"‘于是二子念其父故，涌在虚空，高七多罗树，现种种神变，于虚空中、行住坐卧，身上出水、身下出火，身下出水、身上出火，或现大身满虚空中，而复现小，小复现大，","para":false,"t":[117.0,136.28]},{"text":"于空中灭，忽然在地，入地如水，履水如地，现如是等种种神变，令其父王心净信解。时父见子神力如是，心大欢喜，得未曾有，合掌向子言：“汝等、师为是谁，谁之弟子？”","para":false,"t":[136.53,158.33]},{"text":"二子白言：“大王，彼云雷音宿王华智佛，今在七宝菩提树下、法座上坐，于一切世间天人众中、广说法华经，是我等师，我是弟子。”","para":false,"t":[158.58,172.75]},{"text":"父语子言：“我今亦欲见汝等师，可共俱往。”于是二子从空中下，到其母所，合掌白母：“父王今已信解，堪任发阿耨多罗三藐三菩提心。","para":false,"t":[172.99,190.59]},{"text":"我等为父、已作佛事，愿母见听，于彼佛所、出家修道。”’","para":true,"t":[190.84,197.28]},{"text":"尔时二子欲重宣其意，以偈白母：","para":true,"t":[197.88,202.36]},{"text":"愿母放我等、出家作沙门，诸佛甚难值，我等随佛学。","para":true,"t":[202.96,211.57]},{"text":"如优昙钵华，值佛复难是，脱诸难亦难，愿听我出家。","para":true,"t":[212.16,219.96]},{"text":"‘母即告言：“听汝出家。所以者何。佛难值故。”于是二子白父母言：“善哉、父母，愿时往诣云雷音宿王华智佛所、亲近供养，所以者何。","para":false,"t":[220.56,235.56]},{"text":"佛难得值，如优昙钵罗华，又如一眼之龟，值浮木孔。而我等宿福深厚，生值佛法，是故父母当听我等，令得出家。所以者何。诸佛难值，时亦难遇。”’","para":true,"t":[235.81,256.09]},{"text":"‘彼时妙庄严王后宫八万四千人，皆悉堪任受持是法华经。净眼菩萨、于法华三昧、久已通达，净藏菩萨、已于无量百千万亿劫、通达离诸恶趣三昧，欲令一切众生离诸恶趣故。","para":false,"t":[256.69,277.88]},{"text":"其王夫人、得诸佛集三昧，能知诸佛秘密之藏。二子如是以方便力、善化其父，令心信解，好乐佛法。","para":false,"t":[278.14,290.02]},{"text":"于是妙庄严王、与群臣眷属俱，净德夫人、与后宫婇女眷属俱，其王二子、与四万二千人俱，一时共诣佛所，到已，头面礼足，绕佛三匝，却住一面。’","para":true,"t":[290.27,308.99]},{"text":"‘尔时彼佛为王说法，示教利喜。王大欢悦。","para":false,"t":[309.59,315.23]},{"text":"尔时妙庄严王、及其夫人、解颈真珠璎珞、价值百千，以散佛上，于虚空中、化成四柱宝台，台中有大宝床，敷百千万天衣，其上有佛、结跏趺坐，放大光明。","para":false,"t":[315.48,333.48]},{"text":"尔时妙庄严王作是念：“佛身稀有、端严殊特，成就第一微妙之色。”时云雷音宿王华智佛告四众言：“汝等见是妙庄严王、于我前合掌立否。","para":false,"t":[333.73,350.53]},{"text":"此王、于我法中、作比丘、精勤修习，助佛道法，当得作佛，号娑罗树王，国名大光，劫名大高王。其娑罗树王佛，有无量菩萨众、及无量声闻，其国平正，功德如是。”","para":false,"t":[350.78,370.78]},{"text":"其王即时以国付弟，与夫人、二子、并诸眷属，于佛法中、出家修道。王出家已，于八万四千岁，常勤精进、修行妙法华经，过是已后，得一切净功德庄严三昧。","para":false,"t":[371.03,390.43]},{"text":"即升虚空，高七多罗树，而白佛言：“世尊，此我二子、已作佛事，以神通变化、转我邪心，令得安住于佛法中，得见世尊。","para":false,"t":[390.68,404.92]},{"text":"此二子者，是我善知识，为欲发起宿世善根，饶益我故，来生我家。”’","para":true,"t":[405.17,412.37]},{"text":"‘尔时云雷音宿王华智佛告妙庄严王言：“如是、如是，如汝所言，若善男子、善女人，种善根故，世世得善知识，其善知识、能作佛事，示教利喜，令入阿耨多罗三藐三菩提，","para":false,"t":[412.97,433.69]},{"text":"大王，当知善知识者、是大因缘，所谓化导令得见佛，发阿耨多罗三藐三菩提心。大王，汝见此二子否。","para":false,"t":[433.94,446.86]},{"text":"此二子、已曾供养六十五百千万亿那由他恒河沙诸佛，亲近恭敬，于诸佛所、受持法华经，愍念邪见众生，令住正见。”","para":false,"t":[447.11,460.47]},{"text":"妙庄严王即从虚空中下，而白佛言：“世尊，如来甚稀有，以功德智慧故，顶上肉髻、光明显照，其眼长广、而绀青色，眉间毫相、白如珂月，齿白齐密，常有光明，唇色赤好、","para":false,"t":[460.72,482.18]},{"text":"如频婆果。”","para":false,"t":[482.41,483.38]},{"text":"尔时妙庄严王、赞叹佛如是等无量百千万亿功德已，于如来前，一心合掌，复白佛言：“世尊，未曾有也，如来之法，具足成就不可思议微妙功德，教诫所行，安隐快善，我从今日，","para":false,"t":[483.62,505.38]},{"text":"不复自随心行，不生邪见、憍慢嗔恚诸恶之心。”说是语已，礼佛而出。’","para":true,"t":[505.63,514.35]},{"text":"佛告大众：‘于意云何，妙庄严王、岂异人乎，今华德菩萨是。其净德夫人，今佛前光照庄严相菩萨是，哀愍妙庄严王及诸眷属故，于彼中生。","para":false,"t":[514.94,531.67]},{"text":"其二子者，今药王菩萨、药上菩萨是，是药王药上菩萨、成就如此诸大功德，已于无量百千万亿诸佛所、植众德本，成就不可思议诸善功德，若有人、识是二菩萨名字者，","para":false,"t":[531.92,551.24]},{"text":"一切世间诸天人民、亦应礼拜。’佛说是妙庄严王本事品时，八万四千人、远尘离垢，于诸法中、得法眼净。","para":true,"t":[551.49,564.85]}]},{"title":"普贤菩萨劝发品第二十八","stem":"029_普贤菩萨劝发品第二十八","dur":563.54,"src":"audio/029.mp3","pieces":[{"text":"普贤菩萨劝发品第二十八","para":true,"t":[0.0,3.2]},{"text":"尔时普贤菩萨、以自在神通力，威德名闻，与大菩萨无量无边不可称数、从东方来，所经诸国，普皆震动，雨宝莲华，作无量百千万亿种种伎乐。","para":false,"t":[3.8,21.44]},{"text":"又与无数诸天、龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等，大众围绕，各现威德神通之力。","para":false,"t":[21.69,33.89]},{"text":"到娑婆世界、耆阇崛山中，头面礼释迦牟尼佛，右绕七匝，白佛言：‘世尊，我于宝威德上王佛国，遥闻此娑婆世界、说法华经，与无量无边百千万亿诸菩萨众、共来听受，","para":false,"t":[34.14,52.46]},{"text":"惟愿世尊当为说之，若善男子、善女人，于如来灭后，云何能得是法华经？’","para":true,"t":[52.7,60.15]},{"text":"佛告普贤菩萨：‘若善男子、善女人，成就四法，于如来灭后，当得是法华经，一者、为诸佛护念，二者、植众德本，三者、入正定聚，四者、发救一切众生之心，善男子、善女人，","para":false,"t":[60.75,83.19]},{"text":"如是成就四法，于如来灭后，必得是经。’","para":true,"t":[83.43,88.68]},{"text":"尔时普贤菩萨白佛言：‘世尊，于后五百岁、浊恶世中，其有受持是经典者，我当守护，除其衰患，令得安隐，使无伺求、得其便者，若魔、若魔子、若魔女、若魔民、","para":false,"t":[89.28,112.05]},{"text":"若为魔所著者、若夜叉、若罗刹、若鸠槃荼、若毗舍阇、若吉遮、若富单那、若韦陀罗、等，诸恼人者，皆不得便。","para":false,"t":[112.29,123.93]},{"text":"是人若行、若立、读诵此经，我尔时乘六牙白象王，与大菩萨众、俱诣其所，而自现身，供养守护，安慰其心，亦为供养法华经故。","para":false,"t":[124.18,138.3]},{"text":"是人若坐、思惟此经，尔时我复乘白象王、现其人前，其人若于法华经、有所忘失一句一偈，我当教之，与共读诵，还令通利。","para":false,"t":[138.55,154.83]},{"text":"尔时受持读诵法华经者、得见我身，甚大欢喜，转复精进，以见我故，即得三昧、及陀罗尼，名为旋陀罗尼、百千万亿旋陀罗尼、法音方便陀罗尼，得如是等陀罗尼。’","para":true,"t":[155.08,173.24]},{"text":"‘世尊，若后世后五百岁、浊恶世中，比丘、比丘尼、优婆塞、优婆夷，求索者，受持者，读诵者，书写者，欲修习是法华经，于三七日中、应一心精进，满三七日已，","para":false,"t":[173.84,192.8]},{"text":"我当乘六牙白象，与无量菩萨而自围绕，以一切众生所喜见身、现其人前、而为说法，示教利喜，亦复与其陀罗尼咒，得是陀罗尼故，无有非人、能破坏者，亦不为女人之所惑乱，","para":false,"t":[193.09,211.69]},{"text":"我身亦自常护是人，惟愿世尊听我说此陀罗尼咒。’","para":true,"t":[211.94,218.02]},{"text":"即于佛前而说咒曰：","para":true,"t":[218.62,221.51]},{"text":"阿檀地 檀陀婆地 檀陀婆帝 檀陀鸠舍隶 檀陀修陀隶 修陀隶 修陀罗婆底佛驮波膻祢 萨婆陀罗尼阿婆多尼 萨婆婆沙阿婆多尼 修阿婆多尼 僧伽婆履叉尼 僧伽涅伽陀尼 阿僧祇 僧伽波伽地 帝隶阿惰僧伽兜略 阿罗帝婆罗帝 萨婆僧伽三摩地伽兰地 萨婆达磨修波利刹帝 萨婆萨埵楼驮憍舍略阿冕伽地 辛阿毗吉利地帝","para":true,"t":[222.1,260.74]},{"text":"‘世尊，若有菩萨得闻是陀罗尼者，当知普贤神通之力，若法华经、行阎浮提，有受持者，应作此念：“皆是普贤威神之力。”","para":false,"t":[261.34,273.58]},{"text":"若有受持、读诵，正忆念，解其义趣，如说修行，当知是人、行普贤行，于无量无边诸佛所、深种善根，为诸如来、手摩其头。","para":false,"t":[273.83,289.63]},{"text":"若但书写，是人命终，当生忉利天上，是时八万四千天女、作众伎乐而来迎之，其人即著七宝冠，于婇女中、娱乐快乐，何况受持、读诵，正忆念，解其义趣，如说修行。","para":false,"t":[289.87,310.15]},{"text":"若有人受持，读诵，解其义趣，是人命终，为千佛授手，令不恐怖、不堕恶趣，即往兜率天上、弥勒菩萨所，弥勒菩萨、有三十二相大菩萨众所共围绕，有百千万亿天女眷属，","para":false,"t":[310.4,331.04]},{"text":"而于中生，有如是等功德利益。是故智者，应当一心自书，若使人书，受持、读诵，正忆念，如说修行。’","para":true,"t":[331.29,346.53]},{"text":"‘世尊，我今以神通力故、守护是经，于如来灭后、阎浮提内，广令流布，使不断绝。’","para":true,"t":[347.13,357.01]},{"text":"尔时释迦牟尼佛赞言：‘善哉、善哉，普贤，汝能护助是经，令多所众生、安乐利益，汝已成就不可思议功德、深大慈悲，从久远来，发阿耨多罗三藐三菩提意，而能作是神通之愿，","para":false,"t":[357.61,380.97]},{"text":"守护是经，我当以神通力，守护能受持普贤菩萨名者。’","para":true,"t":[381.22,387.1]},{"text":"‘普贤，若有受持、读诵，正忆念，修习书写是法华经者，当知是人、则见释迦牟尼佛，如从佛口、闻此经典，当知是人、供养释迦牟尼佛，当知是人、佛赞善哉，当知是人、","para":false,"t":[387.7,408.7]},{"text":"为释迦牟尼佛手摩其头，当知是人、为释迦牟尼佛衣之所覆，如是之人，不复贪著世乐，不好外道经书、手笔，亦复不喜亲近其人、及诸恶者，若屠儿、若畜猪羊鸡狗、若猎师、","para":false,"t":[408.94,430.95]},{"text":"若炫卖女色，是人心意质直，有正忆念，有福德力，是人不为三毒所恼，亦复不为嫉妒、我慢、邪慢、增上慢、所恼，是人少欲知足，能修普贤之行。’","para":true,"t":[431.2,448.12]},{"text":"‘普贤，若如来灭后、后五百岁，若有人、见受持读诵法华经者，应作是念：“此人、不久当诣道场，破诸魔众，得阿耨多罗三藐三菩提，转法轮，击法鼓，吹法螺，雨法雨，","para":false,"t":[448.72,468.56]},{"text":"当坐天人大众中、师子法座上。”’","para":true,"t":[468.81,473.05]},{"text":"‘普贤，若于后世、受持读诵是经典者，是人不复贪著衣服、卧具、饮食、资生之物，所愿不虚，亦于现世得其福报，若有人轻毁之，言、汝狂人耳，空作是行，终无所获，","para":false,"t":[473.65,494.17]},{"text":"如是罪报，当世世无眼，若有供养赞叹之者，当于今世得现果报。","para":false,"t":[494.42,503.39]},{"text":"若复见受持是经者，出其过恶，若实、若不实，此人现世得白癞病，若有轻笑之者，当世世牙齿疏缺，丑唇、平鼻，手脚缭戾，眼目角睐，身体臭秽，恶疮、脓血、水腹、短气、","para":false,"t":[503.64,524.19]},{"text":"诸恶重病，是故普贤，若见受持是经典者，当起远迎，当如敬佛。’","para":true,"t":[524.44,534.05]},{"text":"说是普贤劝发品时、恒河沙等无量无边菩萨、得百千万亿旋陀罗尼，三千大千世界微尘等诸菩萨、具普贤道。","para":false,"t":[534.64,547.44]},{"text":"佛说是经时，普贤等、诸菩萨，舍利弗等、诸声闻，及诸天、龙、人非人、等，一切大会，皆大欢喜，受持佛语，作礼而去。","para":true,"t":[547.69,562.89]}]},{"title":"后序","stem":"030_后序","dur":184.8,"src":"audio/030.mp3","pieces":[{"text":"后序","para":true,"t":[0.0,0.91]},{"text":"后秦沙门僧睿述","para":true,"t":[1.48,3.48]},{"text":"法华经者，诸佛之秘藏，众经之实体也。以华为名者，照其本也；称芬陀利者，美其盛也。所兴既玄，其旨甚婉；自非达识传之，罕有得其门者。夫百卉药木之英，物实之本也；","para":false,"t":[4.08,27.48]},{"text":"八万四千法藏者，道果之原也，故以喻焉。","para":true,"t":[27.73,32.21]},{"text":"诸华之中，莲华最胜，华尚未敷，名屈摩罗；敷而将落，名迦摩罗；处中盛时，名芬陀利。","para":false,"t":[32.81,45.74]},{"text":"未敷喻二道，将落譬泥洹，荣曜独足以喻斯典，至如般若诸经，深无不极，故道者以之而归；大无不该，故乘者以之而济；然其大略，皆以适化为大；应务之门，不得不以善权为用。","para":false,"t":[46.02,66.26]},{"text":"权之为化，悟物虽弘，于实体不足，皆属法华，固其宜矣。寻其幽旨，恢廓宏邃，所该甚远，岂徒说实归本，毕定殊涂而已耶？乃实大明觉理，囊括古今。","para":false,"t":[66.51,87.74]},{"text":"云佛寿无量永劫未足，以明其久也；分身无数，万形不足以异其体也。然则寿量定其非数，分身明其无实，普贤显其无成，多宝照其不灭。夫迈玄古以斯今，则万世同一日；","para":false,"t":[88.0,112.36]},{"text":"即万化以悟玄，则千途无异辙。夫如是者，则生生未足以期存，永寂亦未可言其灭矣。寻幽宗以绝往，则丧功于本无；控心辔于三昧，则忘期于二地。","para":true,"t":[112.61,133.22]},{"text":"经流兹土，虽复垂及百年，译者昧其虚津，灵关莫之或启；谈者乖其准格，幽踪罕得而履；徒复搜研皓首，并未有窥其门者。秦司隶校尉左将军安城侯姚嵩。","para":false,"t":[133.81,154.01]},{"text":"拟韵玄门，宅心世表，注诚斯典，信诣弥至，每思寻其文，深识译者之失。既遇鸠摩罗法师，为之传写，指其大归真，若披重霄而高蹈，登昆仑而俯盻矣。","para":false,"t":[154.26,174.1]},{"text":"于时听受领悟之僧八百余人。皆是诸方英秀，一时之杰也。是岁弘始八年。岁次鹑火。","para":true,"t":[174.35,184.18]}]}];
const $=s=>document.querySelector(s);
const au=$('#au'),col=$('#col'),main=$('#main');
const fmt=t=>{t=Math.max(0,t|0);const h=t/3600|0,m=(t%3600)/60|0,s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const store={get(k,d){try{const v=localStorage.getItem('fhj.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fhj.'+k,JSON.stringify(v))}catch(e){}}};
let ci=0,cur=-1,spans=[],userScrollAt=0,loop=false,cont=store.get('cont',true);

// 品目
$('#toc').innerHTML=D.map((c,i)=>`<li><button data-i="${i}">${c.title}<span>${fmt(c.dur)}</span></button></li>`).join('');
$('#chsel').innerHTML=D.map((c,i)=>`<option value="${i}">${c.title}（${fmt(c.dur)}）</option>`).join('');
$('#toc').addEventListener('click',e=>{const b=e.target.closest('button');if(b)openCh(+b.dataset.i,0,true)});
$('#chsel').addEventListener('change',e=>openCh(+e.target.value,0,true));

function openCh(i,t,autoplay){
  ci=i;cur=-1;const c=D[i];
  document.querySelectorAll('#toc button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  $('#chsel').value=i;
  // 第 0 句是品名，单独作为标题；其余按段落排
  let h=`<h2 class="s" data-k="0">${c.pieces[0].text}</h2><p>`;
  for(let k=1;k<c.pieces.length;k++){const p=c.pieces[k];h+=`<span class="s" data-k="${k}">${p.text}</span>`;if(p.para&&k<c.pieces.length-1)h+='</p><p>'}
  col.innerHTML=h+'</p>';spans=[...col.querySelectorAll('.s')];
  $('#err').style.display='none';
  au.src=c.src;au.playbackRate=+$('#rate').value;
  const go=()=>{au.currentTime=t||0;sync(true);if(autoplay)au.play().catch(()=>{})};
  au.addEventListener('loadedmetadata',go,{once:true});au.load();
  $('#td').textContent=fmt(c.dur);main.scrollTop=0;
  document.querySelectorAll('#toc button')[i].scrollIntoView({block:'nearest'});
  store.set('pos',{ci:i,t:t||0});
}
function idxAt(t){const P=D[ci].pieces;let lo=0,hi=P.length-1,r=0;while(lo<=hi){const m=(lo+hi)>>1;if(P[m].t[0]<=t+0.05){r=m;lo=m+1}else hi=m-1}return r}
function sync(force){
  const t=au.currentTime,c=D[ci];
  if(loop&&cur>=0&&t>c.pieces[cur].t[1]+0.2){au.currentTime=c.pieces[cur].t[0];return}
  const k=idxAt(t);
  if(k!==cur||force){
    spans.forEach((s,j)=>{s.classList.toggle('cur',j===k);s.classList.toggle('past',j<k)});
    cur=k;const s=spans[k];
    if(s&&Date.now()-userScrollAt>4000){const r=s.getBoundingClientRect(),m=main.getBoundingClientRect();
      if(r.top<m.top+m.height*.2||r.bottom>m.top+m.height*.65)main.scrollTo({top:main.scrollTop+r.top-m.top-m.height*.3})}
    $('#now').innerHTML=`<b>${c.title}</b>${c.pieces[k].text}`;
  }
  $('#tc').textContent=fmt(t);
  if(!seeking)$('#seek').value=c.dur?Math.round(t/c.dur*1000):0;
}
let seeking=false,lastSave=0;
au.addEventListener('timeupdate',()=>{sync();if(Date.now()-lastSave>3000){store.set('pos',{ci,t:au.currentTime});lastSave=Date.now()}});
au.addEventListener('play',()=>{$('#pi').innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';$('#play').setAttribute('aria-label','暂停')});
au.addEventListener('pause',()=>{$('#pi').innerHTML='<path d="M7 4v16l13-8z"/>';$('#play').setAttribute('aria-label','播放');store.set('pos',{ci,t:au.currentTime})});
au.addEventListener('ended',()=>{if(cont&&ci<D.length-1)openCh(ci+1,0,true)});
au.addEventListener('error',()=>{const e=$('#err');e.style.display='block';e.textContent='音频加载失败：'+D[ci].src+'。请检查网络，或刷新页面再试。'});
col.addEventListener('click',e=>{const s=e.target.closest('.s');if(!s)return;const k=+s.dataset.k;au.currentTime=D[ci].pieces[k].t[0];cur=-1;userScrollAt=0;sync(true);au.play().catch(()=>{})});
main.addEventListener('wheel',()=>userScrollAt=Date.now(),{passive:true});
main.addEventListener('touchmove',()=>userScrollAt=Date.now(),{passive:true});
const step=d=>{const P=D[ci].pieces;let k=Math.min(P.length-1,Math.max(0,(cur<0?0:cur)+d));
  if(d<0&&cur>=0&&au.currentTime-P[cur].t[0]>1.5)k=cur; au.currentTime=P[k].t[0];cur=-1;userScrollAt=0;sync(true)};
$('#prevS').onclick=()=>step(-1);$('#nextS').onclick=()=>step(1);
$('#play').onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
const seek=$('#seek');seek.addEventListener('input',()=>{seeking=true;$('#tc').textContent=fmt(seek.value/1000*D[ci].dur)});
seek.addEventListener('change',()=>{au.currentTime=seek.value/1000*D[ci].dur;seeking=false;userScrollAt=0;sync(true)});
$('#rate').onchange=e=>{au.playbackRate=+e.target.value;store.set('rate',e.target.value)};
const setP=(b,v)=>b.setAttribute('aria-pressed',v);
$('#loop').onclick=e=>{loop=!loop;setP(e.currentTarget,loop)};
$('#cont').onclick=e=>{cont=!cont;setP(e.currentTarget,cont);store.set('cont',cont)};
let fs=store.get('fs',22);const applyFs=()=>{document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)};
$('#fsm').onclick=()=>{fs=Math.max(16,fs-2);applyFs()};$('#fsp').onclick=()=>{fs=Math.min(34,fs+2);applyFs()};
let theme=store.get('theme','dark');const applyTheme=()=>{document.documentElement.dataset.theme=theme==='paper'?'paper':'';$('#theme').textContent=theme==='paper'?'紺纸':'素纸'};
$('#theme').onclick=()=>{theme=theme==='paper'?'dark':'paper';store.set('theme',theme);applyTheme()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;
  if(e.code==='Space'){e.preventDefault();$('#play').click()} else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)} else if(e.key==='ArrowRight'){e.preventDefault();step(1)}});
// 恢复上次位置
const r=store.get('rate','1');$('#rate').value=r;setP($('#cont'),cont);applyTheme();if(fs!==22)applyFs();
const pos=store.get('pos',{ci:0,t:0});openCh(Math.min(pos.ci||0,D.length-1),pos.t||0,false);
</script></body></html>
