<script>
const D=[{"title":"弘传序","stem":"001_弘传序","dur":146.54,"src":"audio/001.mp3","pieces":[{"text":"弘传序","para":true,"t":[0.0,1.12]},{"text":"唐终南山释道宣述","para":true,"t":[1.72,4.94]},{"text":"妙法莲华经者，统诸佛降灵之本致也。蕴结大夏，出彼千龄。东传震旦，三百余载。西晋惠帝永康年中，长安青门、炖煌菩萨竺法护者，初翻此经，名正法华。","para":false,"t":[5.52,24.76]},{"text":"东晋安帝、隆安年中，后秦弘始，龟兹沙门鸠摩罗什、次翻此经，名妙法莲华。隋氏仁寿，大兴善寺、北天竺沙门阇那、笈多、后所翻者，同名妙法。三经重遝，文旨互陈。","para":false,"t":[25.01,48.45]},{"text":"时所宗尚，皆弘秦本。自余支品、别偈，不无其流。具如叙历，故所非述。","para":true,"t":[48.7,57.94]},{"text":"夫以灵岳降灵，非大圣无由开化。适化所及，非昔缘无以导心。所以仙苑告成，机分小大之别。金河顾命，道殊半满之科。岂非教被乘时，无足核其高会。","para":false,"t":[58.54,78.62]},{"text":"是知五千退席，为进增慢之俦。五百授记，俱崇密化之迹。所以放光现瑞，开发请之教源。出定扬德，畅佛慧之宏略。朽宅通入大之文轨，化城引昔缘之不坠。","para":false,"t":[78.87,98.69]},{"text":"系珠明理性之常在，凿井显示悟之多方。词义宛然，喻陈惟远。自非大哀旷济，拔滞溺之沈流。一极悲心，拯昏迷之失性。","para":true,"t":[98.92,115.72]},{"text":"自汉至唐六百余载，总历群籍、四千余轴。受持盛者，无出此经。将非机教相扣，并智胜之遗尘。闻而深敬，俱威王之余绩。辄于经首，序而综之。庶得早净六根，仰慈尊之嘉会。","para":false,"t":[116.32,139.12]},{"text":"速成四德，趣乐土之玄猷。弘赞莫穷，永贻诸后云尔。","para":true,"t":[139.37,145.89]}]},{"title":"序品第一","stem":"002_序品第一","dur":1535.66,"src":"audio/002.mp3","pieces":[{"text":"序品第一","para":true,"t":[0.0,1.2]},{"text":"如是我闻。一时、佛住王舍城、耆阇崛山中，与大比丘众万二千人俱。皆是阿罗汉，诸漏已尽，无复烦恼，逮得己利，尽诸有结，心得自在。","para":false,"t":[1.8,23.04]},{"text":"其名曰：阿若憍陈如、摩诃迦叶、优楼频螺迦叶、伽耶迦叶、那提迦叶、舍利弗、大目犍连、摩诃迦旃延、阿冕楼驮、劫宾那、憍梵波提、离婆多、毕陵伽婆蹉、薄拘罗、","para":false,"t":[23.29,46.17]},{"text":"摩诃拘絺罗、难陀、孙陀罗难陀、富楼那弥多罗尼子、须菩提、阿难、罗侯罗，如是众所知识、大阿罗汉等。","para":true,"t":[46.42,57.1]},{"text":"复有学、无学二千人。摩诃波阇波提比丘尼，与眷属六千人俱。罗侯罗母耶输陀罗比丘尼，亦与眷属俱。菩萨摩诃萨八万人，皆于阿耨多罗三藐三菩提不退转，皆得陀罗尼。","para":false,"t":[57.7,78.57]},{"text":"乐说辩才，转不退转法轮。供养无量百千诸佛，于诸佛所、植众德本，常为诸佛之所称叹。以慈修身，善入佛慧。通达大智，到于彼岸。名称普闻无量世界，能度无数百千众生。","para":false,"t":[78.83,100.35]},{"text":"其名曰：文殊师利菩萨、观世音菩萨、得大势菩萨、常精进菩萨、不休息菩萨、宝掌菩萨、药王菩萨、勇施菩萨、宝月菩萨、月光菩萨、满月菩萨、大力菩萨、无量力菩萨、","para":false,"t":[100.6,119.24]},{"text":"越三界菩萨、跋陀婆罗菩萨、弥勒菩萨、宝积菩萨、导师菩萨，如是等菩萨摩诃萨八万人俱。","para":true,"t":[119.49,129.63]},{"text":"尔时释提桓因，与其眷属二万天子俱。复有名月天子、普香天子、宝光天子、四大天王，与其眷属万天子俱。自在天子、大自在天子，与其眷属三万天子俱。","para":false,"t":[130.21,147.21]},{"text":"娑婆世界主、梵天王、尸弃大梵、光明大梵等，与其眷属万二千天子俱。","para":false,"t":[147.46,155.39]},{"text":"有八龙王、难陀龙王、跋难陀龙王、娑伽罗龙王、和修吉龙王、德叉迦龙王、阿那婆达多龙王、摩那斯龙王、优钵罗龙王等，各与若干百千眷属俱。","para":false,"t":[155.63,170.39]},{"text":"有四紧那罗王、法紧那罗王、妙法紧那罗王、大法紧那罗王、持法紧那罗王，各与若干百千眷属俱。","para":false,"t":[170.64,180.85]},{"text":"有四乾闼婆王、乐乾闼婆王、乐音乾闼婆王、美乾闼婆王、美音乾闼婆王，各与若干百千眷属俱。","para":false,"t":[181.09,191.65]},{"text":"有四阿修罗王、婆稚阿修罗王、佉罗骞驮阿修罗王、毗摩质多罗阿修罗王、罗侯阿修罗王，各与若干百千眷属俱。","para":false,"t":[191.9,204.1]},{"text":"有四迦楼罗王、大威德迦楼罗王、大身迦楼罗王、大满迦楼罗王、如意迦楼罗王，各与若干百千眷属俱。韦提希子阿阇世王，与若干百千眷属俱。各礼佛足，退坐一面。","para":true,"t":[204.35,222.56]},{"text":"尔时世尊，四众围绕，供养、恭敬、尊重、赞叹。为诸菩萨说大乘经，名无量义，教菩萨法，佛所护念。佛说此经已，结跏趺坐，入于无量义处三昧，身心不动。","para":false,"t":[223.21,242.59]},{"text":"是时天雨曼陀罗华，摩诃曼陀罗华，曼殊沙华，摩诃曼殊沙华，而散佛上、及诸大众。普佛世界，六种震动。","para":true,"t":[242.84,259.05]},{"text":"尔时会中，比丘、比丘尼、优婆塞、优婆夷、天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人，及诸小王、转轮圣王。","para":false,"t":[259.64,277.0]},{"text":"是诸大众，得未曾有，欢喜合掌，一心观佛。","para":true,"t":[277.25,282.85]},{"text":"尔时佛放眉间白毫相光，照东方万八千世界，靡不周遍，下至阿鼻地狱，上至阿迦尼吒天。于此世界，尽见彼土六趣众生，又见彼土现在诸佛。及闻诸佛所说经法。","para":false,"t":[283.45,301.77]},{"text":"并见彼诸比丘、比丘尼、优婆塞、优婆夷、诸修行得道者。复见诸菩萨摩诃萨、种种因缘、种种信解、种种相貌、行菩萨道。复见诸佛般涅槃者。","para":false,"t":[302.03,319.22]},{"text":"复见诸佛般涅槃后，以佛舍利、起七宝塔。","para":true,"t":[319.47,324.15]},{"text":"尔时弥勒菩萨作是念：‘今者、世尊现神变相，以何因缘而有此瑞。今佛世尊入于三昧，是不可思议、现稀有事，当以问谁，谁能答者。’","para":false,"t":[324.75,342.15]},{"text":"复作此念：‘是文殊师利、法王之子，已曾亲近供养过去无量诸佛，必应见此稀有之相，我今当问。’","para":true,"t":[342.4,353.68]},{"text":"尔时比丘、比丘尼、优婆塞、优婆夷、及诸天龙、鬼神等，咸作此念：‘是佛光明神通之相，今当问谁？’","para":true,"t":[354.28,365.35]},{"text":"尔时弥勒菩萨，欲自决疑，又观四众比丘、比丘尼、优婆塞、优婆夷、及诸天龙、鬼神、等，众会之心，而问文殊师利言：‘以何因缘、而有此瑞、神通之相，放大光明，","para":false,"t":[365.96,385.7]},{"text":"照于东方万八千土，悉见彼佛国界庄严？’","para":true,"t":[385.93,391.5]},{"text":"于是弥勒菩萨欲重宣此义，以偈问曰：","para":true,"t":[392.09,397.42]},{"text":"文殊师利，导师何故、眉间白毫，大光普照。","para":true,"t":[398.05,403.7]},{"text":"雨曼陀罗、曼殊沙华，栴檀香风，悦可众心。","para":true,"t":[404.29,410.13]},{"text":"以是因缘，地皆严净，而此世界、六种震动。","para":true,"t":[410.73,417.21]},{"text":"时四部众、咸皆欢喜，身意快然，得未曾有。","para":true,"t":[417.81,424.09]},{"text":"眉间光明，照于东方，万八千土，皆如金色，","para":true,"t":[424.68,430.89]},{"text":"从阿鼻狱、上至有顶。诸世界中，六道众生，","para":true,"t":[431.49,437.69]},{"text":"生死所趋、善恶业缘、受报好丑，于此悉见。","para":true,"t":[438.29,444.77]},{"text":"又睹诸佛、圣主师子、演说经典，微妙第一。","para":true,"t":[445.37,450.52]},{"text":"其声清净，出柔软音，教诸菩萨、无数亿万，","para":true,"t":[451.09,456.65]},{"text":"梵音深妙，令人乐闻。各于世界，讲说正法、","para":true,"t":[457.25,462.9]},{"text":"种种因缘。以无量喻，照明佛法，开悟众生。","para":true,"t":[463.49,469.61]},{"text":"若人遭苦，厌老病死，为说涅槃，尽诸苦际。","para":true,"t":[470.21,476.01]},{"text":"若人有福，曾供养佛，志求胜法，为说缘觉。","para":true,"t":[476.61,482.22]},{"text":"若有佛子、修种种行，求无上慧，为说净道。","para":true,"t":[482.81,488.08]},{"text":"文殊师利，我住于此，见闻若斯，及千亿事，","para":true,"t":[488.69,494.01]},{"text":"如是众多，今当略说。我见彼土，恒沙菩萨，","para":true,"t":[494.61,500.05]},{"text":"种种因缘、而求佛道。或有行施，金银珊瑚、","para":true,"t":[500.65,505.66]},{"text":"真珠摩尼、砗磲玛瑙、金刚诸珍，奴婢车乘、","para":true,"t":[506.26,511.85]},{"text":"宝饰辇舆，欢喜布施。回向佛道，愿得是乘，","para":true,"t":[512.45,518.69]},{"text":"三界第一，诸佛所叹。或有菩萨，驷马宝车、","para":true,"t":[519.29,525.25]},{"text":"栏楯华盖、轩饰布施。复见菩萨，身肉手足、","para":true,"t":[525.85,533.29]},{"text":"及妻子施，求无上道。又见菩萨，头目身体、","para":true,"t":[533.89,540.49]},{"text":"欣乐施与，求佛智慧。文殊师利，我见诸王，","para":true,"t":[541.09,547.33]},{"text":"往诣佛所、问无上道，便舍乐土、宫殿臣妾，","para":true,"t":[547.93,552.45]},{"text":"剃除须发、而被法服。或见菩萨，而作比丘，","para":true,"t":[553.05,559.83]},{"text":"独处闲静，乐诵经典。又见菩萨，勇猛精进，","para":true,"t":[560.4,567.24]},{"text":"入于深山，思惟佛道。又见离欲，常处空闲，","para":true,"t":[567.82,574.66]},{"text":"深修禅定，得五神通。又见菩萨，安禅合掌，","para":true,"t":[575.26,583.14]},{"text":"以千万偈、赞诸法王。复见菩萨，智深志固，","para":true,"t":[583.74,590.1]},{"text":"能问诸佛，闻悉受持。又见佛子，定慧具足，","para":true,"t":[590.7,597.3]},{"text":"以无量喻、为众讲法，欣乐说法、化诸菩萨，","para":true,"t":[597.9,602.88]},{"text":"破魔兵众、而击法鼓。又见菩萨，寂然宴默，","para":true,"t":[603.46,609.62]},{"text":"天龙恭敬，不以为喜。又见菩萨，处林放光，","para":true,"t":[610.22,616.8]},{"text":"济地狱苦，令入佛道。又见佛子，未尝睡眠，","para":true,"t":[617.38,623.76]},{"text":"经行林中，勤求佛道。又见具戒，威仪无缺，","para":true,"t":[624.4,630.18]},{"text":"净如宝珠，以求佛道。又见佛子，住忍辱力，","para":true,"t":[630.78,637.76]},{"text":"增上慢人，恶骂捶打，皆悉能忍，以求佛道。","para":true,"t":[638.34,643.99]},{"text":"又见菩萨，离诸戏笑、及痴眷属，亲近智者，","para":true,"t":[644.58,650.18]},{"text":"一心除乱，摄念山林、亿千万岁，以求佛道。","para":true,"t":[650.78,656.66]},{"text":"或见菩萨，肴膳饮食、百种汤药、施佛及僧。","para":true,"t":[657.26,663.34]},{"text":"名衣上服、价值千万，或无价衣，施佛及僧。","para":true,"t":[663.94,670.18]},{"text":"千万亿种、栴檀宝舍、众妙卧具、施佛及僧。","para":true,"t":[670.78,676.75]},{"text":"清净园林、华果茂盛、流泉浴池、施佛及僧。","para":true,"t":[677.34,683.7]},{"text":"如是等施，种果微妙，欢喜无厌，求无上道。","para":true,"t":[684.3,691.14]},{"text":"或有菩萨，说寂灭法，种种教诏，无数众生。","para":true,"t":[691.74,697.82]},{"text":"或见菩萨，观诸法性、无有二相，犹如虚空。","para":true,"t":[698.42,703.94]},{"text":"又见佛子，心无所著，以此妙慧、求无上道。","para":true,"t":[704.54,709.9]},{"text":"文殊师利，又有菩萨，佛灭度后，供养舍利。","para":true,"t":[710.5,715.28]},{"text":"又见佛子，造诸塔庙、无数恒沙，严饰国界，","para":true,"t":[715.86,721.06]},{"text":"宝塔高妙、五千由旬，纵广正等、二千由旬。","para":true,"t":[721.66,726.94]},{"text":"一一塔庙，各千幢幡，珠交露幔，宝铃和鸣。","para":true,"t":[727.57,733.53]},{"text":"诸天龙神、人及非人，香华伎乐，常以供养。","para":true,"t":[734.13,741.21]},{"text":"文殊师利，诸佛子等，为供舍利，严饰塔庙，","para":true,"t":[741.8,747.3]},{"text":"国界自然，殊特妙好，如天树王，其华开敷，","para":true,"t":[747.92,753.76]},{"text":"佛放一光。我及众会，见此国界，种种殊妙，","para":true,"t":[754.37,761.6]},{"text":"诸佛神力、智慧稀有，放一净光，照无量国。","para":true,"t":[762.2,769.64]},{"text":"我等见此，得未曾有。佛子文殊，愿决众疑，","para":true,"t":[770.24,776.14]},{"text":"四众欣仰、瞻仁及我，世尊何故，放斯光明。","para":true,"t":[776.72,783.13]},{"text":"佛子时答，决疑令喜，何所饶益、演斯光明。","para":true,"t":[783.72,790.0]},{"text":"佛坐道场、所得妙法，为欲说此，为当授记，","para":true,"t":[790.6,796.53]},{"text":"示诸佛土 众宝严净、及见诸佛。此非小缘，","para":true,"t":[797.12,803.12]},{"text":"文殊当知。四众龙神，瞻察仁者、为说何等。","para":true,"t":[803.72,808.88]},{"text":"尔时文殊师利语弥勒菩萨摩诃萨、及诸大士，善男子等：‘如我惟忖，今佛世尊欲说大法，雨大法雨，吹大法螺，击大法鼓，演大法义。","para":false,"t":[809.48,827.2]},{"text":"诸善男子，我于过去诸佛，曾见此瑞，放斯光已，即说大法。是故当知今佛现光，亦复如是，欲令众生，咸得闻知一切世间难信之法，故现斯瑞。：‘","para":true,"t":[827.45,846.49]},{"text":"‘诸善男子，如过去无量无边不可思议阿僧祇劫，尔时有佛，号日月灯明如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊，演说正法，初善、","para":false,"t":[847.1,868.37]},{"text":"中善、后善，其义深远，其语巧妙，纯一无杂，具足清白梵行之相。为求声闻者、说应四谛法，度生老病死，究竟涅槃。为求辟支佛者、说应十二因缘法。","para":false,"t":[868.63,886.69]},{"text":"为诸菩萨、说应六波罗蜜，令得阿耨多罗三藐三菩提，成一切种智。’","para":true,"t":[886.91,894.17]},{"text":"‘次复有佛、亦名日月灯明，次复有佛、亦名日月灯明，如是二万佛、皆同一字，号日月灯明，又同一姓，姓颇罗堕。弥勒当知，初佛后佛，皆同一字，名日月灯明，十号具足。","para":false,"t":[894.75,916.95]},{"text":"所可说法，初中后善。其最后佛，未出家时、有八王子，一名有意，二名善意，三名无量意，四名宝意，五名增意，六名除疑意，七名向意，八名法意。","para":false,"t":[917.2,934.32]},{"text":"是八王子，威德自在，各领四天下。是诸王子，闻父出家，得阿耨多罗三藐三菩提。悉舍王位，亦随出家，发大乘意，常修梵行，皆为法师，已于千万佛所、植诸善本。’","para":true,"t":[934.57,952.69]},{"text":"‘是时日月灯明佛说大乘经，名无量义、教菩萨法、佛所护念。说是经已，即于大众中、结跏趺坐，入于无量义处三昧，身心不动。","para":false,"t":[953.29,969.19]},{"text":"是时、天雨曼陀罗华，摩诃曼陀罗华，曼殊沙华，摩诃曼殊沙华，而散佛上、及诸大众。普佛世界，六种震动。","para":false,"t":[969.46,983.74]},{"text":"尔时会中，比丘、比丘尼、优婆塞、优婆夷、天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、及诸小王、转轮圣王、等。","para":false,"t":[984.0,1000.88]},{"text":"是诸大众，得未曾有，欢喜合掌，一心观佛。’","para":true,"t":[1001.13,1007.09]},{"text":"‘尔时如来放眉间白毫相光，照东方万八千佛土，靡不周遍，如今所见、是诸佛土。弥勒当知，尔时会中，有二十亿菩萨、乐欲听法。","para":false,"t":[1007.69,1023.66]},{"text":"是诸菩萨，见此光明、普照佛土，得未曾有，欲知此光所为因缘。时有菩萨，名曰妙光，有八百弟子。","para":false,"t":[1023.9,1037.25]},{"text":"是时日月灯明佛从三昧起，因妙光菩萨、说大乘经，名妙法莲华、教菩萨法、佛所护念。六十小劫、不起于座。时会听者、亦坐一处，六十小劫、身心不动，听佛所说，谓如食顷。","para":false,"t":[1037.51,1059.27]},{"text":"是时众中，无有一人、若身若心而生懈倦。’","para":true,"t":[1059.52,1065.92]},{"text":"‘日月灯明佛于六十小劫说是经已，即于梵、魔、沙门、婆罗门、及天、人、阿修罗、众中，而宣此言，如来于今日中夜，当入无余涅槃。","para":false,"t":[1066.52,1083.4]},{"text":"时有菩萨，名曰德藏，日月灯明佛即授其记。告诸比丘：“是德藏菩萨，次当作佛，号曰净身，多陀阿伽度、阿罗诃、三藐三佛陀。”佛授记已，便于中夜、入无余涅槃。","para":false,"t":[1083.65,1105.69]},{"text":"佛灭度后，妙光菩萨持妙法莲华经，满八十小劫、为人演说。日月灯明佛八子、皆师妙光。妙光教化，令其坚固阿耨多罗三藐三菩提。","para":false,"t":[1105.94,1121.94]},{"text":"是诸王子、供养无量百千万亿佛已，皆成佛道，其最后成佛者，名曰燃灯。八百弟子中，有一人、号曰求名，贪著利养，虽复读诵众经，而不通利，多所忘失，故号求名。","para":false,"t":[1122.19,1142.87]},{"text":"是人亦以种诸善根因缘故，得值无量百千万亿诸佛，供养、恭敬，尊重、赞叹。’","para":true,"t":[1143.12,1153.45]},{"text":"‘弥勒当知，尔时妙光菩萨、岂异人乎，我身是也，求名菩萨，汝身是也。今见此瑞、与本无异，是故惟忖，今日如来当说大乘经，名妙法莲华、教菩萨法、佛所护念。’","para":true,"t":[1154.04,1175.36]},{"text":"尔时文殊师利于大众中，欲重宣此义，而说偈言：","para":true,"t":[1175.96,1182.08]},{"text":"我念过去世，无量无数劫，有佛人中尊，号日月灯明。","para":true,"t":[1182.68,1190.08]},{"text":"世尊演说法，度无量众生、无数亿菩萨，令入佛智慧。","para":true,"t":[1190.68,1197.12]},{"text":"佛未出家时、所生八王子，见大圣出家，亦随修梵行。","para":true,"t":[1197.72,1204.04]},{"text":"时佛说大乘，经名无量义，于诸大众中，而为广分别。","para":true,"t":[1204.64,1211.14]},{"text":"佛说此经已，即于法座上、跏趺坐三昧，名无量义处。","para":true,"t":[1211.76,1217.96]},{"text":"天雨曼陀华，天鼓自然鸣，诸天龙鬼神，供养人中尊。","para":true,"t":[1218.56,1226.53]},{"text":"一切诸佛土，即时大震动。佛放眉间光，现诸稀有事，","para":true,"t":[1227.12,1235.44]},{"text":"此光照东方 万八千佛土，示一切众生，生死业报处。","para":true,"t":[1236.04,1243.09]},{"text":"有见诸佛土，以众宝庄严，琉璃玻璃色，斯由佛光照。","para":true,"t":[1243.68,1253.41]},{"text":"及见诸天人、龙神夜叉众、乾闼紧那罗，各供养其佛。","para":true,"t":[1254.04,1261.68]},{"text":"又见诸如来，自然成佛道，身色如金山，端严甚微妙，","para":true,"t":[1262.27,1269.54]},{"text":"如净琉璃中，内现真金像。世尊在大众，敷演深法义。","para":true,"t":[1270.12,1278.4]},{"text":"一一诸佛土，声闻众无数，因佛光所照，悉见彼大众。","para":true,"t":[1279.0,1286.84]},{"text":"或有诸比丘，在于山林中，精进持净戒，犹如护明珠。","para":true,"t":[1287.44,1295.2]},{"text":"又见诸菩萨，行施忍辱等，其数如恒沙，斯由佛光照。","para":true,"t":[1295.8,1302.06]},{"text":"又见诸菩萨，深入诸禅定，身心寂不动，以求无上道。","para":true,"t":[1302.64,1309.92]},{"text":"又见诸菩萨，知法寂灭相，各于其国土，说法求佛道。","para":true,"t":[1310.52,1316.96]},{"text":"尔时四部众，见日月灯佛、现大神通力，其心皆欢喜，","para":true,"t":[1317.56,1325.65]},{"text":"各各自相问，是事何因缘。天人所奉尊、适从三昧起，","para":true,"t":[1326.24,1333.14]},{"text":"赞妙光菩萨，汝为世间眼，一切所归信，能奉持法藏，","para":true,"t":[1333.76,1340.76]},{"text":"如我所说法，唯汝能证知。世尊既赞叹，令妙光欢喜，","para":true,"t":[1341.36,1348.1]},{"text":"说是法华经，满六十小劫、不起于此座。所说上妙法，","para":true,"t":[1348.71,1355.76]},{"text":"是妙光法师、悉皆能受持。佛说是法华，令众欢喜已，","para":true,"t":[1356.35,1363.08]},{"text":"寻即于是日，告于天人众，诸法实相义，已为汝等说，","para":true,"t":[1363.67,1372.74]},{"text":"我今于中夜，当入于涅槃。汝一心精进，当离于放逸，","para":true,"t":[1373.32,1378.96]},{"text":"诸佛甚难值，亿劫时一遇。世尊诸子等、闻佛入涅槃，","para":true,"t":[1379.56,1387.6]},{"text":"各各怀悲恼，佛灭一何速。圣主法之王，安慰无量众，","para":true,"t":[1388.2,1396.68]},{"text":"我若灭度时，汝等勿忧怖，是德藏菩萨，于无漏实相、","para":true,"t":[1397.28,1404.26]},{"text":"心已得通达，其次当作佛，号曰为净身，亦度无量众。","para":true,"t":[1404.84,1411.2]},{"text":"佛此夜灭度，如薪尽火灭，分布诸舍利，而起无量塔。","para":true,"t":[1411.79,1419.28]},{"text":"比丘比丘尼，其数如恒沙，倍复加精进，以求无上道。","para":true,"t":[1419.87,1426.72]},{"text":"是妙光法师，奉持佛法藏，八十小劫中、广宣法华经。","para":true,"t":[1427.32,1434.29]},{"text":"是诸八王子，妙光所开化，坚固无上道，当见无数佛。","para":true,"t":[1434.88,1441.96]},{"text":"供养诸佛已，随顺行大道，相继得成佛，转次而授记。","para":true,"t":[1442.56,1449.45]},{"text":"最后天中天，号曰燃灯佛，诸仙之导师，度脱无量众。","para":true,"t":[1450.04,1458.64]},{"text":"是妙光法师，时有一弟子，心常怀懈怠，贪著于名利，","para":true,"t":[1459.24,1464.69]},{"text":"求名利无厌，多游族姓家，弃舍所习诵，废忘不通利。","para":true,"t":[1465.29,1472.16]},{"text":"以是因缘故，号之为求名。亦行众善业，得见无数佛，","para":true,"t":[1472.76,1480.48]},{"text":"供养于诸佛，随顺行大道，具六波罗蜜，今见释师子。","para":true,"t":[1481.08,1487.68]},{"text":"其后当作佛，号名曰弥勒，广度诸众生，其数无有量。","para":true,"t":[1488.3,1496.12]},{"text":"彼佛灭度后，懈怠者汝是，妙光法师者，今则我身是。","para":true,"t":[1496.74,1505.44]},{"text":"我见灯明佛，本光瑞如此，以是知今佛、欲说法华经。","para":true,"t":[1506.04,1512.48]},{"text":"今相如本瑞，是诸佛方便，今佛放光明，助发实相义。","para":true,"t":[1513.08,1519.72]},{"text":"诸人今当知，合掌一心待，佛当雨法雨，充足求道者。","para":true,"t":[1520.31,1527.24]},{"text":"诸求三乘人，若有疑悔者，佛当为除断，令尽无有余。","para":true,"t":[1527.83,1535.0]}]},{"title":"方便品第二","stem":"003_方便品第二","dur":1863.07,"src":"audio/003.mp3","pieces":[{"text":"方便品第二","para":true,"t":[0.0,1.48]},{"text":"尔时，世尊从三昧安详而起，告舍利弗：‘诸佛智慧，甚深无量，其智慧门，难解难入，一切声闻、辟支佛、所不能知。所以者何。","para":false,"t":[2.08,21.08]},{"text":"佛曾亲近百千万亿无数诸佛，尽行诸佛无量道法，勇猛精进，名称普闻。成就甚深未曾有法，随宜所说，意趣难解。","para":false,"t":[21.37,34.81]},{"text":"舍利弗，吾从成佛已来，种种因缘，种种譬喻，广演言教，无数方便、引导众生，令离诸著。所以者何。如来方便知见波罗蜜、皆已具足。","para":false,"t":[35.06,52.98]},{"text":"舍利弗，如来知见，广大深远，无量无碍，力、无所畏、禅定、解脱三昧、深入无际，成就一切未曾有法。舍利弗，如来能种种分别，巧说诸法，言辞柔软，悦可众心。","para":false,"t":[53.23,72.15]},{"text":"舍利弗，取要言之，无量无边未曾有法，佛悉成就。’","para":true,"t":[72.39,79.6]},{"text":"‘止，舍利弗，不须复说。所以者何。佛所成就第一稀有难解之法，唯佛与佛、乃能究尽诸法实相。","para":false,"t":[80.21,92.42]},{"text":"所谓诸法、如是相，如是性，如是体，如是力，如是作，如是因，如是缘，如是果，如是报，如是本末究竟等。’","para":true,"t":[92.65,105.89]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[106.49,110.61]},{"text":"世雄不可量，诸天及世人、一切众生类，无能知佛者。","para":true,"t":[111.21,117.81]},{"text":"佛力无所畏、解脱诸三昧，及佛诸余法，无能测量者。","para":true,"t":[118.41,125.24]},{"text":"本从无数佛，具足行诸道，甚深微妙法，难见难可了。","para":true,"t":[125.85,134.57]},{"text":"于无量亿劫，行此诸道已，道场得成果，我已悉知见。","para":true,"t":[135.17,142.37]},{"text":"如是大果报，种种性相义，我及十方佛，乃能知是事。","para":true,"t":[142.97,148.99]},{"text":"是法不可示，言辞相寂灭，诸余众生类，无有能得解，","para":true,"t":[149.57,155.37]},{"text":"除诸菩萨众、信力坚固者。诸佛弟子众，曾供养诸佛，","para":true,"t":[155.97,161.89]},{"text":"一切漏已尽，住是最后身，如是诸人等，其力所不堪。","para":true,"t":[162.49,169.98]},{"text":"假使满世间，皆如舍利弗，尽思共度量，不能测佛智。","para":true,"t":[170.57,177.77]},{"text":"正使满十方、皆如舍利弗，及余诸弟子、亦满十方刹，","para":true,"t":[178.37,185.14]},{"text":"尽思共度量，亦复不能知。辟支佛利智，无漏最后身，","para":true,"t":[185.73,194.77]},{"text":"亦满十方界，其数如竹林，斯等共一心，于亿无量劫、","para":true,"t":[195.37,203.17]},{"text":"欲思佛实智，莫能知少分。新发意菩萨，供养无数佛，","para":true,"t":[203.77,211.21]},{"text":"了达诸义趣，又能善说法，如稻麻竹苇，充满十方刹，","para":true,"t":[211.82,218.79]},{"text":"一心以妙智，于恒河沙劫、咸皆共思量，不能知佛智。","para":true,"t":[219.37,226.08]},{"text":"不退诸菩萨，其数如恒沙，一心共思求，亦复不能知。","para":true,"t":[226.69,235.13]},{"text":"又告舍利弗，无漏不思议、甚深微妙法，我今已具得，","para":true,"t":[235.73,243.13]},{"text":"唯我知是相，十方佛亦然。舍利弗当知，诸佛语无异，","para":true,"t":[243.73,250.81]},{"text":"于佛所说法，当生大信力，世尊法久后，要当说真实。","para":true,"t":[251.4,258.58]},{"text":"告诸声闻众、及求缘觉乘，我令脱苦缚，逮得涅槃者，","para":true,"t":[259.17,265.85]},{"text":"佛以方便力，示以三乘教，众生处处著，引之令得出。","para":true,"t":[266.45,276.09]},{"text":"尔时大众中，有诸声闻漏尽阿罗汉阿若憍陈如、等，千二百人，及发声闻辟支佛心、比丘、比丘尼、优婆塞、优婆夷，各作是念：‘今者、世尊何故殷勤称叹方便、而作是言，","para":false,"t":[276.69,297.77]},{"text":"佛所得法，甚深难解，有所言说，意趣难知，一切声闻、辟支佛、所不能及。佛说一解脱义，我等亦得此法，到于涅槃，而今不知是义所趋。’","para":true,"t":[298.02,316.14]},{"text":"尔时舍利弗知四众心疑，自亦未了，而白佛言：‘世尊，何因何缘，殷勤称叹诸佛第一方便、甚深微妙、难解之法。我自昔来，未曾从佛、闻如是说，今者、四众咸皆有疑。","para":false,"t":[316.74,339.18]},{"text":"惟愿世尊敷演斯事，世尊何故殷勤称叹甚深微妙难解之法。’","para":true,"t":[339.43,346.43]},{"text":"尔时舍利弗欲重宣此义，而说偈言：","para":true,"t":[347.03,350.87]},{"text":"慧日大圣尊，久乃说是法，自说得如是力无畏三昧、","para":true,"t":[351.47,358.24]},{"text":"禅定解脱等，不可思议法。道场所得法，无能发问者。","para":true,"t":[358.87,365.19]},{"text":"我意难可测，亦无能问者。无问而自说，称叹所行道，","para":true,"t":[365.79,373.63]},{"text":"智慧甚微妙，诸佛之所得。无漏诸罗汉、及求涅槃者，","para":true,"t":[374.23,380.81]},{"text":"今皆堕疑网，佛何故说是。其求缘觉者、比丘比丘尼、","para":true,"t":[381.39,389.69]},{"text":"诸天龙鬼神、及乾闼婆等，相视怀犹豫，瞻仰两足尊，","para":true,"t":[390.27,396.19]},{"text":"是事为云何，愿佛为解说。于诸声闻众，佛说我第一。","para":true,"t":[396.79,403.44]},{"text":"我今自于智、疑惑不能了，为是究竟法，为是所行道。","para":true,"t":[404.03,411.55]},{"text":"佛口所生子，合掌瞻仰待，愿出微妙音，时为如实说。","para":true,"t":[412.15,420.23]},{"text":"诸天龙神等，其数如恒沙，求佛诸菩萨，大数有八万，","para":true,"t":[420.83,426.87]},{"text":"又诸万亿国、转轮圣王至，合掌以敬心，欲闻具足道。","para":true,"t":[427.47,435.87]},{"text":"尔时佛告舍利弗：‘止，止，不须复说。若说是事，一切世间诸天、及人、皆当惊疑。’舍利弗重白佛言：‘世尊，惟愿说之，惟愿说之。所以者何。","para":false,"t":[436.47,457.85]},{"text":"是会无数百千万亿阿僧祇众生，曾见诸佛，诸根猛利，智慧明了，闻佛所说，则能敬信。’","para":true,"t":[458.12,467.85]},{"text":"尔时舍利弗欲重宣此义，而说偈言：","para":true,"t":[468.44,472.52]},{"text":"法王无上尊，惟说愿勿虑。是会无量众，有能敬信者。","para":true,"t":[473.12,478.8]},{"text":"佛复止舍利弗：‘若说是事，一切世间天、人、阿修罗、皆当惊疑，增上慢比丘、将坠于大坑。’","para":true,"t":[479.4,492.24]},{"text":"尔时世尊重说偈言：","para":true,"t":[492.84,495.72]},{"text":"止止不须说，我法妙难思，诸增上慢者，闻必不敬信。","para":true,"t":[496.32,503.0]},{"text":"尔时舍利弗重白佛言：‘世尊，惟愿说之，惟愿说之。今此会中，如我等比、百千万亿，世世已曾从佛受化。如此人等，必能敬信，长夜安隐，多所饶益。’","para":true,"t":[503.6,528.2]},{"text":"尔时舍利弗欲重宣此义，而说偈言：","para":true,"t":[528.8,533.21]},{"text":"无上两足尊，愿说第一法，我为佛长子，惟垂分别说。","para":true,"t":[533.8,541.8]},{"text":"是会无量众，能敬信此法，佛已曾世世，教化如是等，","para":true,"t":[542.4,549.84]},{"text":"皆一心合掌，欲听受佛语。我等千二百、及余求佛者，","para":true,"t":[550.44,559.2]},{"text":"愿为此众故，惟垂分别说。是等闻此法，则生大欢喜。","para":true,"t":[559.8,567.64]},{"text":"尔时世尊告舍利弗：‘汝已殷勤三请，岂得不说。汝今谛听，善思念之，吾当为汝分别解说。’说此语时，会中有比丘、比丘尼、优婆塞、优婆夷、五千人等，即从座起，礼佛而退。","para":false,"t":[568.24,587.4]},{"text":"所以者何。此辈罪根深重，及增上慢，未得谓得，未证谓证，有如此失，是以不住。世尊默然而不制止。","para":true,"t":[587.65,603.05]},{"text":"尔时佛告舍利弗：‘我今此众，无复枝叶，纯有贞实。舍利弗，如是增上慢人，退亦佳矣。汝今善听，当为汝说。舍利弗言，唯、然，世尊，愿乐欲闻。’","para":true,"t":[603.65,625.85]},{"text":"佛告舍利弗：","para":true,"t":[626.45,627.77]},{"text":"‘如是妙法，诸佛如来、时乃说之，如优昙钵华，时一现耳。舍利弗，汝等当信佛之所说，言不虚妄。舍利弗，诸佛随宜说法，意趣难解。所以者何。","para":false,"t":[628.37,651.05]},{"text":"我以无数方便、种种因缘、譬喻言辞、演说诸法，是法、非思量分别之所能解，唯有诸佛乃能知之。所以者何。诸佛世尊唯以一大事因缘故、出现于世。","para":false,"t":[651.3,671.14]},{"text":"舍利弗，云何名诸佛世尊唯以一大事因缘故、出现于世。诸佛世尊欲令众生开佛知见、使得清净故，出现于世。欲示众生、佛之知见故，出现于世。欲令众生悟佛知见故，出现于世。","para":false,"t":[671.38,692.99]},{"text":"欲令众生入佛知见道故，出现于世。舍利弗，是为诸佛以一大事因缘故、出现于世。’","para":true,"t":[693.24,702.92]},{"text":"佛告舍利弗：‘诸佛如来但教化菩萨，诸有所作，常为一事，唯以佛之知见、示悟众生。舍利弗，如来但以一佛乘故，为众生说法，无有余乘，若二、若三。","para":false,"t":[703.52,724.97]},{"text":"舍利弗，一切十方诸佛，法亦如是。’","para":true,"t":[725.21,729.97]},{"text":"‘舍利弗，过去诸佛，以无量无数方便、种种因缘、譬喻言辞、而为众生演说诸法，是法、皆为一佛乘故。是诸众生，从诸佛闻法，究竟皆得一切种智。","para":false,"t":[730.57,747.29]},{"text":"舍利弗，未来诸佛、当出于世，亦以无量无数方便、种种因缘、譬喻言辞、而为众生演说诸法，是法、皆为一佛乘故。是诸众生，从佛闻法，究竟皆得一切种智。","para":false,"t":[747.54,765.5]},{"text":"舍利弗，现在十方无量百千万亿佛土中、诸佛世尊，多所饶益、安乐众生，是诸佛、亦以无量无数方便、种种因缘、譬喻言辞、而为众生演说诸法，是法、皆为一佛乘故。","para":false,"t":[765.75,785.15]},{"text":"是诸众生，从佛闻法，究竟皆得一切种智。舍利弗，是诸佛、但教化菩萨，欲以佛之知见、示众生故，欲以佛之知见、悟众生故，欲令众生入佛之知见故。","para":false,"t":[785.4,803.62]},{"text":"舍利弗，我今亦复如是，知诸众生有种种欲，深心所著，随其本性，以种种因缘、譬喻言辞、方便力、而为说法。舍利弗，如此，皆为得一佛乘、一切种智故。’","para":true,"t":[803.88,822.57]},{"text":"‘舍利弗，十方世界中，尚无二乘，何况有三。舍利弗，诸佛出于五浊恶世，所谓劫浊、烦恼浊、众生浊、见浊、命浊。","para":false,"t":[823.17,838.87]},{"text":"如是舍利弗，劫浊乱时，众生垢重，悭贪嫉妒，成就诸不善根故，诸佛以方便力，于一佛乘、分别说三。","para":false,"t":[839.1,851.11]},{"text":"舍利弗，若我弟子，自谓阿罗汉、辟支佛者，不闻不知诸佛如来、但教化菩萨事，此非佛弟子，非阿罗汉，非辟支佛。’","para":true,"t":[851.34,865.51]},{"text":"‘又、舍利弗，是诸比丘、比丘尼、自谓已得阿罗汉，是最后身，究竟涅槃，便不复志求阿耨多罗三藐三菩提，当知此辈皆是增上慢人。所以者何。","para":false,"t":[866.11,885.35]},{"text":"若有比丘、实得阿罗汉，若不信此法，无有是处。除佛灭度后，现前无佛。所以者何。佛灭度后，如是等经、受持读诵解义者，是人难得。若遇余佛，于此法中、便得决了。","para":false,"t":[885.6,907.56]},{"text":"舍利弗，汝等当一心信解受持佛语。诸佛如来、言无虚妄，无有余乘，唯一佛乘。’","para":true,"t":[907.81,918.37]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[918.97,922.77]},{"text":"比丘比丘尼，有怀增上慢，优婆塞我慢，优婆夷不信，","para":true,"t":[923.37,931.68]},{"text":"如是四众等，其数有五千，不自见其过，于戒有缺漏，","para":true,"t":[932.28,938.29]},{"text":"护惜其瑕疵。是小智已出，众中之糟糠，佛威德故去，","para":true,"t":[938.92,946.17]},{"text":"斯人鲜福德，不堪受是法。此众无枝叶，唯有诸贞实。","para":true,"t":[946.77,954.25]},{"text":"舍利弗善听，诸佛所得法，无量方便力，而为众生说。","para":true,"t":[954.85,962.09]},{"text":"众生心所念，种种所行道，若干诸欲性，先世善恶业。","para":true,"t":[962.69,972.57]},{"text":"佛悉知是已，以诸缘譬喻、言辞方便力，令一切欢喜。","para":true,"t":[973.17,981.03]},{"text":"或说修多罗、伽陀及本事、本生未曾有。亦说于因缘、","para":true,"t":[981.61,987.81]},{"text":"譬喻并祇夜、优波提舍经。钝根乐小法，贪著于生死，","para":true,"t":[988.41,995.37]},{"text":"于诸无量佛，不行深妙道，众苦所恼乱，为是说涅槃。","para":true,"t":[995.97,1002.38]},{"text":"我设是方便，令得入佛慧，未曾说汝等、当得成佛道。","para":true,"t":[1003.01,1008.85]},{"text":"所以未曾说，说时未至故，今正是其时，决定说大乘。","para":true,"t":[1009.45,1016.33]},{"text":"我此九部法，随顺众生说，入大乘为本，以故说是经。","para":true,"t":[1016.93,1024.01]},{"text":"有佛子心净，柔软亦利根，无量诸佛所，而行深妙道。","para":true,"t":[1024.61,1032.73]},{"text":"为此诸佛子，说是大乘经。我记如是人，来世成佛道，","para":true,"t":[1033.33,1039.85]},{"text":"以深心念佛，修持净戒故。此等闻得佛，大喜充遍身，","para":true,"t":[1040.45,1048.17]},{"text":"佛知彼心行，故为说大乘。声闻若菩萨，闻我所说法，","para":true,"t":[1048.77,1055.77]},{"text":"乃至于一偈，皆成佛无疑。十方佛土中，唯有一乘法，","para":true,"t":[1056.37,1063.05]},{"text":"无二亦无三。除佛方便说，但以假名字，引导于众生，","para":true,"t":[1063.65,1069.33]},{"text":"说佛智慧故。诸佛出于世，唯此一事实，余二则非真，","para":true,"t":[1069.93,1077.65]},{"text":"终不以小乘、济度于众生。佛自住大乘，如其所得法、","para":true,"t":[1078.25,1085.45]},{"text":"定慧力庄严，以此度众生。自证无上道，大乘平等法，","para":true,"t":[1086.05,1094.45]},{"text":"若以小乘化、乃至于一人，我则堕悭贪，此事为不可。","para":true,"t":[1095.05,1102.32]},{"text":"若人信归佛，如来不欺诳，亦无贪嫉意，断诸法中恶。","para":true,"t":[1102.92,1109.88]},{"text":"故佛于十方，而独无所畏。我以相严身，光明照世间，","para":true,"t":[1110.46,1116.75]},{"text":"无量众所尊，为说实相印。舍利弗当知，我本立誓愿，","para":true,"t":[1117.33,1124.67]},{"text":"欲令一切众、如我等无异。如我昔所愿，今者已满足，","para":true,"t":[1125.25,1133.13]},{"text":"化一切众生，皆令入佛道。若我遇众生，尽教以佛道，","para":true,"t":[1133.73,1141.85]},{"text":"无智者错乱，迷惑不受教。我知此众生，未曾修善本，","para":true,"t":[1142.45,1151.18]},{"text":"坚著于五欲，痴爱故生恼。以诸欲因缘，坠堕三恶道，","para":true,"t":[1151.77,1159.85]},{"text":"轮回六趣中，备受诸苦毒，受胎之微形，世世常增长。","para":true,"t":[1160.45,1167.05]},{"text":"薄德少福人，众苦所逼迫，入邪见稠林，若有若无等。","para":true,"t":[1167.65,1176.03]},{"text":"依止此诸见，具足六十二，深著虚妄法，坚受不可舍，","para":true,"t":[1176.61,1182.78]},{"text":"我慢自矜高，谄曲心不实，于千万亿劫、不闻佛名字，","para":true,"t":[1183.37,1190.05]},{"text":"亦不闻正法，如是人难度。是故舍利弗，我为设方便，","para":true,"t":[1190.65,1197.98]},{"text":"说诸尽苦道，示之以涅槃。我虽说涅槃，是亦非真灭，","para":true,"t":[1198.57,1204.89]},{"text":"诸法从本来，常自寂灭相。佛子行道已，来世得作佛，","para":true,"t":[1205.51,1213.49]},{"text":"我有方便力，开示三乘法。一切诸世尊，皆说一乘道，","para":true,"t":[1214.09,1219.95]},{"text":"今此诸大众，皆应除疑惑，诸佛语无异，唯一无二乘。","para":true,"t":[1220.53,1228.01]},{"text":"过去无数劫，无量灭度佛，百千万亿种，其数不可量。","para":true,"t":[1228.61,1236.53]},{"text":"如是诸世尊，种种缘譬喻，无数方便力，演说诸法相。","para":true,"t":[1237.13,1245.93]},{"text":"是诸世尊等，皆说一乘法，化无量众生，令入于佛道。","para":true,"t":[1246.53,1252.13]},{"text":"又诸大圣主，知一切世间、天人群生类，深心之所欲，","para":true,"t":[1252.73,1259.29]},{"text":"更以异方便，助显第一义。若有众生类，值诸过去佛，","para":true,"t":[1259.89,1267.69]},{"text":"若闻法布施，或持戒忍辱、精进禅智等，种种修福慧。","para":true,"t":[1268.29,1274.82]},{"text":"如是诸人等，皆已成佛道。诸佛灭度已，若人善软心，","para":true,"t":[1275.41,1281.89]},{"text":"如是诸众生，皆已成佛道。诸佛灭度已，供养舍利者，","para":true,"t":[1282.49,1289.61]},{"text":"起万亿种塔，金银及玻璃、砗磲与玛瑙、玫瑰琉璃珠，","para":true,"t":[1290.21,1298.05]},{"text":"清净广严饰，庄校于诸塔。或有起石庙，栴檀及沉水，","para":true,"t":[1298.66,1305.27]},{"text":"木蜜并余材，塼瓦泥土等。若于旷野中，积土成佛庙。","para":true,"t":[1305.85,1313.3]},{"text":"乃至童子戏，聚沙为佛塔。如是诸人等，皆已成佛道。","para":true,"t":[1313.89,1320.43]},{"text":"若人为佛故，建立诸形像，刻雕成众相，皆已成佛道。","para":true,"t":[1321.02,1327.05]},{"text":"或以七宝成，鋀石赤白铜、白镴及铅锡，铁木及与泥，","para":true,"t":[1327.65,1333.94]},{"text":"或以胶漆布、严饰作佛像，如是诸人等，皆已成佛道。","para":true,"t":[1334.53,1340.49]},{"text":"彩画作佛像，百福庄严相，自作若使人，皆已成佛道。","para":true,"t":[1341.09,1348.11]},{"text":"乃至童子戏，若草木及笔、或以指爪甲、而画作佛像，","para":true,"t":[1348.69,1355.17]},{"text":"如是诸人等，渐渐积功德，具足大悲心，皆已成佛道。","para":true,"t":[1355.77,1363.33]},{"text":"但化诸菩萨，度脱无量众。若人于塔庙、宝像及画像，","para":true,"t":[1363.93,1370.61]},{"text":"以华香幡盖、敬心而供养。若使人作乐，击鼓吹角贝，","para":true,"t":[1371.21,1378.57]},{"text":"箫笛琴箜篌、琵琶铙铜钹，如是众妙音，尽持以供养。","para":true,"t":[1379.17,1385.89]},{"text":"或以欢喜心，歌呗颂佛德，乃至一小音，皆已成佛道。","para":true,"t":[1386.49,1393.45]},{"text":"若人散乱心，乃至以一华，供养于画像，渐见无数佛。","para":true,"t":[1394.05,1400.49]},{"text":"或有人礼拜，或复但合掌，乃至举一手，或复小低头，","para":true,"t":[1401.09,1407.21]},{"text":"以此供养像，渐见无量佛。自成无上道，广度无数众、","para":true,"t":[1407.81,1415.65]},{"text":"入无余涅槃，如薪尽火灭。若人散乱心，入于塔庙中，","para":true,"t":[1416.25,1423.5]},{"text":"一称南无佛，皆已成佛道。于诸过去佛，在世或灭后，","para":true,"t":[1424.09,1432.41]},{"text":"若有闻是法，皆已成佛道。未来诸世尊，其数无有量，","para":true,"t":[1433.01,1440.69]},{"text":"是诸如来等，亦方便说法。一切诸如来，以无量方便、","para":true,"t":[1441.29,1448.08]},{"text":"度脱诸众生，入佛无漏智，若有闻法者，无一不成佛。","para":true,"t":[1448.69,1456.67]},{"text":"诸佛本誓愿，我所行佛道，普欲令众生、亦同得此道。","para":true,"t":[1457.25,1464.33]},{"text":"未来世诸佛，虽说百千亿、无数诸法门，其实为一乘。","para":true,"t":[1464.93,1472.67]},{"text":"诸佛两足尊，知法常无性，佛种从缘起，是故说一乘。","para":true,"t":[1473.25,1481.77]},{"text":"是法住法位，世间相常住，于道场知已，导师方便说。","para":true,"t":[1482.37,1488.97]},{"text":"天人所供养、现在十方佛，其数如恒沙，出现于世间，","para":true,"t":[1489.58,1495.89]},{"text":"安隐众生故，亦说如是法。知第一寂灭，以方便力故，","para":true,"t":[1496.49,1504.13]},{"text":"虽示种种道，其实为佛乘。知众生诸行，深心之所念，","para":true,"t":[1504.73,1512.57]},{"text":"过去所习业，欲性精进力，及诸根利钝，以种种因缘、","para":true,"t":[1513.17,1520.37]},{"text":"譬喻亦言辞，随应方便说。今我亦如是，安隐众生故，","para":true,"t":[1520.97,1528.89]},{"text":"以种种法门、宣示于佛道。我以智慧力，知众生性欲，","para":true,"t":[1529.49,1537.01]},{"text":"方便说诸法，皆令得欢喜。舍利弗当知，我以佛眼观，","para":true,"t":[1537.61,1544.0]},{"text":"见六道众生，贫穷无福慧，入生死险道，相续苦不断，","para":true,"t":[1544.57,1552.01]},{"text":"深著于五欲，如牦牛爱尾、以贪爱自弊，盲瞑无所见。","para":true,"t":[1552.61,1559.45]},{"text":"不求大势佛、及与断苦法，深入诸邪见，以苦欲舍苦。","para":true,"t":[1560.05,1568.05]},{"text":"为是众生故、而起大悲心。我始坐道场，观树亦经行，","para":true,"t":[1568.65,1576.21]},{"text":"于三七日中，思惟如是事。我所得智慧，微妙最第一。","para":true,"t":[1576.81,1584.61]},{"text":"众生诸根钝，著乐痴所盲，如斯之等类，云何而可度，","para":true,"t":[1585.21,1593.39]},{"text":"尔时诸梵王，及诸天帝释、护世四天王，及大自在天，","para":true,"t":[1594.01,1602.61]},{"text":"并余诸天众、眷属百千万，恭敬合掌礼，请我转法轮。","para":true,"t":[1603.21,1609.37]},{"text":"我即自思惟，若但赞佛乘，众生没在苦，不能信是法，","para":true,"t":[1609.97,1618.12]},{"text":"破法不信故，坠于三恶道。我宁不说法，疾入于涅槃。","para":true,"t":[1618.69,1626.49]},{"text":"寻念过去佛、所行方便力，我今所得道，亦应说三乘。","para":true,"t":[1627.09,1633.73]},{"text":"作是思惟时，十方佛皆现，梵音慰喻我，善哉释迦文，","para":true,"t":[1634.33,1641.65]},{"text":"第一之导师，得是无上法，随诸一切佛、而用方便力。","para":true,"t":[1642.25,1648.17]},{"text":"我等亦皆得 最妙第一法，为诸众生类、分别说三乘。","para":true,"t":[1648.77,1654.41]},{"text":"少智乐小法，不自信作佛，是故以方便、分别说诸果。","para":true,"t":[1655.01,1661.69]},{"text":"虽复说三乘，但为教菩萨。舍利弗当知，我闻圣师子、","para":true,"t":[1662.29,1669.85]},{"text":"深净微妙音，喜称南无佛。复作如是念，我出浊恶世，","para":true,"t":[1670.44,1679.1]},{"text":"如诸佛所说，我亦随顺行。思惟是事已，即趋波罗奈，","para":true,"t":[1679.69,1687.33]},{"text":"诸法寂灭相，不可以言宣。以方便力故，为五比丘说。","para":true,"t":[1687.93,1695.41]},{"text":"是名转法轮，便有涅槃音，及以阿罗汉，法僧差别名。","para":true,"t":[1696.01,1701.53]},{"text":"从久远劫来，赞是涅槃法，生死苦永尽，我常如是说。","para":true,"t":[1702.13,1710.29]},{"text":"舍利弗当知，我见佛子等，志求佛道者，无量千万亿，","para":true,"t":[1710.89,1718.38]},{"text":"咸以恭敬心，皆来至佛所，曾从诸佛闻，方便所说法。","para":true,"t":[1719.01,1727.05]},{"text":"我即作是念，如来所以出，为说佛慧故，今正是其时。","para":true,"t":[1727.67,1734.09]},{"text":"舍利弗当知，钝根小智人、著相憍慢者，不能信是法。","para":true,"t":[1734.69,1741.13]},{"text":"今我喜无畏，于诸菩萨中，正直舍方便，但说无上道。","para":true,"t":[1741.74,1749.61]},{"text":"菩萨闻是法，疑网皆已除，千二百罗汉、悉亦当作佛。","para":true,"t":[1750.21,1757.65]},{"text":"如三世诸佛，说法之仪式，我今亦如是，说无分别法。","para":true,"t":[1758.25,1764.93]},{"text":"诸佛兴出世，悬远值遇难，正使出于世，说是法复难，","para":true,"t":[1765.53,1773.25]},{"text":"无量无数劫，闻是法亦难，能听是法者，斯人亦复难。","para":true,"t":[1773.85,1781.53]},{"text":"譬如优昙花，一切皆爱乐，天人所稀有，时时乃一出。","para":true,"t":[1782.13,1789.53]},{"text":"闻法欢喜赞，乃至发一言，则为已供养，一切三世佛，","para":true,"t":[1790.13,1797.09]},{"text":"是人甚稀有，过于优昙花。汝等勿有疑，我为诸法王，","para":true,"t":[1797.69,1803.61]},{"text":"普告诸大众，但以一乘道、教化诸菩萨，无声闻弟子。","para":true,"t":[1804.21,1810.13]},{"text":"汝等舍利弗，声闻及菩萨，当知是妙法，诸佛之秘要。","para":true,"t":[1810.73,1817.37]},{"text":"以五浊恶世，但乐著诸欲，如是等众生，终不求佛道。","para":true,"t":[1817.97,1824.93]},{"text":"当来世恶人，闻佛说一乘，迷惑不信受，破法堕恶道。","para":true,"t":[1825.53,1833.97]},{"text":"有惭愧清净、志求佛道者，当为如是等、广赞一乘道。","para":true,"t":[1834.57,1839.73]},{"text":"舍利弗当知，诸佛法如是，以万亿方便、随宜而说法，","para":true,"t":[1840.33,1846.81]},{"text":"其不习学者，不能晓了此。汝等既已知，诸佛世之师，","para":true,"t":[1847.41,1855.18]},{"text":"随宜方便事，无复诸疑惑，心生大欢喜，自知当作佛。","para":true,"t":[1855.77,1862.41]}]},{"title":"譬喻品第三","stem":"004_譬喻品第三","dur":2513.3,"src":"audio/004.mp3","pieces":[{"text":"譬喻品第三","para":true,"t":[0.0,1.48]},{"text":"尔时舍利弗踊跃欢喜，即起、合掌、瞻仰尊颜、而白佛言：‘今从世尊闻此法音，心怀踊跃，得未曾有。所以者何。","para":false,"t":[2.07,17.09]},{"text":"我昔从佛闻如是法，见诸菩萨授记作佛，而我等不与斯事，甚自感伤、失于如来无量知见。","para":false,"t":[17.33,28.42]},{"text":"世尊，我常独处山林树下，若坐若行，每作是念：“我等同入法性，云何如来以小乘法而见济度？”是我等咎，非世尊也。所以者何。","para":false,"t":[28.66,45.1]},{"text":"若我等待说所因，成就阿耨多罗三藐三菩提者，必以大乘而得度脱。然我等不解方便随宜所说，初闻佛法，遇、便信受、思惟取证。世尊，我从昔来，终日竟夜、每自克责。","para":false,"t":[45.35,66.35]},{"text":"而今从佛，闻所未闻、未曾有法，断诸疑悔，身意泰然，快得安隐。今日乃知真是佛子，从佛口生，从法化生，得佛法分。’","para":true,"t":[66.6,81.56]},{"text":"尔时舍利弗欲重宣此义，而说偈言：","para":true,"t":[82.16,86.4]},{"text":"我闻是法音，得所未曾有，心怀大欢喜，疑网皆已除。","para":true,"t":[87.0,94.3]},{"text":"昔来蒙佛教，不失于大乘，佛音甚稀有，能除众生恼，","para":true,"t":[94.87,102.12]},{"text":"我已得漏尽，闻亦除忧恼。我处于山谷，或在树林下，","para":true,"t":[102.72,110.04]},{"text":"若坐若经行，常思惟是事，呜呼深自责，云何而自欺。","para":true,"t":[110.64,118.92]},{"text":"我等亦佛子，同入无漏法，不能于未来、演说无上道。","para":true,"t":[119.52,125.04]},{"text":"金色三十二，十力诸解脱，同共一法中，而不得此事，","para":true,"t":[125.64,131.76]},{"text":"八十种妙好，十八不共法，如是等功德，而我皆已失，","para":true,"t":[132.36,139.18]},{"text":"我独经行时，见佛在大众，名闻满十方，广饶益众生。","para":true,"t":[139.8,147.96]},{"text":"自惟失此利，我为自欺诳。我常于日夜，每思惟是事，","para":true,"t":[148.56,155.0]},{"text":"欲以问世尊，为失为不失，我常见世尊，称赞诸菩萨，","para":true,"t":[155.6,162.56]},{"text":"以是于日夜，筹量此是事。今闻佛音声，随宜而说法，","para":true,"t":[163.16,170.84]},{"text":"无漏难思议，令众至道场。我本著邪见，为诸梵志师，","para":true,"t":[171.43,180.12]},{"text":"世尊知我心，拔邪说涅槃。我悉除邪见，于空法得证，","para":true,"t":[180.72,187.76]},{"text":"尔时心自谓，得至于灭度。而今乃自觉，非是实灭度，","para":true,"t":[188.36,195.84]},{"text":"若得作佛时，具三十二相，天人夜叉众、龙神等恭敬，","para":true,"t":[196.44,202.55]},{"text":"是时乃可谓，永尽灭无余。佛于大众中，说我当作佛，","para":true,"t":[203.16,210.88]},{"text":"闻如是法音，疑悔悉已除。初闻佛所说，心中大惊疑，","para":true,"t":[211.48,218.25]},{"text":"将非魔作佛，恼乱我心耶。佛以种种缘、譬喻巧言说，","para":true,"t":[218.88,225.96]},{"text":"其心安如海，我闻疑网断。佛说过去世、无量灭度佛，","para":true,"t":[226.56,235.76]},{"text":"安住方便中，亦皆说是法。现在未来佛，其数无有量，","para":true,"t":[236.35,243.61]},{"text":"亦以诸方便，演说如是法。如今者世尊，从生及出家、","para":true,"t":[244.2,251.12]},{"text":"得道转法轮，亦以方便说。世尊说实道，波旬无此事，","para":true,"t":[251.72,259.4]},{"text":"以是我定知、非是魔作佛。我堕疑网故，谓是魔所为，","para":true,"t":[259.99,268.13]},{"text":"闻佛柔软音，深远甚微妙，演畅清净法。我心大欢喜，","para":true,"t":[268.74,277.25]},{"text":"疑悔永已尽，安住实智中。我定当作佛，为天人所敬，","para":true,"t":[277.87,285.77]},{"text":"转无上法轮，教化诸菩萨。","para":true,"t":[286.36,290.36]},{"text":"尔时佛告舍利弗：‘吾今于天、人、沙门、婆罗门、等，大众中说，我昔曾于二万亿佛所，为无上道故，常教化汝，汝亦长夜随我受学。我以方便引导汝故，生我法中。","para":false,"t":[290.96,310.05]},{"text":"舍利弗，我昔教汝志愿佛道，汝今悉忘，而便自谓、已得灭度。我今还欲令汝忆念本愿所行道故，为诸声闻说是大乘经，名妙法莲华、教菩萨法、佛所护念。’","para":true,"t":[310.28,330.69]},{"text":"‘舍利弗，汝于未来世，过无量无边、不可思议劫，供养若干千万亿佛，奉持正法，具足菩萨所行之道，当得作佛，号曰华光如来、应供、正遍知、明行足、善逝世间解、无上士、","para":false,"t":[331.29,350.69]},{"text":"调御丈夫、天人师、佛、世尊。国名离垢，其土平正，清净严饰，安隐、丰乐，天人炽盛。琉璃为地，有八交道，黄金为绳、以界其侧。其傍、各有七宝行树，常有华果。","para":false,"t":[350.94,372.14]},{"text":"华光如来、亦以三乘教化众生。’","para":true,"t":[372.38,376.9]},{"text":"‘舍利弗，彼佛出时，虽非恶世，以本愿故，说三乘法。其劫、名大宝庄严。何故名曰大宝庄严，其国中以菩萨为大宝故。","para":false,"t":[377.5,392.74]},{"text":"彼诸菩萨，无量无边，不可思议，算数譬喻所不能及，非佛智力、无能知者。若欲行时，宝华承足。","para":false,"t":[392.99,407.03]},{"text":"此诸菩萨，非初发意，皆久植德本，于无量百千万亿佛所、净修梵行，恒为诸佛之所称叹。常修佛慧，具大神通，善知一切诸法之门，质直无伪，志念坚固。如是菩萨、充满其国。’","para":true,"t":[407.28,429.45]},{"text":"‘舍利弗，华光佛、寿十二小劫，除为王子、未作佛时。其国人民，寿八小劫。华光如来过十二小劫，授坚满菩萨、阿耨多罗三藐三菩提记。","para":false,"t":[430.04,446.36]},{"text":"告诸比丘，是坚满菩萨、次当作佛，号曰华足安行、多陀阿伽度、阿罗诃、三藐三佛陀，其佛国土，亦复如是。","para":false,"t":[446.62,462.37]},{"text":"舍利弗，是华光佛灭度之后，正法住世、三十二小劫，像法住世、亦三十二小劫。’","para":true,"t":[462.62,471.45]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[472.02,476.04]},{"text":"舍利弗来世，成佛普智尊，号名曰华光，当度无量众。","para":true,"t":[476.61,484.26]},{"text":"供养无数佛，具足菩萨行、十力等功德，证于无上道。","para":true,"t":[484.86,491.34]},{"text":"过无量劫已，劫名大宝严，世界名离垢，清净无瑕秽。","para":true,"t":[491.93,499.14]},{"text":"以琉璃为地，金绳界其道，七宝杂色树，常有华果实。","para":true,"t":[499.74,505.84]},{"text":"彼国诸菩萨，志念常坚固，神通波罗蜜，皆已悉具足。","para":true,"t":[506.46,514.54]},{"text":"于无数佛所，善学菩萨道，如是等大士，华光佛所化。","para":true,"t":[515.14,521.54]},{"text":"佛为王子时，弃国舍世荣，于最末后身，出家成佛道。","para":true,"t":[522.14,530.29]},{"text":"华光佛住世、寿十二小劫，其国人民众，寿命八小劫。","para":true,"t":[530.9,537.46]},{"text":"佛灭度之后，正法住于世，三十二小劫，广度诸众生。","para":true,"t":[538.06,545.38]},{"text":"正法灭尽已，像法三十二，舍利广流布，天人普供养。","para":true,"t":[545.97,553.18]},{"text":"华光佛所为，其事皆如是，其两足圣尊，最胜无伦匹。","para":true,"t":[553.78,561.02]},{"text":"彼即是汝身，宜应自欣庆。","para":true,"t":[561.62,565.6]},{"text":"尔时四部众，比丘、比丘尼、优婆塞、优婆夷，天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、等大众，见舍利弗于佛前受阿耨多罗三藐三菩提记，心大欢喜，","para":false,"t":[566.18,586.98]},{"text":"踊跃无量，各各脱身所著上衣、以供养佛。释提桓因、梵天王、等，与无数天子，亦以天妙衣、天曼陀罗华、摩诃曼陀罗华、等，供养于佛。所散天衣，住虚空中，而自回转。","para":false,"t":[587.23,607.39]},{"text":"诸天伎乐、百千万种，于虚空中、一时俱作，雨众天华。而作是言：‘佛昔于波罗奈、初转法轮，今乃复转无上最大法轮。’","para":true,"t":[607.64,623.76]},{"text":"尔时诸天子欲重宣此义，而说偈言：","para":true,"t":[624.39,628.71]},{"text":"昔于波罗奈、转四谛法轮，分别说诸法，五众之生灭。","para":true,"t":[629.31,636.03]},{"text":"今复转最妙，无上大法轮，是法甚深奥，少有能信者。","para":true,"t":[636.63,644.11]},{"text":"我等从昔来，数闻世尊说，未曾闻如是，深妙之上法。","para":true,"t":[644.71,653.52]},{"text":"世尊说是法，我等皆随喜。大智舍利弗，今得受尊记，","para":true,"t":[654.11,661.63]},{"text":"我等亦如是，必当得作佛，于一切世间，最尊无有上。","para":true,"t":[662.23,670.15]},{"text":"佛道叵思议，方便随宜说。我所有福业，今世若过世，","para":true,"t":[670.75,677.33]},{"text":"及见佛功德，尽回向佛道。","para":true,"t":[677.91,682.14]},{"text":"尔时舍利弗白佛言：‘世尊，我今无复疑悔，亲于佛前、得受阿耨多罗三藐三菩提记。是诸千二百心自在者，昔住学地，佛常教化，言我法、能离生老病死，究竟涅槃。","para":false,"t":[682.71,703.43]},{"text":"是学无学人，亦各自以离我见及有无见等、谓得涅槃。而今于世尊前、闻所未闻，皆堕疑惑。善哉、世尊，愿为四众说其因缘，令离疑悔。’","para":true,"t":[703.68,722.27]},{"text":"尔时佛告舍利弗：‘我先不言、诸佛世尊、以种种因缘、譬喻言辞、方便说法，皆为阿耨多罗三藐三菩提耶。是诸所说，皆为化菩萨故。","para":false,"t":[722.96,740.96]},{"text":"然舍利弗，今当复以譬喻、更明此义，诸有智者、以譬喻得解。’","para":true,"t":[741.21,749.65]},{"text":"‘舍利弗，若国邑聚落，有大长者、其年衰迈，财富无量，多有田宅、及诸僮仆。其家广大，唯有一门，多诸人众，一百、二百、乃至五百人、止住其中。","para":false,"t":[750.25,769.41]},{"text":"堂阁朽故，墙壁隤落，柱根腐败，梁栋倾危，周匝俱时、欻然火起，焚烧舍宅。长者诸子，若十、二十、或至三十、在此宅中。","para":false,"t":[769.66,789.1]},{"text":"长者见是大火从四面起，即大惊怖，而作是念：“我虽能于此所烧之门、安隐得出，而诸子等，于火宅内、乐著嬉戏，不觉不知，不惊不怖，火来逼身，苦痛切己，心不厌患，","para":false,"t":[789.35,808.87]},{"text":"无求出意。”’","para":true,"t":[809.12,811.36]},{"text":"‘舍利弗，是长者作是思惟：“我身手有力，当以衣祴、若以几案、从舍出之。”复更思惟：“是舍、唯有一门，而复狭小。诸子幼稚，未有所识，恋著戏处，或当堕落，为火所烧。","para":false,"t":[811.96,833.68]},{"text":"我当为说怖畏之事，此舍已烧，宜时疾出，勿令为火之所烧害。”作是念已，如所思惟，具告诸子，汝等速出。","para":false,"t":[833.93,847.69]},{"text":"父虽怜愍、善言诱喻，而诸子等乐著嬉戏，不肯信受，不惊不畏，了无出心。亦复不知何者是火，何者为舍，云何为失，但东西走戏、视父而已。’","para":true,"t":[847.94,863.7]},{"text":"‘尔时长者即作是念：“此舍已为大火所烧，我及诸子若不时出，必为所焚，我今当设方便，令诸子等得免斯害。”父知诸子、先心各有所好，种种珍玩奇异之物，情必乐著。","para":false,"t":[864.3,881.7]},{"text":"而告之言：“汝等所可玩好、稀有难得，汝若不取，后必忧悔。如此种种羊车、鹿车、牛车，今在门外，可以游戏。汝等于此火宅、宜速出来，随汝所欲，皆当与汝。”","para":false,"t":[881.95,901.83]},{"text":"尔时诸子闻父所说珍玩之物，适其愿故，心各勇锐，互相推排，竞共驰走，争出火宅。是时长者见诸子等安隐得出，皆于四衢道中、露地而坐，无复障碍，其心泰然，欢喜踊跃。","para":false,"t":[902.08,923.35]},{"text":"时诸子等各白父言：“父先所许玩好之具，羊车、鹿车、牛车，愿时赐与。”’","para":true,"t":[923.57,932.37]},{"text":"‘舍利弗，尔时长者各赐诸子、等一大车，其车高广，众宝庄校，周匝栏楯，四面悬铃。又于其上、张设幰盖，亦以珍奇杂宝而严饰之，宝绳交络，垂诸华缨，重敷婉筵，安置丹枕。","para":false,"t":[932.97,952.41]},{"text":"驾以白牛，肤色充洁，形体姝好，有大筋力，行步平正，其疾如风。又多仆从、而侍卫之。所以者何。是大长者、财富无量，种种诸藏，悉皆充溢。","para":false,"t":[952.66,972.97]},{"text":"而作是念，我财物无极，不应以下劣小车、与诸子等，今此幼童，皆是吾子，爱无偏党，我有如是七宝大车，其数无量，应当等心、各各与之，不宜差别。所以者何。","para":false,"t":[973.23,994.15]},{"text":"以我此物、周给一国，犹尚不匮，何况诸子。是时诸子各乘大车，得未曾有，非本所望。’","para":true,"t":[994.4,1007.76]},{"text":"‘舍利弗，于汝意云何，是长者、等与诸子珍宝大车，宁有虚妄否？’舍利弗言：‘不也、世尊，是长者、但令诸子得免火难，全其躯命，非为虚妄。何以故。","para":false,"t":[1008.36,1030.4]},{"text":"若全身命，便为已得玩好之具，况复方便，于彼火宅而拔济之。世尊，若是长者，乃至不与最小一车，犹不虚妄。何以故。是长者先作是意：“我以方便、令子得出。”","para":false,"t":[1030.65,1050.93]},{"text":"以是因缘，无虚妄也。何况长者、自知财富无量，欲饶益诸子，等与大车。’","para":true,"t":[1051.18,1061.83]},{"text":"佛告舍利弗：‘善哉善哉，如汝所言。舍利弗，如来亦复如是，则为一切世间之父。","para":false,"t":[1062.46,1074.94]},{"text":"于诸怖畏、衰恼、忧患、无明闇蔽，永尽无余，而悉成就无量知见、力无所畏，有大神力及智慧力，具足方便、智慧波罗蜜，大慈、大悲，常无懈倦，恒求善事，利益一切。","para":false,"t":[1075.19,1097.99]},{"text":"而生三界朽故火宅，为度众生、生老病死、忧悲、苦恼、愚痴、闇蔽、三毒之火，教化、令得阿耨多罗三藐三菩提。","para":false,"t":[1098.24,1112.92]},{"text":"见诸众生为生老病死、忧悲、苦恼、之所烧煮，亦以五欲财利故、受种种苦，又以贪著追求故，现受众苦，后受地狱、畜生、饿鬼、之苦，若生天上、及在人间，贫穷困苦、","para":false,"t":[1113.17,1135.89]},{"text":"爱别离苦、怨憎会苦、如是等种种诸苦。众生没在其中，欢喜游戏，不觉不知，不惊不怖，亦不生厌，不求解脱。于此三界火宅、东西驰走，虽遭大苦，不以为患。","para":false,"t":[1136.14,1155.62]},{"text":"舍利弗，佛见此已，便作是念：“我为众生之父，应拔其苦难，与无量无边佛智慧乐，令其游戏。”’","para":true,"t":[1155.87,1167.19]},{"text":"‘舍利弗，如来复作是念：“若我但以神力、及智慧力，舍于方便，为诸众生赞如来知见、力无所畏者，众生不能以是得度。所以者何。","para":false,"t":[1167.79,1181.95]},{"text":"是诸众生，未免生老病死、忧悲、苦恼，而为三界火宅所烧，何由能解佛之智慧。”’","para":true,"t":[1182.2,1191.17]},{"text":"‘舍利弗，如彼长者、虽复身手有力，而不用之，但以殷勤方便、勉济诸子火宅之难，然后各与珍宝大车。","para":false,"t":[1191.76,1203.72]},{"text":"如来亦复如是，虽有力、无所畏，而不用之，但以智慧方便，于三界火宅、拔济众生，为说三乘、声闻、辟支佛、佛乘，而作是言：“汝等莫得乐住三界火宅，勿贪粗敝、","para":false,"t":[1203.97,1225.89]},{"text":"色声香味触也。若贪著生爱，则为所烧。汝速出三界，当得三乘、声闻、辟支佛、佛乘，我今为汝保任此事，终不虚也。汝等但当勤修精进。”","para":false,"t":[1226.14,1243.9]},{"text":"如来以是方便、诱进众生，复作是言：“汝等当知此三乘法，皆是圣所称叹，自在无系，无所依求。","para":false,"t":[1244.15,1255.43]},{"text":"乘是三乘，以无漏根、力、觉、道、禅定、解脱、三昧、等，而自娱乐，便得无量安隐快乐。”’","para":true,"t":[1255.68,1268.52]},{"text":"‘舍利弗，若有众生，内有智性，从佛世尊闻法信受，殷勤精进，欲速出三界，自求涅槃，是名声闻乘，如彼诸子为求羊车、出于火宅。","para":false,"t":[1269.12,1285.16]},{"text":"若有众生，从佛世尊闻法信受，殷勤精进，求自然慧，乐独善寂，深知诸法因缘，是名辟支佛乘，如彼诸子为求鹿车、出于火宅。","para":false,"t":[1285.41,1300.41]},{"text":"若有众生，从佛世尊闻法信受，勤修精进，求一切智、佛智、自然智、无师智、如来知见、力无所畏，愍念、安乐无量众生，利益天人，度脱一切，是名大乘，菩萨求此乘故，","para":false,"t":[1300.68,1322.82]},{"text":"名为摩诃萨，如彼诸子为求牛车、出于火宅。’","para":true,"t":[1323.07,1328.35]},{"text":"‘舍利弗，如彼长者、见诸子等安隐得出火宅，到无畏处，自惟财富无量，等以大车而赐诸子。","para":false,"t":[1328.95,1339.49]},{"text":"如来亦复如是，为一切众生之父，若见无量亿千众生，以佛教门、出三界苦、怖畏险道，得涅槃乐。","para":false,"t":[1339.76,1351.36]},{"text":"如来尔时便作是念：“我有无量无边智慧、力无畏等诸佛法藏，是诸众生，皆是我子，等与大乘，不令有人独得灭度。”皆以如来灭度而灭度之。","para":false,"t":[1351.61,1365.57]},{"text":"是诸众生脱三界者，悉与诸佛禅定、解脱、等娱乐之具，皆是一相、一种，圣所称叹，能生净妙第一之乐。’","para":true,"t":[1365.82,1378.78]},{"text":"‘舍利弗，如彼长者、初以三车诱引诸子，然后但与大车，宝物庄严，安隐第一，然彼长者无虚妄之咎。如来亦复如是、无有虚妄，初说三乘、引导众生，然后但以大乘而度脱之。","para":false,"t":[1379.38,1400.6]},{"text":"何以故。如来有无量智慧、力无所畏诸法之藏，能与一切众生大乘之法，但不尽能受。’","para":true,"t":[1400.83,1412.23]},{"text":"‘舍利弗，以是因缘，当知诸佛方便力故，于一佛乘、分别说三。’","para":true,"t":[1412.83,1421.09]},{"text":"佛欲重宣此义，而说偈言：","para":true,"t":[1421.67,1425.27]},{"text":"譬如长者、有一大宅，其宅久故，而复顿敝，","para":true,"t":[1425.87,1432.31]},{"text":"堂舍高危，柱根摧朽，梁栋倾斜，基陛隤毁，","para":true,"t":[1432.91,1438.95]},{"text":"墙壁圯坼，泥涂褫落，覆苫乱坠，椽梠差脱，","para":true,"t":[1439.55,1445.31]},{"text":"周障屈曲，杂秽充遍。有五百人，止住其中。","para":true,"t":[1445.92,1452.47]},{"text":"鸱枭雕鹫、乌鹊鸠鸽、蚖蛇蝮蝎，蜈蚣蚰蜒，","para":true,"t":[1453.07,1459.47]},{"text":"守宫百足，狖狸鼷鼠，诸恶虫辈，交横驰走。","para":true,"t":[1460.08,1466.65]},{"text":"屎尿臭处，不净流溢，蜣螂诸虫、而集其上。","para":true,"t":[1467.23,1474.47]},{"text":"狐狼野干，咀嚼践蹋，□啮死尸、骨肉狼藉。","para":true,"t":[1475.07,1481.23]},{"text":"由是群狗、竞来搏撮，饥羸慞惶，处处求食。","para":true,"t":[1481.83,1487.09]},{"text":"斗诤□掣，啀喍嗥吠，其舍恐怖，变状如是。","para":true,"t":[1487.67,1493.56]},{"text":"处处皆有，魑魅魍魉，夜叉恶鬼，食啖人肉，","para":true,"t":[1494.15,1501.23]},{"text":"毒虫之属，诸恶禽兽，孚乳产生，各自藏护。","para":true,"t":[1501.83,1507.27]},{"text":"夜叉竞来，争取食之，食之既饱，恶心转炽，","para":true,"t":[1507.87,1512.99]},{"text":"斗诤之声，甚可怖畏。鸠槃荼鬼、蹲踞土埵，","para":true,"t":[1513.59,1519.19]},{"text":"或时离地，一尺二尺，往返游行，纵逸嬉戏，","para":true,"t":[1519.79,1525.72]},{"text":"捉狗两足，扑令失声，以脚加颈，怖狗自乐。","para":true,"t":[1526.31,1532.11]},{"text":"复有诸鬼，其身长大，裸形黑瘦，常住其中，","para":true,"t":[1532.71,1538.49]},{"text":"发大恶声，叫呼求食。复有诸鬼，其咽如针。","para":true,"t":[1539.07,1545.23]},{"text":"复有诸鬼，首如牛头，或食人肉，或复啖狗，","para":true,"t":[1545.83,1551.39]},{"text":"头发蓬乱，残害凶险，饥渴所逼，叫唤驰走。","para":true,"t":[1551.99,1557.44]},{"text":"夜叉饿鬼，诸恶鸟兽，饥急四向，窥看窗牖，","para":true,"t":[1558.03,1564.07]},{"text":"如是诸难，恐畏无量。是朽故宅，属于一人。","para":true,"t":[1564.67,1571.51]},{"text":"其人近出，未久之间，于后舍宅，忽然火起，","para":true,"t":[1572.11,1578.59]},{"text":"四面一时，其炎俱炽。栋梁椽柱、爆声震裂，","para":true,"t":[1579.19,1584.63]},{"text":"摧折堕落，墙壁崩倒。诸鬼神等、扬声大叫。","para":true,"t":[1585.23,1591.51]},{"text":"雕鹫诸鸟，鸠槃荼等，周章惶怖，不能自出。","para":true,"t":[1592.11,1598.03]},{"text":"恶兽毒虫，藏窜孔穴，毗舍阇鬼、亦住其中，","para":true,"t":[1598.63,1604.75]},{"text":"薄福德故，为火所逼，共相残害，饮血啖肉。","para":true,"t":[1605.35,1611.71]},{"text":"野干之属，并已前死，诸大恶兽、竞来食啖，","para":true,"t":[1612.31,1617.83]},{"text":"臭烟烽烰，四面充塞。蜈蚣蚰蜒，毒蛇之类，","para":true,"t":[1618.43,1624.55]},{"text":"为火所烧，争走出穴，鸠槃荼鬼、随取而食。","para":true,"t":[1625.15,1631.23]},{"text":"又诸饿鬼，头上火燃，饥渴热恼，周章闷走。","para":true,"t":[1631.83,1636.43]},{"text":"其宅如是、甚可怖畏，毒害火灾，众难非一。","para":true,"t":[1637.03,1643.55]},{"text":"是时宅主 在门外立，闻有人言，汝诸子等，","para":true,"t":[1644.15,1650.15]},{"text":"先因游戏、来入此宅，稚小无知，欢娱乐著。","para":true,"t":[1650.75,1655.67]},{"text":"长者闻已，惊入火宅，方宜救济，令无烧害。","para":true,"t":[1656.27,1662.38]},{"text":"告喻诸子，说众患难，恶鬼毒虫，灾火蔓延，","para":true,"t":[1662.95,1668.59]},{"text":"众苦次第、相续不绝。毒蛇蚖蝮，及诸夜叉、","para":true,"t":[1669.19,1674.67]},{"text":"鸠槃荼鬼，野干狐狗，雕鹫鸱枭，百足之属，","para":true,"t":[1675.27,1681.23]},{"text":"饥渴恼急，甚可怖畏，此苦难处，况复大火。","para":true,"t":[1681.83,1687.83]},{"text":"诸子无知，虽闻父诲，犹故乐著，嬉戏不已。","para":true,"t":[1688.43,1695.31]},{"text":"是时长者，而作是念，诸子如此，益我愁恼。","para":true,"t":[1695.89,1701.1]},{"text":"今此舍宅，无一可乐，而诸子等、耽湎嬉戏，","para":true,"t":[1701.69,1707.79]},{"text":"不受我教，将为火害。即便思惟，设诸方便、","para":true,"t":[1708.41,1714.18]},{"text":"告诸子等，我有种种，珍玩之具，妙宝好车，","para":true,"t":[1714.77,1719.69]},{"text":"羊车鹿车、大牛之车，今在门外。汝等出来，","para":true,"t":[1720.29,1726.77]},{"text":"吾为汝等 造作此车，随意所乐，可以游戏。","para":true,"t":[1727.37,1732.97]},{"text":"诸子闻说，如此诸车，即时奔竞、驰走而出，","para":true,"t":[1733.57,1739.01]},{"text":"到于空地，离诸苦难。长者见子，得出火宅，","para":true,"t":[1739.61,1746.46]},{"text":"住于四衢，坐师子座、而自庆言，我今快乐。","para":true,"t":[1747.05,1754.37]},{"text":"此诸子等，生育甚难，愚小无知，而入险宅。","para":true,"t":[1754.97,1760.94]},{"text":"多诸毒虫，魑魅可畏，大火猛炎、四面俱起，","para":true,"t":[1761.53,1767.93]},{"text":"而此诸子、贪著嬉戏，我已救之，令得脱难。","para":true,"t":[1768.53,1774.02]},{"text":"是故诸人，我今快乐。尔时诸子、知父安坐，","para":true,"t":[1774.61,1780.89]},{"text":"皆诣父所、而白父言，愿赐我等，三种宝车。","para":true,"t":[1781.49,1786.76]},{"text":"如前所许，诸子出来，当以三车、随汝所欲，","para":true,"t":[1787.33,1792.94]},{"text":"今正是时，惟垂给与。长者大富，库藏众多，","para":true,"t":[1793.53,1799.33]},{"text":"金银琉璃、砗磲玛瑙，以众宝物、造诸大车。","para":true,"t":[1799.93,1804.65]},{"text":"庄校严饰，周匝栏楯，四面悬铃，金绳交络。","para":true,"t":[1805.26,1811.07]},{"text":"真珠罗网，张施其上，金华诸璎，处处垂下，","para":true,"t":[1811.65,1819.09]},{"text":"众彩杂饰，周匝围绕，柔软缯纩，以为茵蓐。","para":true,"t":[1819.69,1826.21]},{"text":"上妙细叠，价值千亿，鲜白净洁，以覆其上。","para":true,"t":[1826.81,1832.61]},{"text":"有大白牛，肥壮多力，形体姝好，以驾宝车。","para":true,"t":[1833.21,1838.41]},{"text":"多诸傧从，而侍卫之。以是妙车，等赐诸子。","para":true,"t":[1839.01,1844.5]},{"text":"诸子是时，欢喜踊跃，乘是宝车，游于四方，","para":true,"t":[1845.09,1849.98]},{"text":"嬉戏快乐，自在无碍。告舍利弗，我亦如是，","para":true,"t":[1850.57,1855.74]},{"text":"众圣中尊，世间之父。一切众生，皆是吾子，","para":true,"t":[1856.37,1862.73]},{"text":"深著世乐，无有慧心。三界无安，犹如火宅，","para":true,"t":[1863.33,1868.97]},{"text":"众苦充满，甚可怖畏，常有生老 病死忧患，","para":true,"t":[1869.57,1876.08]},{"text":"如是等火，炽燃不息。如来已离，三界火宅，","para":true,"t":[1876.69,1882.69]},{"text":"寂然闲居，安处林野。今此三界，皆是我有，","para":true,"t":[1883.29,1889.89]},{"text":"其中众生，悉是吾子。而今此处，多诸患难，","para":true,"t":[1890.49,1897.01]},{"text":"唯我一人，能为救护。虽复教诏，而不信受，","para":true,"t":[1897.61,1902.89]},{"text":"于诸欲染，贪著深故。以是方便，为说三乘，","para":true,"t":[1903.49,1908.77]},{"text":"令诸众生，知三界苦，开示演说、出世间道。","para":true,"t":[1909.37,1915.89]},{"text":"是诸子等，若心决定，具足三明、及六神通，","para":true,"t":[1916.49,1921.85]},{"text":"有得缘觉、不退菩萨。汝舍利弗，我为众生，","para":true,"t":[1922.45,1928.17]},{"text":"以此譬喻、说一佛乘，汝等若能、信受是语，","para":true,"t":[1928.77,1934.05]},{"text":"一切皆当，成得佛道。是乘微妙、清净第一，","para":true,"t":[1934.65,1940.81]},{"text":"于诸世间、为无有上，佛所悦可，一切众生、","para":true,"t":[1941.41,1947.66]},{"text":"所应称赞、供养礼拜。无量亿千、诸力解脱，","para":true,"t":[1948.25,1953.63]},{"text":"禅定智慧，及佛余法，得如是乘。令诸子等，","para":true,"t":[1954.25,1959.9]},{"text":"日夜劫数、常得游戏，与诸菩萨、及声闻众，","para":true,"t":[1960.53,1967.25]},{"text":"乘此宝乘，直至道场。以是因缘，十方谛求，","para":true,"t":[1967.85,1974.13]},{"text":"更无余乘，除佛方便。告舍利弗，汝诸人等，","para":true,"t":[1974.73,1980.53]},{"text":"皆是吾子，我则是父。汝等累劫、众苦所烧，","para":true,"t":[1981.13,1987.21]},{"text":"我皆济拔，令出三界。我虽先说、汝等灭度，","para":true,"t":[1987.81,1994.69]},{"text":"但尽生死，而实不灭，今所应作，唯佛智慧。","para":true,"t":[1995.29,2002.07]},{"text":"若有菩萨，于是众中，能一心听、诸佛实法，","para":true,"t":[2002.65,2008.83]},{"text":"诸佛世尊、虽以方便，所化众生，皆是菩萨。","para":true,"t":[2009.41,2015.01]},{"text":"若人小智，深著爱欲，为此等故、说于苦谛。","para":true,"t":[2015.61,2021.13]},{"text":"众生心喜，得未曾有，佛说苦谛，真实无异。","para":true,"t":[2021.74,2028.97]},{"text":"若有众生，不知苦本，深著苦因，不能暂舍，","para":true,"t":[2029.57,2035.37]},{"text":"为是等故、方便说道。诸苦所因，贪欲为本，","para":true,"t":[2035.97,2040.97]},{"text":"若灭贪欲，无所依止，灭尽诸苦，名第三谛。","para":true,"t":[2041.57,2047.45]},{"text":"为灭谛故，修行于道，离诸苦缚，名得解脱。","para":true,"t":[2048.05,2053.77]},{"text":"是人于何 而得解脱，但离虚妄，名为解脱，","para":true,"t":[2054.38,2059.41]},{"text":"其实未得、一切解脱。佛说是人、未实灭度，","para":true,"t":[2060.01,2065.49]},{"text":"斯人未得，无上道故，我意不欲、令至灭度。","para":true,"t":[2066.09,2072.45]},{"text":"我为法王，于法自在，安隐众生，故现于世。","para":true,"t":[2073.05,2078.77]},{"text":"汝舍利弗，我此法印，为欲利益，世间故说，","para":true,"t":[2079.37,2085.47]},{"text":"在所游方，勿妄宣传。若有闻者，随喜顶受，","para":true,"t":[2086.09,2092.77]},{"text":"当知是人、阿鞞跋致。若有信受，此经法者，","para":true,"t":[2093.37,2099.13]},{"text":"是人已曾，见过去佛，恭敬供养，亦闻是法。","para":true,"t":[2099.72,2106.33]},{"text":"若人有能，信汝所说，则为见我，亦见于汝、","para":true,"t":[2106.93,2112.64]},{"text":"及比丘僧、并诸菩萨。斯法华经，为深智说，","para":true,"t":[2113.21,2120.29]},{"text":"浅识闻之，迷惑不解，一切声闻、及辟支佛，","para":true,"t":[2120.89,2127.77]},{"text":"于此经中，力所不及。汝舍利弗，尚于此经、","para":true,"t":[2128.37,2134.46]},{"text":"以信得入，况余声闻。其余声闻，信佛语故，","para":true,"t":[2135.08,2140.29]},{"text":"随顺此经，非己智分。又舍利弗，憍慢懈怠、","para":true,"t":[2140.89,2147.59]},{"text":"计我见者，莫说此经。凡夫浅识，深著五欲，","para":true,"t":[2148.21,2154.49]},{"text":"闻不能解，亦勿为说。若人不信，毁谤此经，","para":true,"t":[2155.09,2162.57]},{"text":"则断一切，世间佛种。或复颦蹙，而怀疑惑，","para":true,"t":[2163.17,2168.57]},{"text":"汝当听说，此人罪报。若佛在世，若灭度后，","para":true,"t":[2169.17,2176.01]},{"text":"其有诽谤，如斯经典，见有读诵、书持经者，","para":true,"t":[2176.62,2182.22]},{"text":"轻贱憎嫉、而怀结恨，此人罪报，汝今复听，","para":true,"t":[2182.81,2188.66]},{"text":"其人命终，入阿鼻狱，具足一劫，劫尽更生，","para":true,"t":[2189.25,2195.01]},{"text":"如是展转，至无数劫，从地狱出，当堕畜生，","para":true,"t":[2195.6,2201.41]},{"text":"若狗野干，其影□瘦，黧黮疥癞，人所触娆，","para":true,"t":[2202.01,2207.33]},{"text":"又复为人，之所恶贱，常困饥渴，骨肉枯竭，","para":true,"t":[2207.93,2214.94]},{"text":"生受楚毒，死被瓦石，断佛种故，受斯罪报。","para":true,"t":[2215.53,2221.71]},{"text":"若作骆驼，或生驴中，身常负重，加诸杖捶，","para":true,"t":[2222.29,2228.45]},{"text":"但念水草，余无所知，谤斯经故，获罪如是。","para":true,"t":[2229.05,2235.81]},{"text":"有作野干，来入聚落，身体疥癞，又无一目，","para":true,"t":[2236.41,2240.89]},{"text":"为诸童子 之所打掷，受诸苦痛，或时致死。","para":true,"t":[2241.49,2247.13]},{"text":"于此死已，更受蟒身，其形长大，五百由旬，","para":true,"t":[2247.73,2253.06]},{"text":"聋騃无足，宛转腹行，为诸小虫，之所咂食，","para":true,"t":[2253.69,2260.37]},{"text":"昼夜受苦，无有休息，谤斯经故，获罪如是。","para":true,"t":[2260.97,2267.57]},{"text":"若得为人，诸根闇钝，矬陋挛躄，盲聋背伛，","para":true,"t":[2268.17,2274.13]},{"text":"有所言说，人不信受，口气常臭，鬼魅所著，","para":true,"t":[2274.73,2280.61]},{"text":"贫穷下贱，为人所使，多病痟瘦，无所依怙，","para":true,"t":[2281.21,2287.57]},{"text":"虽亲附人，人不在意，若有所得，寻复忘失。","para":true,"t":[2288.17,2295.9]},{"text":"若修医道，顺方治病，更增他疾，或复致死。","para":true,"t":[2296.53,2301.78]},{"text":"若自有病，无人救疗，设服良药，而复增剧。","para":true,"t":[2302.41,2307.67]},{"text":"若他反逆、抄劫窃盗，如是等罪，横罗其殃。","para":true,"t":[2308.29,2314.13]},{"text":"如斯罪人，永不见佛，众圣之王，说法教化，","para":true,"t":[2314.72,2320.81]},{"text":"如斯罪人，常生难处，狂聋心乱，永不闻法。","para":true,"t":[2321.41,2328.53]},{"text":"于无数劫、如恒河沙，生辄聋哑，诸根不具、","para":true,"t":[2329.15,2335.1]},{"text":"常处地狱，如游园观，在余恶道，如己舍宅，","para":true,"t":[2335.69,2342.37]},{"text":"驼驴猪狗、是其行处，谤斯经故，获罪如是。","para":true,"t":[2342.97,2348.47]},{"text":"若得为人，聋盲喑哑、贫穷诸衰、以自庄严，","para":true,"t":[2349.05,2356.25]},{"text":"水肿干痟、疥癞痈疽、如是等病，以为衣服，","para":true,"t":[2356.85,2363.42]},{"text":"身常臭处，垢秽不净，深著我见，增益嗔恚，","para":true,"t":[2364.01,2370.78]},{"text":"淫欲炽盛，不择禽兽，谤斯经故，获罪如是。","para":true,"t":[2371.37,2376.43]},{"text":"告舍利弗，谤斯经者，若说其罪，穷劫不尽。","para":true,"t":[2377.01,2382.93]},{"text":"以是因缘，我故语汝，无智人中，莫说此经。","para":true,"t":[2383.53,2389.62]},{"text":"若有利根，智慧明了，多闻强识，求佛道者，","para":true,"t":[2390.25,2395.25]},{"text":"如是之人，乃可为说。若人曾见，亿百千佛，","para":true,"t":[2395.84,2402.03]},{"text":"植诸善本，深心坚固，如是之人，乃可为说。","para":true,"t":[2402.61,2408.93]},{"text":"若人精进，常修慈心，不惜身命，乃可为说。","para":true,"t":[2409.53,2415.04]},{"text":"若人恭敬，无有异心，离诸凡愚，独处山泽，","para":true,"t":[2415.61,2421.55]},{"text":"如是之人，乃可为说。又舍利弗，若见有人，","para":true,"t":[2422.17,2427.95]},{"text":"舍恶知识，亲近善友，如是之人，乃可为说。","para":true,"t":[2428.53,2434.0]},{"text":"若见佛子，持戒清洁，如净明珠，求大乘经，","para":true,"t":[2434.57,2439.69]},{"text":"如是之人，乃可为说。若人无嗔，质直柔软，","para":true,"t":[2440.29,2446.65]},{"text":"常愍一切，恭敬诸佛，如是之人，乃可为说。","para":true,"t":[2447.25,2453.45]},{"text":"复有佛子，于大众中，以清净心，种种因缘、","para":true,"t":[2454.05,2460.69]},{"text":"譬喻言辞、说法无碍，如是之人，乃可为说。","para":true,"t":[2461.29,2467.03]},{"text":"若有比丘，为一切智，四方求法，合掌顶受，","para":true,"t":[2467.61,2474.13]},{"text":"但乐受持，大乘经典，乃至不受，余经一偈，","para":true,"t":[2474.73,2479.89]},{"text":"如是之人，乃可为说。如人至心，求佛舍利，","para":true,"t":[2480.49,2486.3]},{"text":"如是求经，得已顶受，其人不复，志求余经，","para":true,"t":[2486.88,2492.8]},{"text":"亦未曾念，外道典籍，如是之人，乃可为说。","para":true,"t":[2493.41,2499.89]},{"text":"告舍利弗，我说是相，求佛道者、穷劫不尽，","para":true,"t":[2500.49,2506.5]},{"text":"如是等人，则能信解，汝当为说，妙法华经。","para":true,"t":[2507.09,2512.65]}]},{"title":"信解品第四","stem":"005_信解品第四","dur":1241.14,"src":"audio/005.mp3","pieces":[{"text":"信解品第四","para":true,"t":[0.0,1.45]},{"text":"尔时慧命须菩提、摩诃迦旃延、摩诃迦叶、摩诃目犍连，从佛所、闻未曾有法，世尊授舍利弗阿耨多罗三藐三菩提记，发稀有心，欢喜踊跃，即从座起，整衣服，偏袒右肩，","para":false,"t":[2.04,22.12]},{"text":"右膝著地，一心合掌，屈躬恭敬，瞻仰尊颜、而白佛言：‘我等居僧之首，年并朽迈，自谓已得涅槃，无所堪任，不复进求阿耨多罗三藐三菩提。","para":false,"t":[22.37,41.77]},{"text":"世尊往昔说法既久，我时在座，身体疲懈，但念空、无相、无作，于菩萨法、游戏神通，净佛国土，成就众生，心不喜乐。所以者何。","para":false,"t":[42.02,58.22]},{"text":"世尊令我等出于三界，得涅槃证，又今我等年已朽迈，于佛教化菩萨阿耨多罗三藐三菩提、不生一念好乐之心。","para":false,"t":[58.47,70.24]},{"text":"我等今于佛前、闻授声闻阿耨多罗三藐三菩提记，心甚欢喜，得未曾有，不谓于今，忽然得闻稀有之法，深自庆幸，获大善利，无量珍宝、不求自得。’","para":true,"t":[70.52,89.64]},{"text":"‘世尊，我等今者乐说譬喻、以明斯义，譬若有人，年既幼稚，舍父逃逝，久住他国，或十、二十、至五十岁，年既长大，加复穷困，驰骋四方、以求衣食，渐渐游行，遇向本国。","para":false,"t":[90.24,108.68]},{"text":"其父先来、求子不得，中止一城。","para":false,"t":[108.93,112.93]},{"text":"其家大富，财宝无量，金、银、琉璃、珊瑚、琥珀、玻璃、珠、等，其诸仓库，悉皆盈溢，多有僮仆、臣佐、吏民，象马、车乘、牛羊、无数，出入息利，乃遍他国，商估贾客、","para":false,"t":[113.18,135.82]},{"text":"亦甚众多。时贫穷子、游诸聚落，经历国邑，遂到其父所止之城。","para":false,"t":[136.07,145.79]},{"text":"父母念子，与子离别五十余年，而未曾向人说如此事，但自思惟，心怀悔恨，自念老朽，多有财物，金银、珍宝，仓库盈溢，无有子息，一旦终没，财物散失，无所委付，是以殷勤、","para":false,"t":[146.04,171.95]},{"text":"每忆其子。复作是念：“我若得子、委付财物，坦然快乐，无复忧虑。”’","para":true,"t":[172.17,182.53]},{"text":"‘世尊，尔时穷子、佣赁展转、遇到父舍，住立门侧。","para":false,"t":[183.13,188.95]},{"text":"遥见其父、踞师子床，宝几承足，诸婆罗门、刹利、居士、皆恭敬围绕，以真珠璎珞、价值千万，庄严其身，吏民、僮仆，手执白拂，侍立左右。","para":false,"t":[189.22,207.38]},{"text":"覆以宝帐，垂诸华幡，香水洒地，散众名华，罗列宝物，出内取与，有如是等种种严饰，威德特尊。穷子见父有大力势，即怀恐怖，悔来至此。","para":false,"t":[207.64,226.67]},{"text":"窃作是念：“此或是王、或是王等，非我佣力得物之处，不如往至贫里，肆力有地，衣食易得，若久住此，或见逼迫，强使我作。”作是念已，疾走而去。’","para":true,"t":[226.92,246.6]},{"text":"‘时富长者于师子座，见子便识，心大欢喜。即作是念：“我财物库藏、今有所付，我常思念此子，无由见之，而忽自来，甚适我愿，我虽年朽，犹故贪惜。”即遣傍人，急追将还。","para":false,"t":[247.2,268.41]},{"text":"尔时使者，疾走往捉。穷子惊愕，称怨、大唤：“我不相犯，何为见捉？”使者执之愈急，强牵将还。于时穷子，自念无罪，而被囚执，此必定死，转更惶怖，闷绝躄地。","para":false,"t":[268.65,291.33]},{"text":"父遥见之，而语使言：“不需此人，勿强将来，以冷水洒面，令得醒悟，莫复与语。”所以者何。","para":false,"t":[291.57,303.97]},{"text":"父知其子、志意下劣，自知豪贵、为子所难，审知是子，而以方便，不语他人、云是我子。使者语之：“我今放汝，随意所趋。”","para":false,"t":[304.24,320.08]},{"text":"穷子欢喜、得未曾有，从地而起，往至贫里、以求衣食。’","para":true,"t":[320.32,328.48]},{"text":"‘尔时长者将欲诱引其子、而设方便，密遣二人、形色憔悴、无威德者：“汝可诣彼，徐语穷子，此有作处，倍与汝值。穷子若许，将来、使作。","para":false,"t":[329.07,345.03]},{"text":"若言、欲何所作，便可语之，雇汝除粪，我等二人、亦共汝作。”时二使人即求穷子，既已得之，具陈上事。尔时穷子先取其价，寻与除粪。其父见子，愍而怪之。","para":false,"t":[345.28,366.08]},{"text":"又以他日，于窗牖中、遥见子身，羸瘦憔悴，粪土尘坌，污秽不净。即脱璎珞、细软上服、严饰之具，更著粗敝垢腻之衣、尘土坌身，右手执持除粪之器，状有所畏。","para":false,"t":[366.33,386.53]},{"text":"语诸作人：“汝等勤作，勿得懈息。”以方便故，得近其子。后复告言：“咄、男子，汝常此作，勿复余去，当加汝价。","para":false,"t":[386.79,402.94]},{"text":"诸有所需、盆器米面、盐醋之属，莫自疑难，亦有老敝使人、需者相给，好自安意，我如汝父，勿复忧虑。所以者何。","para":false,"t":[403.19,417.2]},{"text":"我年老大，而汝少壮，汝常作时，无有欺怠、嗔恨怨言，都不见汝有此诸恶、如余作人，自今已后，如所生子。”即时长者、更与作字，名之为儿。","para":false,"t":[417.43,434.04]},{"text":"尔时穷子、虽欣此遇，犹故自谓、客作贱人。由是之故，于二十年中、常令除粪。过是已后，心相体信，入出无难，然其所止、犹在本处。’","para":true,"t":[434.29,452.69]},{"text":"‘世尊，尔时长者有疾，自知将死不久。语穷子言：“我今多有金银珍宝，仓库盈溢，其中多少、所应取与，汝悉知之，我心如是，当体此意。所以者何。","para":false,"t":[453.29,472.41]},{"text":"今我与汝，便为不异，宜加用心，无令漏失。”尔时穷子，即受教敕，领知众物、金银珍宝、及诸库藏，而无希取一餐之意，然其所止，故在本处，下劣之心、亦未能舍。","para":false,"t":[472.66,495.62]},{"text":"复经少时，父知子意，渐已通泰，成就大志，自鄙先心。","para":false,"t":[495.87,504.27]},{"text":"临欲终时、而命其子、并会亲、族、国王、大臣、刹利、居士，皆悉已集，即自宣言：“诸君当知，此是我子，我之所生，于某城中、舍吾逃走，伶俜辛苦、五十余年，其本字某，","para":false,"t":[504.52,528.53]},{"text":"我名某甲，昔在本城、怀忧推觅，忽于此间、遇会得之，此实我子，我实其父，今我所有一切财物，皆是子有，先所出内，是子所知。","para":false,"t":[528.77,545.89]},{"text":"世尊，是时穷子闻父此言，即大欢喜、得未曾有，而作是念，我本无心、有所希求，今此宝藏自然而至。”’","para":true,"t":[546.14,560.1]},{"text":"‘世尊，大富长者、则是如来，我等皆似佛子，如来常说、我等为子。世尊，我等以三苦故，于生死中、受诸热恼，迷惑无知，乐著小法。","para":false,"t":[560.7,575.58]},{"text":"今日世尊，令我等思惟捐除诸法戏论之粪，我等于中勤加精进，得至涅槃一日之价，既得此已，心大欢喜，自以为足，便自谓言：“于佛法中勤精进故，所得宏多。”","para":false,"t":[575.83,598.35]},{"text":"然世尊先知我等心著敝欲，乐于小法，便见纵舍，不为分别、汝等当有如来知见宝藏之分。","para":false,"t":[598.6,610.21]},{"text":"世尊以方便力、说如来智慧，我等从佛，得涅槃一日之价，以为大得，于此大乘，无有志求。我等又因如来智慧，为诸菩萨，开示演说，而自于此无有志愿。所以者何。","para":false,"t":[610.45,628.09]},{"text":"佛知我等心乐小法，以方便力、随我等说，而我等不知真是佛子。今我等方知世尊于佛智慧、无所吝惜。所以者何。","para":false,"t":[628.34,642.9]},{"text":"我等昔来真是佛子，而但乐小法，若我等有乐大之心，佛则为我说大乘法。","para":false,"t":[643.15,651.07]},{"text":"于此经中、唯说一乘，而昔于菩萨前、毁呰声闻乐小法者，然佛实以大乘教化，是故我等说、本无心有所希求。今法王大宝自然而至，如佛子所应得者、皆已得之。’","para":true,"t":[651.32,670.0]},{"text":"尔时摩诃迦叶欲重宣此义，而说偈言：","para":true,"t":[670.6,675.81]},{"text":"我等今日、闻佛音教，欢喜踊跃，得未曾有。","para":true,"t":[676.4,681.2]},{"text":"佛说声闻，当得作佛，无上宝聚，不求自得。","para":true,"t":[681.79,688.04]},{"text":"譬如童子，幼稚无识，舍父逃逝，远到他土，","para":true,"t":[688.64,695.32]},{"text":"周流诸国、五十余年。其父忧念，四方推求，","para":true,"t":[695.91,701.6]},{"text":"求之既疲，顿止一城，造立舍宅，五欲自娱。","para":true,"t":[702.2,707.49]},{"text":"其家巨富，多诸金银、砗磲玛瑙、真珠琉璃、","para":true,"t":[708.12,713.28]},{"text":"象马牛羊、辇舆车乘、田业僮仆，人民众多，","para":true,"t":[713.88,718.95]},{"text":"出入息利、乃遍他国，商估贾人、无处不有，","para":true,"t":[719.56,724.94]},{"text":"千万亿众、围绕恭敬，常为王者 之所爱念，","para":true,"t":[725.52,730.78]},{"text":"群臣豪族，皆共宗重。以诸缘故，往来者众，","para":true,"t":[731.36,737.61]},{"text":"豪富如是，有大力势。而年朽迈，益忧念子，","para":true,"t":[738.2,744.81]},{"text":"夙夜惟念，死时将至，痴子舍我，五十余年，","para":true,"t":[745.4,752.8]},{"text":"库藏诸物、当如之何。尔时穷子，求索衣食，","para":true,"t":[753.4,759.16]},{"text":"从邑至邑、从国至国，或有所得，或无所得，","para":true,"t":[759.76,765.2]},{"text":"饥饿羸瘦，体生疮癣，渐次经历，到父住城，","para":true,"t":[765.8,771.04]},{"text":"佣赁展转，遂至父舍。尔时长者，于其门内、","para":true,"t":[771.64,778.36]},{"text":"施大宝帐，处师子座，眷属围绕，诸人侍卫，","para":true,"t":[778.96,786.4]},{"text":"或有计算，金银宝物，出内财产，注记券疏。","para":true,"t":[787.0,792.55]},{"text":"穷子见父 豪贵尊严，谓是国王、若国王等，","para":true,"t":[793.16,798.04]},{"text":"惊怖自怪，何故至此。覆自念言，我若久住，","para":true,"t":[798.64,804.9]},{"text":"或见逼迫，强驱使作。思惟是已，驰走而去，","para":true,"t":[805.48,812.08]},{"text":"借问贫里，欲往佣作。长者是时、在师子座，","para":true,"t":[812.68,819.63]},{"text":"遥见其子，默而识之，即敕使者、追捉将来。","para":true,"t":[820.2,826.8]},{"text":"穷子惊唤，迷闷躄地，是人执我，必当见杀，","para":true,"t":[827.4,834.28]},{"text":"何用衣食、使我至此。长者知子，愚痴狭劣，","para":true,"t":[834.88,842.2]},{"text":"不信我言，不信是父。即以方便，更遣余人，","para":true,"t":[842.8,848.96]},{"text":"眇目矬陋、无威德者，汝可语之，云当相雇，","para":true,"t":[849.56,855.32]},{"text":"除诸粪秽，倍与汝价。穷子闻之，欢喜随来，","para":true,"t":[855.92,861.77]},{"text":"为除粪秽，净诸房舍。长者于牖、常见其子，","para":true,"t":[862.36,868.81]},{"text":"念子愚劣，乐为鄙事。于是长者 著敝垢衣，","para":true,"t":[869.4,874.68]},{"text":"执除粪器，往到子所，方便附近，语令勤作。","para":true,"t":[875.28,880.63]},{"text":"既益汝价，并涂足油，饮食充足，荐席厚暖，","para":true,"t":[881.24,886.48]},{"text":"如是苦言、汝当勤作，又以软语、若如我子。","para":true,"t":[887.08,892.92]},{"text":"长者有智，渐令入出，经二十年，执作家事，","para":true,"t":[893.51,899.63]},{"text":"示其金银、真珠玻璃、诸物出入，皆使令知。","para":true,"t":[900.23,906.41]},{"text":"犹处门外，止宿草庵，自念贫事，我无此物。","para":true,"t":[907.03,914.57]},{"text":"父知子心，渐已广大，欲与财物，即聚亲族、","para":true,"t":[915.15,922.19]},{"text":"国王大臣、刹利居士。于此大众，说是我子，","para":true,"t":[922.79,928.89]},{"text":"舍我他行、经五十岁，自见子来、已二十年，","para":true,"t":[929.51,935.92]},{"text":"昔于某城，而失是子，周行求索，遂来至此。","para":true,"t":[936.51,942.09]},{"text":"凡我所有、舍宅人民，悉以付之，恣其所用。","para":true,"t":[942.72,947.85]},{"text":"子念昔贫，志意下劣，今于父所、大获珍宝，","para":true,"t":[948.43,953.85]},{"text":"并及舍宅、一切财物，甚大欢喜，得未曾有。","para":true,"t":[954.43,959.92]},{"text":"佛亦如是，知我乐小，未曾说言，汝等作佛，","para":true,"t":[960.55,965.81]},{"text":"而说我等，得诸无漏，成就小乘、声闻弟子。","para":true,"t":[966.39,971.11]},{"text":"佛敕我等，说最上道，修习此者，当得成佛。","para":true,"t":[971.72,978.29]},{"text":"我承佛教，为大菩萨，以诸因缘、种种譬喻、","para":true,"t":[978.87,984.44]},{"text":"若干言辞、说无上道。诸佛子等、从我闻法，","para":true,"t":[985.03,991.56]},{"text":"日夜思惟，精勤修习。是时诸佛，即授其记，","para":true,"t":[992.16,997.43]},{"text":"汝于来世、当得作佛，一切诸佛，秘藏之法，","para":true,"t":[998.03,1005.03]},{"text":"但为菩萨，演其实事，而不为我，说斯真要。","para":true,"t":[1005.63,1011.51]},{"text":"如彼穷子、得近其父，虽知诸物，心不希取。","para":true,"t":[1012.11,1018.28]},{"text":"我等虽说，佛法宝藏，自无志愿，亦复如是。","para":true,"t":[1018.88,1024.16]},{"text":"我等内灭，自谓为足，唯了此事，更无余事。","para":true,"t":[1024.75,1030.45]},{"text":"我等若闻，净佛国土，教化众生，都无欣乐。","para":true,"t":[1031.03,1036.87]},{"text":"所以者何，一切诸法，皆悉空寂，无生无灭，","para":true,"t":[1037.47,1044.19]},{"text":"无大无小，无漏无为，如是思惟，不生喜乐。","para":true,"t":[1044.79,1050.11]},{"text":"我等长夜，于佛智慧，无贪无著，无复志愿，","para":true,"t":[1050.71,1056.42]},{"text":"而自于法、谓是究竟。我等长夜、修习空法，","para":true,"t":[1056.99,1062.15]},{"text":"得脱三界，苦恼之患，住最后身、有余涅槃。","para":true,"t":[1062.75,1068.43]},{"text":"佛所教化，得道不虚，则为已得，报佛之恩。","para":true,"t":[1069.03,1074.1]},{"text":"我等虽为，诸佛子等，说菩萨法、以求佛道，","para":true,"t":[1074.67,1080.18]},{"text":"而于是法、永无愿乐。导师见舍，观我心故，","para":true,"t":[1080.79,1087.3]},{"text":"初不劝进、说有实利。如富长者，知子志劣，","para":true,"t":[1087.91,1095.23]},{"text":"以方便力、柔伏其心，然后乃付，一切财物。","para":true,"t":[1095.83,1101.31]},{"text":"佛亦如是、现稀有事 知乐小者，以方便力、","para":true,"t":[1101.91,1107.51]},{"text":"调伏其心，乃教大智。我等今日、得未曾有，","para":true,"t":[1108.11,1115.2]},{"text":"非先所望，而今自得，如彼穷子，得无量宝。","para":true,"t":[1115.83,1122.42]},{"text":"世尊我今，得道得果，于无漏法、得清净眼。","para":true,"t":[1122.99,1129.43]},{"text":"我等长夜、持佛净戒，始于今日，得其果报，","para":true,"t":[1130.03,1136.69]},{"text":"法王法中、久修梵行，今得无漏、无上大果。","para":true,"t":[1137.31,1143.07]},{"text":"我等今者、真是声闻，以佛道声、令一切闻。","para":true,"t":[1143.69,1150.39]},{"text":"我等今者、真阿罗汉，于诸世间、天人魔梵，","para":true,"t":[1150.99,1156.44]},{"text":"普于其中、应受供养。世尊大恩，以稀有事，","para":true,"t":[1157.04,1162.28]},{"text":"怜愍教化、利益我等，无量亿劫、谁能报者。","para":true,"t":[1162.87,1168.13]},{"text":"手足供给，头顶礼敬，一切供养，皆不能报。","para":true,"t":[1168.71,1174.07]},{"text":"若以顶戴，两肩荷负，于恒沙劫、尽心恭敬，","para":true,"t":[1174.67,1181.87]},{"text":"又以美膳、无量宝衣、及诸卧具、种种汤药，","para":true,"t":[1182.47,1189.11]},{"text":"牛头栴檀、及诸珍宝、以起塔庙，宝衣布地，","para":true,"t":[1189.71,1194.99]},{"text":"如斯等事，以用供养，于恒沙劫，亦不能报。","para":true,"t":[1195.61,1200.84]},{"text":"诸佛稀有、无量无边、不可思议、大神通力，","para":true,"t":[1201.43,1206.35]},{"text":"无漏无为，诸法之王，能为下劣、忍于斯事，","para":true,"t":[1206.95,1211.99]},{"text":"取相凡夫，随宜为说。诸佛于法，得最自在，","para":true,"t":[1212.59,1219.63]},{"text":"知诸众生，种种欲乐、及其志力，随所堪任，","para":true,"t":[1220.23,1225.15]},{"text":"以无量喻、而为说法，随诸众生，宿世善根，","para":true,"t":[1225.75,1231.68]},{"text":"又知成熟、未成熟者，种种筹量，分别知已，","para":true,"t":[1232.31,1237.39]},{"text":"于一乘道、随宜说三。","para":true,"t":[1237.99,1240.47]}]},{"title":"药草喻品第五","stem":"006_药草喻品第五","dur":643.78,"src":"audio/006.mp3","pieces":[{"text":"药草喻品第五","para":true,"t":[0.0,1.42]},{"text":"尔时世尊告摩诃迦叶、及诸大弟子：‘善哉、善哉，迦叶善说如来真实功德。诚如所言，如来复有无量无边阿僧祇功德，汝等若于无量亿劫、说不能尽。","para":false,"t":[2.0,18.4]},{"text":"迦叶，当知如来是诸法之王，若有所说，皆不虚也。于一切法，以智方便而演说之，其所说法，皆悉到于一切智地。","para":false,"t":[18.65,34.29]},{"text":"如来观知一切诸法之所归趋，亦知一切众生深心所行，通达无碍，又于诸法究尽明了，示诸众生一切智慧。’","para":true,"t":[34.54,48.58]},{"text":"‘迦叶，譬如三千大千世界、山川溪谷土地，所生卉木丛林、及诸药草，种类若干，名色各异。密云弥布，遍覆三千大千世界，一时等澍，其泽普洽。","para":false,"t":[49.18,68.66]},{"text":"卉木丛林、及诸药草，小根小茎、小枝小叶，中根中茎、中枝中叶，大根大茎、大枝大叶，诸树大小，随上中下、各有所受，一云所雨，称其种性而得生长，华果敷实。","para":false,"t":[68.91,88.09]},{"text":"虽一地所生，一雨所润，而诸草木、各有差别。’","para":true,"t":[88.32,94.4]},{"text":"‘迦叶，当知如来亦复如是、出现于世，如大云起，以大音声、普遍世界天、人、阿修罗，如彼大云遍覆三千大千国土。","para":false,"t":[95.0,111.52]},{"text":"于大众中、而唱是言：“我是如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊，未度者令度，未解者令解，未安者令安，未涅槃者令得涅槃，","para":false,"t":[111.77,132.77]},{"text":"今世后世、如实知之。我是一切知者、一切见者、知道者、开道者、说道者、汝等天、人、阿修罗众、皆应到此，为听法故。”’","para":true,"t":[133.02,146.62]},{"text":"‘尔时无数千万亿种众生，来至佛所、而听法。如来于时，观是众生诸根利钝，精进、懈怠，随其所堪、而为说法，种种无量，皆令欢喜、快得善利。’","para":true,"t":[147.22,164.82]},{"text":"‘是诸众生、闻是法已，现世安隐，后生善处，以道受乐，亦得闻法。既闻法已，离诸障碍，于诸法中，任力所能，渐得入道。","para":false,"t":[165.42,182.78]},{"text":"如彼大云、雨于一切卉木丛林、及诸药草，如其种性，具足蒙润，各得生长。’","para":true,"t":[183.01,192.49]},{"text":"‘如来说法，一相一味，所谓解脱相、离相、灭相，究竟至于一切种智。其有众生、闻如来法，若持读诵，如说修行，所得功德、不自觉知。所以者何。","para":false,"t":[193.09,213.85]},{"text":"唯有如来、知此众生种相体性，念何事，思何事，修何事，云何念，云何思，云何修，以何法念，以何法思，以何法修，以何法得何法，众生住于种种之地，唯有如来、如实见之，","para":false,"t":[214.1,239.46]},{"text":"明了无碍。如彼卉木丛林、诸药草等，而不自知上中下性，如来知是一相一味之法，所谓解脱相、离相、灭相，究竟涅槃、常寂灭相，终归于空。","para":false,"t":[239.71,255.15]},{"text":"佛知是已，观众生心欲、而将护之，是故不即为说一切种智。汝等迦叶、甚为稀有，能知如来随宜说法，能信能受。所以者何。诸佛世尊、随宜说法，难解难知。’","para":true,"t":[255.4,276.76]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[277.36,281.48]},{"text":"破有法王、出现世间，随众生欲，种种说法。","para":true,"t":[282.08,287.66]},{"text":"如来尊重，智慧深远，久默斯要，不务速说。","para":true,"t":[288.24,293.72]},{"text":"有智若闻，则能信解，无智疑悔，则为永失。","para":true,"t":[294.32,300.24]},{"text":"是故迦叶，随力为说，以种种缘、令得正见。","para":true,"t":[300.84,307.0]},{"text":"迦叶当知，譬如大云，起于世间，遍覆一切，","para":true,"t":[307.6,313.64]},{"text":"慧云含润，电光晃曜，雷声远震，令众悦豫。","para":true,"t":[314.24,320.54]},{"text":"日光掩蔽，地上清凉，叆叇垂布、如可承揽。","para":true,"t":[321.13,328.4]},{"text":"其雨普等，四方俱下，流澍无量，率土充洽。","para":true,"t":[329.0,335.2]},{"text":"山川险谷、幽邃所生，卉木药草，大小诸树，","para":true,"t":[335.8,342.56]},{"text":"百谷苗稼，甘蔗葡萄，雨之所润，无不丰足，","para":true,"t":[343.16,350.12]},{"text":"干地普洽，药木并茂。其云所出，一味之水，","para":true,"t":[350.72,357.02]},{"text":"草木丛林，随分受润。一切诸树，上中下等，","para":true,"t":[357.6,363.96]},{"text":"称其大小，各得生长，根茎枝叶，华果光色，","para":true,"t":[364.56,369.44]},{"text":"一雨所及，皆得鲜泽。如其体相、性分大小，","para":true,"t":[370.04,375.49]},{"text":"所润是一，而各滋茂。佛亦如是，出现于世，","para":true,"t":[376.08,381.58]},{"text":"譬如大云、普覆一切。既出于世，为诸众生、","para":true,"t":[382.2,388.22]},{"text":"分别演说、诸法之实。大圣世尊，于诸天人、","para":true,"t":[388.8,394.8]},{"text":"一切众中、而宣是言，我为如来，两足之尊，","para":true,"t":[395.4,400.45]},{"text":"出于世间，犹如大云、充润一切，枯槁众生，","para":true,"t":[401.05,407.38]},{"text":"皆令离苦，得安隐乐、世间之乐、及涅槃乐。","para":true,"t":[408.0,415.52]},{"text":"诸天人众，一心善听，皆应到此、觐无上尊。","para":true,"t":[416.12,422.73]},{"text":"我为世尊，无能及者，安隐众生，故现于世，","para":true,"t":[423.32,430.04]},{"text":"为大众说，甘露净法。其法一味，解脱涅槃，","para":true,"t":[430.64,436.3]},{"text":"以一妙音、演畅斯义，常为大乘，而作因缘。","para":true,"t":[436.88,441.68]},{"text":"我观一切，普皆平等，无有彼此、爱憎之心。","para":true,"t":[442.28,447.1]},{"text":"我无贪著，亦无限碍，恒为一切、平等说法，","para":true,"t":[447.68,453.36]},{"text":"如为一人，众多亦然。常演说法，曾无他事，","para":true,"t":[453.96,459.63]},{"text":"去来坐立、终不疲厌，充足世间，如雨普润。","para":true,"t":[460.24,467.72]},{"text":"贵贱上下，持戒毁戒，威仪具足、及不具足，","para":true,"t":[468.32,474.16]},{"text":"正见邪见，利根钝根，等雨法雨，而无懈倦。","para":true,"t":[474.76,481.36]},{"text":"一切众生、闻我法者，随力所受，住于诸地。","para":true,"t":[481.96,488.06]},{"text":"或处人天，转轮圣王，释梵诸王，是小药草。","para":true,"t":[488.68,494.34]},{"text":"知无漏法，能得涅槃，起六神通，及得三明，","para":true,"t":[494.92,500.57]},{"text":"独处山林，常行禅定，得缘觉证，是中药草。","para":true,"t":[501.16,507.6]},{"text":"求世尊处，我当作佛，行精进定，是上药草。","para":true,"t":[508.2,515.56]},{"text":"又诸佛子、专心佛道，常行慈悲，自知作佛，","para":true,"t":[516.16,522.99]},{"text":"决定无疑，是名小树。安住神通，转不退轮，","para":true,"t":[523.6,529.72]},{"text":"度无量亿、百千众生，如是菩萨，名为大树。","para":true,"t":[530.32,536.39]},{"text":"佛平等说，如一味雨，随众生性、所受不同，","para":true,"t":[537.0,543.0]},{"text":"如彼草木，所禀各异，佛以此喻、方便开示，","para":true,"t":[543.6,549.99]},{"text":"种种言辞，演说一法，于佛智慧，如海一滴。","para":true,"t":[550.56,556.68]},{"text":"我雨法雨，充满世间，一味之法，随力修行，","para":true,"t":[557.28,563.12]},{"text":"如彼丛林、药草诸树，随其大小，渐增茂好。","para":true,"t":[563.72,569.96]},{"text":"诸佛之法，常以一味，令诸世间、普得具足，","para":true,"t":[570.56,575.52]},{"text":"渐次修行，皆得道果。声闻缘觉，处于山林，","para":true,"t":[576.12,581.72]},{"text":"住最后身，闻法得果，是名药草，各得增长。","para":true,"t":[582.32,588.65]},{"text":"若诸菩萨，智慧坚固，了达三界，求最上乘，","para":true,"t":[589.28,594.6]},{"text":"是名小树、而得增长。复有住禅，得神通力，","para":true,"t":[595.2,601.88]},{"text":"闻诸法空，心大欢喜，放无数光，度诸众生，","para":true,"t":[602.48,607.73]},{"text":"是名大树、而得增长。如是迦叶，佛所说法，","para":true,"t":[608.32,614.28]},{"text":"譬如大云，以一味雨、润于人华，各得成实。","para":true,"t":[614.88,620.56]},{"text":"迦叶当知，以诸因缘、种种譬喻、开示佛道，","para":true,"t":[621.16,627.49]},{"text":"是我方便，诸佛亦然。今为汝等，说最实事，","para":true,"t":[628.08,633.4]},{"text":"诸声闻众、皆非灭度，汝等所行，是菩萨道，","para":true,"t":[634.02,639.12]},{"text":"渐渐修学，悉当成佛。","para":true,"t":[639.72,643.12]}]},{"title":"授记品第六","stem":"007_授记品第六","dur":703.13,"src":"audio/007.mp3","pieces":[{"text":"授记品第六","para":true,"t":[0.0,1.13]},{"text":"尔时世尊说是偈已，告诸大众，唱如是言：‘我此弟子摩诃迦叶，于未来世、当得奉觐三百万亿诸佛世尊，供养、恭敬，尊重、赞叹，广宣诸佛无量大法。","para":false,"t":[1.72,18.64]},{"text":"于最后身、得成为佛，名曰光明如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。国名光德，劫名大庄严。","para":false,"t":[18.89,36.97]},{"text":"佛寿、十二小劫，正法住世、二十小劫，像法亦住二十小劫。国界严饰，无诸秽恶、瓦砾荆棘、便利不净。其土平正，无有高下、坑坎堆阜。","para":false,"t":[37.22,55.26]},{"text":"琉璃为地，宝树行列，黄金为绳、以界道侧，散诸宝华，周遍清净。其国菩萨、无量千亿，诸声闻众、亦复无数，无有魔事，虽有魔及魔民，皆护佛法。’","para":true,"t":[55.51,75.36]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[75.95,80.75]},{"text":"告诸比丘，我以佛眼，见是迦叶。于未来世、","para":true,"t":[81.35,88.47]},{"text":"过无数劫，当得作佛。而于来世、供养奉觐，","para":true,"t":[89.07,96.27]},{"text":"三百万亿、诸佛世尊，为佛智慧，净修梵行。","para":true,"t":[96.87,103.64]},{"text":"供养最上、二足尊已，修习一切、无上之慧，","para":true,"t":[104.27,109.93]},{"text":"于最后身、得成为佛。其土清净，琉璃为地，","para":true,"t":[110.55,117.15]},{"text":"多诸宝树、行列道侧、金绳界道，见者欢喜。","para":true,"t":[117.75,123.91]},{"text":"常出好香，散众名华，种种奇妙、以为庄严。","para":true,"t":[124.51,130.62]},{"text":"其地平正，无有丘坑。诸菩萨众、不可称计，","para":true,"t":[131.23,137.45]},{"text":"其心调柔，逮大神通，奉持诸佛、大乘经典。","para":true,"t":[138.03,144.07]},{"text":"诸声闻众、无漏后身，法王之子，亦不可计，","para":true,"t":[144.67,150.35]},{"text":"乃以天眼、不能数知。其佛当寿、十二小劫，","para":true,"t":[150.91,155.91]},{"text":"正法住世、二十小劫，像法亦住，二十小劫。","para":true,"t":[156.51,162.31]},{"text":"光明世尊，其事如是。","para":true,"t":[162.91,165.54]},{"text":"尔时大目犍连、须菩提、摩诃迦栴延等，皆悉悚栗，一心合掌，瞻仰尊颜，目不暂舍，即共同声而说偈言：","para":true,"t":[166.15,177.71]},{"text":"大雄猛世尊，诸释之法王，哀愍我等故，而赐佛音声。","para":true,"t":[178.31,185.75]},{"text":"若知我深心，见为授记者，如以甘露洒，除热得清凉。","para":true,"t":[186.35,193.16]},{"text":"如从饥国来，忽遇大王膳，心犹怀疑惧，未敢即便食，","para":true,"t":[193.75,201.05]},{"text":"若复得王教，然后乃敢食。我等亦如是，每惟小乘过，","para":true,"t":[201.67,209.35]},{"text":"不知当云何、得佛无上慧。虽闻佛音声，言我等作佛，","para":true,"t":[209.95,217.15]},{"text":"心尚怀忧惧，如未敢便食，若蒙佛授记，尔乃快安乐。","para":true,"t":[217.75,225.15]},{"text":"大雄猛世尊，常欲安世间，愿赐我等记，如饥需教食。","para":true,"t":[225.74,234.36]},{"text":"尔时世尊知诸大弟子心之所念，告诸比丘：‘是须菩提，于当来世、奉觐三百万亿那由他佛，供养恭敬，尊重赞叹，常修梵行，具菩萨道。","para":false,"t":[234.95,253.03]},{"text":"于最后身、得成为佛，号曰名相如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。劫名有宝。国名宝生。","para":false,"t":[253.28,271.0]},{"text":"其土平正，玻璃为地，宝树庄严，无诸丘坑、沙砾、荆棘、便利之秽，宝华覆地，周遍清净。其土人民，皆处宝台、珍妙楼阁。声闻弟子、无量无边，算数譬喻所不能知。","para":false,"t":[271.25,293.33]},{"text":"诸菩萨众、无数千万亿那由他。佛寿、十二小劫。正法住世、二十小劫，像法亦住二十小劫。其佛常处虚空、为众说法，度脱无量菩萨、及声闻众。’","para":true,"t":[293.58,311.62]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[312.22,315.91]},{"text":"诸比丘众，今告汝等，皆当一心，听我所说。","para":true,"t":[316.5,322.82]},{"text":"我大弟子、须菩提者，当得作佛，号曰名相。","para":true,"t":[323.42,328.82]},{"text":"当供无数、万亿诸佛，随佛所行，渐具大道。","para":true,"t":[329.42,335.26]},{"text":"最后身得，三十二相，端正姝妙，犹如宝山。","para":true,"t":[335.86,340.94]},{"text":"其佛国土，严净第一，众生见者，无不爱乐，","para":true,"t":[341.54,348.55]},{"text":"佛于其中、度无量众。其佛法中，多诸菩萨，","para":true,"t":[349.14,356.06]},{"text":"皆悉利根，转不退轮。彼国常以、菩萨庄严，","para":true,"t":[356.66,363.98]},{"text":"诸声闻众、不可称数，皆得三明，具六神通，","para":true,"t":[364.58,369.66]},{"text":"住八解脱，有大威德。其佛说法，现于无量，","para":true,"t":[370.26,376.43]},{"text":"神通变化、不可思议。诸天人民，数如恒沙，","para":true,"t":[377.06,383.34]},{"text":"皆共合掌，听受佛语。其佛当寿、十二小劫，","para":true,"t":[383.94,389.9]},{"text":"正法住世、二十小劫，像法亦住 二十小劫。","para":true,"t":[390.5,395.55]},{"text":"尔时世尊复告诸比丘众：‘我今语汝，是大迦旃延，于当来世，以诸供具、供养奉事八千亿佛，恭敬、尊重。","para":false,"t":[396.14,410.54]},{"text":"诸佛灭后，各起塔庙，高千由旬，纵广正等五百由旬，皆以金、银、琉璃、砗磲、玛瑙、真珠、玫瑰、七宝合成，众华、璎珞、涂香、末香、烧香、缯盖、幢幡，供养塔庙。","para":false,"t":[410.79,433.07]},{"text":"过是已后，当复供养二万亿佛，亦复如是。’","para":true,"t":[433.32,437.85]},{"text":"‘供养是诸佛已，具菩萨道。当得作佛，号曰阎浮那提金光如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[438.44,454.8]},{"text":"其土平正，玻璃为地，宝树庄严、黄金为绳、以界道侧，妙华覆地，周遍清净，见者欢喜。无四恶道，地狱、饿鬼、畜生、阿修罗道。","para":false,"t":[455.05,476.67]},{"text":"多有天、人、诸声闻众、及诸菩萨，无量万亿、庄严其国。佛寿、十二小劫，正法住世、二十小劫，像法亦住二十小劫。’","para":true,"t":[476.9,493.7]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[494.3,498.66]},{"text":"诸比丘众、皆一心听，如我所说，真实无异。","para":true,"t":[499.26,504.75]},{"text":"是迦栴延，当以种种，妙好供具、供养诸佛。","para":true,"t":[505.33,510.67]},{"text":"诸佛灭后，起七宝塔，亦以华香、供养舍利。","para":true,"t":[511.26,516.22]},{"text":"其最后身，得佛智慧，成等正觉。国土清净，","para":true,"t":[516.82,522.62]},{"text":"度脱无量，万亿众生，皆为十方，之所供养，","para":true,"t":[523.22,529.1]},{"text":"佛之光明，无能胜者。其佛号曰，阎浮金光。","para":true,"t":[529.7,535.51]},{"text":"菩萨声闻，断一切有，无量无数，庄严其国。","para":true,"t":[536.1,542.67]},{"text":"尔时世尊复告大众：‘我今语汝，是大目犍连，当以种种供具、供养八千诸佛，恭敬、尊重。","para":false,"t":[543.26,553.16]},{"text":"诸佛灭后，各起塔庙，高千由旬，纵广正等五百由旬，皆以金、银、琉璃、砗磲、玛瑙、真珠、玫瑰、七宝合成，众华、璎珞、涂香、末香、烧香、缯盖、幢幡，以用供养。","para":false,"t":[553.39,575.79]},{"text":"过是已后，当复供养二百万亿诸佛，亦复如是。当得成佛，号曰多摩罗跋栴檀香如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[576.03,594.19]},{"text":"劫名喜满，国名意乐。其土平正，玻璃为地，宝树庄严，散真珠华，周遍清净，见者欢喜。多诸天、人、菩萨、声闻，其数无量。","para":false,"t":[594.44,611.0]},{"text":"佛寿二十四小劫，正法住世、四十小劫，像法亦住四十小劫。’","para":true,"t":[611.25,618.55]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[619.13,623.93]},{"text":"我此弟子、大目犍连，舍是身已，得见八千，","para":true,"t":[624.53,630.23]},{"text":"二百万亿，诸佛世尊，为佛道故，供养恭敬。","para":true,"t":[630.81,636.49]},{"text":"于诸佛所、常修梵行，于无量劫、奉持佛法。","para":true,"t":[637.09,642.57]},{"text":"诸佛灭后，起七宝塔，长表金刹，华香伎乐，","para":true,"t":[643.17,648.37]},{"text":"而以供养，诸佛塔庙。渐渐具足，菩萨道已，","para":true,"t":[648.97,654.69]},{"text":"于意乐国、而得作佛，号多摩罗、栴檀之香。","para":true,"t":[655.29,660.25]},{"text":"其佛寿命、二十四劫，常为天人，演说佛道。","para":true,"t":[660.85,666.29]},{"text":"声闻无量，如恒河沙，三明六通，有大威德。","para":true,"t":[666.89,673.09]},{"text":"菩萨无数，志固精进，于佛智慧、皆不退转。","para":true,"t":[673.72,679.71]},{"text":"佛灭度后，正法当住 四十小劫，像法亦尔。","para":true,"t":[680.29,686.01]},{"text":"我诸弟子，威德具足，其数五百，皆当授记。","para":true,"t":[686.61,692.25]},{"text":"于未来世、咸得成佛。我及汝等、宿世因缘，","para":true,"t":[692.85,699.13]},{"text":"吾今当说，汝等善听。","para":true,"t":[699.73,702.49]}]},{"title":"化城喻品第七","stem":"008_化城喻品第七","dur":2152.32,"src":"audio/008.mp3","pieces":[{"text":"化城喻品第七","para":true,"t":[0.0,2.12]},{"text":"佛告诸比丘：‘乃往过去无量无边不可思议阿僧祇劫，尔时有佛，名大通智胜如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊，其国名好城，","para":false,"t":[2.72,26.36]},{"text":"劫名大相。","para":false,"t":[26.61,27.73]},{"text":"诸比丘，彼佛灭度已来，甚大久远，譬如三千大千世界所有地种，假使有人、磨以为墨、过于东方千国土、乃下一点，大如微尘，又过千国土、复下一点，如是展转尽地种墨，","para":false,"t":[27.98,51.42]},{"text":"于汝等意云何，是诸国土，若算师，若算师弟子，能得边际、知其数否？’‘不也、世尊。’","para":false,"t":[51.67,64.93]},{"text":"‘诸比丘，是人所经国土，若点不点，尽抹为尘，一尘一劫，彼佛灭度已来，复过是数无量无边百千万亿阿僧祇劫，我以如来知见力故，观彼久远、犹若今日。’","para":true,"t":[65.16,82.6]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[83.2,87.28]},{"text":"我念过去世、无量无边劫，有佛两足尊，名大通智胜。","para":true,"t":[87.87,94.76]},{"text":"如人以力磨，三千大千土，尽此诸地种，皆悉以为墨，","para":true,"t":[95.36,101.72]},{"text":"过于千国土，乃下一尘点，如是展转点，尽此诸尘墨。","para":true,"t":[102.32,110.12]},{"text":"如是诸国土，点与不点等、复尽抹为尘，一尘为一劫。","para":true,"t":[110.72,117.2]},{"text":"此诸微尘数，其劫复过是，彼佛灭度来，如是无量劫。","para":true,"t":[117.82,126.2]},{"text":"如来无碍智，知彼佛灭度，及声闻菩萨，如见今灭度。","para":true,"t":[126.8,134.12]},{"text":"诸比丘当知，佛智净微妙，无漏无所碍，通达无量劫。","para":true,"t":[134.72,142.45]},{"text":"佛告诸比丘：‘大通智胜佛、寿五百四十万亿那由他劫。","para":false,"t":[143.04,149.28]},{"text":"其佛本坐道场，破魔军已，垂得阿耨多罗三藐三菩提，而诸佛法不现在前，如是一小劫乃至十小劫，结跏趺坐，身心不动，而诸佛法犹不在前。’","para":true,"t":[149.53,165.65]},{"text":"‘尔时忉利诸天、先为彼佛、于菩提树下、敷师子座，高一由旬，佛于此座、当得阿耨多罗三藐三菩提。","para":false,"t":[166.25,177.09]},{"text":"适坐此座，时诸梵天王、雨众天华、面百由旬，香风时来，吹去萎华，更雨新者，如是不绝、满十小劫供养于佛，乃至灭度、常雨此华。","para":false,"t":[177.34,193.62]},{"text":"四王诸天、为供养佛，常击天鼓，其余诸天、作天伎乐，满十小劫，至于灭度、亦复如是。’","para":true,"t":[193.87,204.99]},{"text":"‘诸比丘，大通智胜佛过十小劫，诸佛之法、乃现在前，成阿耨多罗三藐三菩提。其佛未出家时，有十六子，其第一者、名曰智积。","para":false,"t":[205.59,219.88]},{"text":"诸子各有种种珍异玩好之具，闻父得成阿耨多罗三藐三菩提，皆舍所珍，往诣佛所。诸母涕泣而随送之。其祖转轮圣王、与一百大臣、及余百千万亿人民，皆共围绕、随至道场。","para":false,"t":[220.12,240.48]},{"text":"咸欲亲近大通智胜如来，供养、恭敬，尊重、赞叹。到已、头面礼足，绕佛毕已，一心合掌、瞻仰世尊，以偈颂曰：","para":true,"t":[240.73,252.73]},{"text":"大威德世尊，为度众生故，于无量亿劫，尔乃得成佛，","para":true,"t":[253.33,262.21]},{"text":"诸愿已具足，善哉吉无上。世尊甚稀有，一坐十小劫，","para":true,"t":[262.81,270.41]},{"text":"身体及手足、静然安不动。其心常惔怕，未曾有散乱，","para":true,"t":[271.01,277.38]},{"text":"究竟永寂灭，安住无漏法。今者见世尊 安隐成佛道，","para":true,"t":[277.97,288.33]},{"text":"我等得善利，称庆大欢喜。众生常苦恼、盲瞑无导师，","para":true,"t":[288.93,296.53]},{"text":"不识苦尽道，不知求解脱。长夜增恶趣，减损诸天众，","para":true,"t":[297.13,305.17]},{"text":"从冥入于冥，永不闻佛名。今佛得最上、安隐无漏道，","para":true,"t":[305.77,314.29]},{"text":"我等及天人，为得最大利，是故咸稽首、归命无上尊。","para":true,"t":[314.89,321.9]},{"text":"尔时十六王子、偈赞佛已，劝请世尊转于法轮，咸作是言：‘世尊说法，多所安隐、怜愍、饶益、诸天人民。’重说偈言：","para":true,"t":[322.49,335.61]},{"text":"世雄无等伦，百福自庄严，得无上智慧。愿为世间说，","para":true,"t":[336.21,345.22]},{"text":"度脱于我等、及诸众生类，为分别显示，令得是智慧。","para":true,"t":[345.82,352.65]},{"text":"若我等得佛，众生亦复然。世尊知众生 深心之所念，","para":true,"t":[353.24,363.57]},{"text":"亦知所行道，又知智慧力，欲乐及修福，宿命所行业。","para":true,"t":[364.17,371.33]},{"text":"世尊悉知已，当转无上轮。","para":true,"t":[371.93,376.05]},{"text":"佛告诸比丘：“大通智胜佛、得阿耨多罗三藐三菩提时，十方各五百万亿诸佛世界、六种震动，其国中间幽冥之处，日月威光所不能照，而皆大明。","para":false,"t":[376.65,393.01]},{"text":"其中众生，各得相见，咸作是言：“此中云何忽生众生，又其国界、诸天宫殿、乃至梵宫、六种震动，大光普照，遍满世界，胜诸天光。””","para":true,"t":[393.26,408.14]},{"text":"尔时东方五百万亿诸国土中、梵天宫殿，光明照曜，倍于常明。诸梵天王、各作是念：‘今者宫殿光明，昔所未有。以何因缘、而现此相？’是时诸梵天王、即各相诣，共议此事。","para":false,"t":[408.74,432.02]},{"text":"时彼众中、有一大梵天王，名救一切，为诸梵众而说偈言：","para":true,"t":[432.27,439.03]},{"text":"我等诸宫殿，光明昔未有，此是何因缘，宜各共求之。","para":true,"t":[439.63,448.17]},{"text":"为大德天生，为佛出世间，而此大光明、遍照于十方。","para":true,"t":[448.74,456.23]},{"text":"尔时五百万亿国土诸梵天王，与宫殿俱，各以衣祴，盛诸天华，共诣西方、推寻是相。","para":false,"t":[456.83,466.43]},{"text":"见大通智胜如来、处于道场菩提树下，坐师子座，诸天、龙王、乾闼婆、紧那罗、摩侯罗伽、人非人、等，恭敬围绕，及见十六王子、请佛转法轮。","para":true,"t":[466.68,485.6]},{"text":"即时诸梵天王头面礼佛，绕百千匝，即以天华而散佛上。","para":false,"t":[486.2,492.48]},{"text":"其所散华、如须弥山，并以供养佛菩提树，其菩提树、高十由旬，华供养已，各以宫殿奉上彼佛，而作是言：‘惟见哀愍，饶益我等，所献宫殿，愿垂纳受。’","para":false,"t":[492.73,514.29]},{"text":"时诸梵天王、即于佛前，一心同声、以偈颂曰：","para":true,"t":[514.54,519.74]},{"text":"世尊甚稀有，难可得值遇，具无量功德，能救护一切。","para":true,"t":[520.34,527.86]},{"text":"天人之大师，哀愍于世间，十方诸众生，普皆蒙饶益。","para":true,"t":[528.46,536.62]},{"text":"我等所从来、五百万亿国，舍深禅定乐，为供养佛故。","para":true,"t":[537.22,543.66]},{"text":"我等先世福，宫殿甚严饰，今以奉世尊，唯愿哀纳受。","para":true,"t":[544.26,552.4]},{"text":"尔时诸梵天王、偈赞佛已，各作是言：‘惟愿世尊转于法轮，度脱众生，开涅槃道。’时诸梵天王、一心同声、而说偈言：","para":true,"t":[553.02,566.06]},{"text":"世雄两足尊，惟愿演说法，以大慈悲力、度苦恼众生。","para":true,"t":[566.66,573.86]},{"text":"尔时大通智胜如来，默然许之。","para":true,"t":[574.46,578.58]},{"text":"又诸比丘，东南方五百万亿国土、诸大梵王，各自见宫殿光明照曜，昔所未有。欢喜踊跃，生稀有心，即各相诣，共议此事。","para":false,"t":[579.18,593.9]},{"text":"时彼众中、有一大梵天王，名曰大悲，为诸梵众而说偈言：","para":true,"t":[594.15,601.03]},{"text":"是事何因缘、而现如此相，我等诸宫殿，光明昔未有。","para":true,"t":[601.63,609.91]},{"text":"为大德天生，为佛出世间，未曾见此相，当共一心求。","para":true,"t":[610.51,617.65]},{"text":"过千万亿土，寻光共推之，多是佛出世，度脱苦众生。","para":true,"t":[618.27,626.15]},{"text":"尔时五百万亿诸梵天王、与宫殿俱，各以衣祴盛诸天华，共诣西北方、推寻是相。","para":false,"t":[626.75,636.87]},{"text":"见大通智胜如来、处于道场菩提树下，坐师子座，诸天、龙王、乾闼婆、紧那罗、摩侯罗伽、人非人、等，恭敬围绕，及见十六王子、请佛转法轮。","para":true,"t":[637.12,656.96]},{"text":"时诸梵天王头面礼佛，绕百千匝，即以天华而散佛上。所散之华、如须弥山，并以供养佛菩提树。","para":false,"t":[657.56,669.3]},{"text":"华供养已，各以宫殿奉上彼佛，而作是言：‘惟见哀愍，饶益我等，所献宫殿，愿垂纳受。’尔时诸梵天王、即于佛前，一心同声、以偈颂曰：","para":true,"t":[669.57,689.77]},{"text":"圣主天中王，迦陵频伽声，哀愍众生者，我等今敬礼。","para":true,"t":[690.37,697.89]},{"text":"世尊甚稀有，久远乃一现，一百八十劫、空过无有佛，","para":true,"t":[698.49,705.57]},{"text":"三恶道充满，诸天众减少，今佛出于世，为众生作眼，","para":true,"t":[706.16,713.97]},{"text":"世间所归趋，救护于一切，为众生之父，哀愍饶益者。","para":true,"t":[714.57,723.23]},{"text":"我等宿福庆，今得值世尊。","para":true,"t":[723.8,727.21]},{"text":"尔时诸梵天王、偈赞佛已，各作是言：‘惟愿世尊哀愍一切，转于法轮，度脱众生。’时诸梵天王、一心同声、而说偈言：","para":true,"t":[727.81,741.41]},{"text":"大圣转法轮，显示诸法相，度苦恼众生，令得大欢喜。","para":true,"t":[742.01,748.81]},{"text":"众生闻此法，得道若生天，诸恶道减少，忍善者增益。","para":true,"t":[749.41,757.17]},{"text":"尔时大通智胜如来默然许之。","para":true,"t":[757.77,760.84]},{"text":"又、诸比丘，南方五百万亿国土、诸大梵王，各自见宫殿光明照曜，昔所未有。欢喜踊跃，生稀有心，即各相诣，共议此事：‘以何因缘，我等宫殿有此光曜？’","para":false,"t":[761.41,781.01]},{"text":"时彼众中、有一大梵天王，名曰妙法，为诸梵众、而说偈言：","para":true,"t":[781.26,788.58]},{"text":"我等诸宫殿，光明甚威曜，此非无因缘，是相宜求之。","para":true,"t":[789.18,795.6]},{"text":"过于百千劫，未曾见是相，为大德天生，为佛出世间。","para":true,"t":[796.18,803.54]},{"text":"尔时五百万亿诸梵天王、与宫殿俱，各以衣祴盛诸天华，共诣北方、推寻是相。","para":false,"t":[804.14,812.54]},{"text":"见大通智胜如来、处于道场菩提树下，坐师子座，诸天、龙王、乾闼婆、紧那罗、摩侯罗伽、人非人、等，恭敬围绕，及见十六王子请佛转法轮。","para":true,"t":[812.79,829.27]},{"text":"时诸梵天王、头面礼佛，绕百千匝，即以天华而散佛上。所散之华、如须弥山，并以供养佛菩提树。","para":false,"t":[829.87,841.71]},{"text":"华供养已，各以宫殿、奉上彼佛，而作是言：‘惟见哀愍、饶益我等，所献宫殿，愿垂纳受。’尔时诸梵天王，即于佛前、一心同声、以偈颂曰：","para":true,"t":[842.0,861.28]},{"text":"世尊甚难见，破诸烦恼者，过百三十劫 ，今乃得一见。","para":true,"t":[861.88,868.52]},{"text":"诸饥渴众生，以法雨充满，昔所未曾睹、无量智慧者，","para":true,"t":[869.12,876.61]},{"text":"如优昙钵华，今日乃值遇。我等诸宫殿，蒙光故严饰，","para":true,"t":[877.2,886.36]},{"text":"世尊大慈愍，惟愿垂纳受。","para":true,"t":[886.96,890.68]},{"text":"尔时诸梵天王、偈赞佛已，各作是言：‘惟愿世尊转于法轮，令一切世间、诸天、魔、梵、沙门、婆罗门，皆获安隐、而得度脱。’时诸梵天王，一心同声、以偈颂曰：","para":true,"t":[891.28,912.8]},{"text":"惟愿天人尊、转无上法轮，击于大法鼓，而吹大法螺，","para":true,"t":[913.4,920.26]},{"text":"普雨大法雨，度无量众生。我等咸归请，当演深远音。","para":true,"t":[920.84,926.76]},{"text":"尔时大通智胜如来默然许之。西南方、乃至下方，亦复如是。","para":true,"t":[927.36,935.84]},{"text":"尔时上方五百万亿国土、诸大梵王，皆悉自睹所止宫殿、光明威曜，昔所未有。欢喜踊跃，生稀有心，即各相诣，共议此事：‘以何因缘，我等宫殿，有斯光明？’","para":false,"t":[936.44,959.88]},{"text":"时彼众中、有一大梵天王，名曰尸弃，为诸梵众而说偈言：","para":true,"t":[960.13,967.09]},{"text":"今以何因缘，我等诸宫殿、威德光明曜，严饰未曾有。","para":true,"t":[967.69,976.53]},{"text":"如是之妙相，昔所未闻见，为大德天生，为佛出世间。","para":true,"t":[977.13,985.53]},{"text":"尔时五百万亿诸梵天王、与宫殿俱，各以衣祴盛诸天华，共诣下方、推寻是相。","para":false,"t":[986.13,997.2]},{"text":"见大通智胜如来、处于道场菩提树下，坐师子座，诸天、龙王、乾闼婆、紧那罗、摩侯罗伽、人非人、等，恭敬围绕，及见十六王子请佛转法轮。","para":true,"t":[997.46,1012.78]},{"text":"时诸梵天王头面礼佛，绕百千匝，即以天华而散佛上。所散之华、如须弥山，并以供养佛菩提树。","para":false,"t":[1013.38,1023.86]},{"text":"华供养已，各以宫殿、奉上彼佛，而作是言：‘惟见哀愍、饶益我等，所献宫殿，愿垂纳受。’时诸梵天王，即于佛前、一心同声、以偈颂曰：","para":true,"t":[1024.11,1040.51]},{"text":"善哉见诸佛，救世之圣尊，能于三界狱，勉出
