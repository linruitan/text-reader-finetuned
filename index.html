诸众生。","para":true,"t":[1041.1,1048.99]},{"text":"普智天人尊，哀愍群萌类，能开甘露门，广度于一切。","para":true,"t":[1049.59,1055.95]},{"text":"于昔无量劫，空过无有佛，世尊未出时，十方常暗冥，","para":true,"t":[1056.55,1066.55]},{"text":"三恶道增长，阿修罗亦盛，诸天众转减，死多堕恶道。","para":true,"t":[1067.15,1074.87]},{"text":"不从佛闻法，常行不善事，色力及智慧，斯等皆减少，","para":true,"t":[1075.47,1081.99]},{"text":"罪业因缘故，失乐及乐想，住于邪见法，不识善仪则，","para":true,"t":[1082.59,1091.03]},{"text":"不蒙佛所化，常堕于恶道。佛为世间眼，久远时乃出，","para":true,"t":[1091.63,1097.83]},{"text":"哀愍诸众生，故现于世间。超出成正觉，我等甚欣庆，","para":true,"t":[1098.43,1105.83]},{"text":"及余一切众，喜叹未曾有。我等诸宫殿，蒙光故严饰，","para":true,"t":[1106.43,1114.43]},{"text":"今以奉世尊，惟垂哀纳受。愿以此功德，普及于一切，","para":true,"t":[1115.03,1123.85]},{"text":"我等与众生、皆共成佛道。","para":true,"t":[1124.43,1128.47]},{"text":"尔时五百万亿诸梵天王、偈赞佛已，各白佛言：‘惟愿世尊转于法轮，多所安隐，多所度脱。’时诸梵天王而说偈言：","para":true,"t":[1129.07,1142.11]},{"text":"世尊转法轮，击甘露法鼓，度苦恼众生，开示涅槃道。","para":true,"t":[1142.71,1149.35]},{"text":"惟愿受我请，以大微妙音，哀愍而敷演、无量劫集法。","para":true,"t":[1149.95,1157.47]},{"text":"尔时大通智胜如来、受十方诸梵天王、及十六王子请，即时三转十二行法轮，若沙门、婆罗门，若天、魔、梵、及余世间所不能转，谓是苦，是苦集，是苦灭，是苦灭道。","para":false,"t":[1158.07,1178.11]},{"text":"及广说十二因缘法，无明缘行，行缘识，识缘名色，名色缘六入，六入缘触，触缘受，受缘爱，爱缘取，取缘有，有缘生，生缘老死忧悲苦恼。","para":false,"t":[1178.36,1198.28]},{"text":"无明灭、则行灭，行灭、则识灭，识灭、则名色灭，名色灭、则六入灭，六入灭、则触灭，触灭、则受灭，受灭、则爱灭，爱灭、则取灭，取灭、则有灭，有灭、则生灭，生灭、","para":false,"t":[1198.53,1224.46]},{"text":"则老死忧悲苦恼灭。","para":true,"t":[1224.7,1229.47]},{"text":"佛于天人大众之中、说是法时，六百万亿那由他人，以不受一切法故，而于诸漏、心得解脱，皆得深妙禅定，三明、六通，具八解脱。","para":false,"t":[1230.06,1245.18]},{"text":"第二第三第四说法时，千万亿恒河沙那由他等众生，亦以不受一切法故，而于诸漏、心得解脱。从是已后，诸声闻众、无量无边不可称数。","para":true,"t":[1245.44,1260.31]},{"text":"尔时十六王子、皆以童子出家、而为沙弥，诸根通利，智慧明了，已曾供养百千万亿诸佛，净修梵行，求阿耨多罗三藐三菩提。","para":false,"t":[1260.9,1274.91]},{"text":"俱白佛言：‘世尊，是诸无量千万亿大德声闻，皆已成就，世尊，亦当为我等说阿耨多罗三藐三菩提法，我等闻已，皆共修学。世尊，我等志愿如来知见，深心所念，佛自证知。’","para":false,"t":[1275.16,1297.52]},{"text":"尔时转轮圣王所将众中、八万亿人，见十六王子出家，亦求出家。王即听许。","para":true,"t":[1297.77,1306.35]},{"text":"尔时彼佛受沙弥请，过二万劫已，乃于四众之中、说是大乘经，名妙法莲华、教菩萨法、佛所护念。说是经已，十六沙弥为阿耨多罗三藐三菩提故，皆共受持，讽诵通利。","para":false,"t":[1306.93,1328.3]},{"text":"说是经时，十六菩萨沙弥皆悉信受，声闻众中、亦有信解，其余众生、千万亿种，皆生疑惑。佛说是经，于八千劫、未曾休废，说此经已，即入静室，住于禅定、八万四千劫。","para":false,"t":[1328.54,1348.62]},{"text":"是时十六菩萨沙弥、知佛入室、寂然禅定，各升法座，亦于八万四千劫、为四部众、广说分别妙法华经，一一皆度六百万亿那由他恒河沙等众生，示教、利喜，","para":false,"t":[1348.87,1368.51]},{"text":"令发阿耨多罗三藐三菩提心。","para":true,"t":[1368.75,1372.08]},{"text":"大通智胜佛过八万四千劫已，从三昧起，往诣法座、安详而坐，普告大众：‘是十六菩萨沙弥、甚为稀有，诸根通利，智慧明了，已曾供养无量千万亿数诸佛。","para":false,"t":[1372.68,1392.12]},{"text":"于诸佛所，常修梵行，受持佛智，开示众生、令入其中。汝等皆当数数亲近而供养之。所以者何。","para":false,"t":[1392.37,1404.81]},{"text":"若声闻、辟支佛、及诸菩萨，能信是十六菩萨所说经法、受持不毁者，是人皆当得阿耨多罗三藐三菩提、如来之慧。’","para":true,"t":[1405.06,1417.74]},{"text":"佛告诸比丘：‘是十六菩萨、常乐说是妙法莲华经，一一菩萨，所化六百万亿那由他恒河沙等众生，世世所生、与菩萨俱，从其闻法，悉皆信解，以此因缘，得值四百万亿诸佛世尊，","para":false,"t":[1418.34,1439.18]},{"text":"于今不尽。’","para":true,"t":[1439.43,1440.43]},{"text":"‘诸比丘，我今语汝，彼佛弟子十六沙弥，今皆得阿耨多罗三藐三菩提，于十方国土、现在说法，有无量百千万亿菩萨、声闻、以为眷属。","para":false,"t":[1441.03,1457.43]},{"text":"其二沙弥，东方作佛，一名阿，在欢喜国，二名须弥顶。东南方二佛，一名师子音，二名师子相。南方二佛，一名虚空住，二名常灭。西南方二佛，一名帝相，二名梵相。","para":false,"t":[1457.68,1480.48]},{"text":"西方二佛，一名阿弥陀，二名度一切世间苦恼。西北方二佛，一名多摩罗跋栴檀香神通，二名须弥相。北方二佛，一名云自在，二名云自在王。","para":false,"t":[1480.73,1501.33]},{"text":"东北方佛、名坏一切世间怖畏，第十六、我释迦牟尼佛，于娑婆国土、成阿耨多罗三藐三菩提。’","para":true,"t":[1501.58,1512.97]},{"text":"‘诸比丘，我等为沙弥时，各各教化无量百千万亿恒河沙等众生，从我闻法，为阿耨多罗三藐三菩提。","para":false,"t":[1513.54,1524.62]},{"text":"此诸众生，于今有住声闻地者，我常教化阿耨多罗三藐三菩提，是诸人等，应以是法、渐入佛道。所以者何。如来智慧，难信难解。","para":false,"t":[1524.88,1540.35]},{"text":"尔时所化无量恒河沙等众生者，汝等诸比丘、及我灭度后、未来世中声闻弟子是也。我灭度后，复有弟子、不闻是经，不知不觉菩萨所行，自于所得功德、生灭度想，当入涅槃。","para":false,"t":[1540.6,1561.44]},{"text":"我于余国作佛，更有异名，是人虽生灭度之想、入于涅槃，而于彼土、求佛智慧，得闻是经，惟以佛乘而得灭度，更无余乘，除诸如来方便说法。’","para":true,"t":[1561.69,1577.27]},{"text":"‘诸比丘，若如来自知涅槃时到，众又清净，信解坚固，了达空法，深入禅定，便集诸菩萨及声闻众，为说是经。世间无有二乘而得灭度，惟一佛乘得灭度耳。","para":false,"t":[1577.85,1596.15]},{"text":"比丘当知，如来方便、深入众生之性，如其志乐小法，深著五欲，为是等故、说于涅槃，是人若闻，则便信受。’","para":true,"t":[1596.38,1609.36]},{"text":"‘譬如五百由旬险难恶道，旷绝无人、怖畏之处，若有多众，欲过此道、至珍宝处。有一导师，聪慧明达，善知险道通塞之相，将导众人，欲过此难。","para":false,"t":[1609.94,1624.07]},{"text":"所将人众、中路懈退，白导师言：“我等疲极、而复怖畏，不能复进，前路犹远，今欲退还。”导师多诸方便、而作是念，此等可愍，云何舍大珍宝而欲退还。","para":false,"t":[1624.31,1642.43]},{"text":"作是念已，以方便力，于险道中，过三百由旬、化作一城。告众人言：“汝等勿怖，莫得退还。今此大城，可于中止，随意所作，若入是城，快得安隐。若能前至宝所，亦可得去。”","para":false,"t":[1642.68,1665.2]},{"text":"是时疲极之众、心大欢喜，叹未曾有：“我等今者、免斯恶道，快得安隐。”于是众人前入化城，生已度想，生安隐想。尔时导师，知此人众既得止息，无复疲倦。","para":false,"t":[1665.45,1686.45]},{"text":"即灭化城，语众人言：“汝等去来，宝处在近。向者大城，我所化作、为止息耳。”’","para":true,"t":[1686.7,1698.9]},{"text":"‘诸比丘，如来亦复如是，今为汝等作大导师，知诸生死烦恼恶道、险难长远，应去应度。","para":false,"t":[1699.51,1710.06]},{"text":"若众生但闻一佛乘者，则不欲见佛，不欲亲近，便作是念：“佛道长远，久受勤苦、乃可得成。”佛知是心、怯弱下劣，以方便力，而于中道为止息故，说二涅槃。","para":false,"t":[1710.31,1730.47]},{"text":"若众生住于二地，如来尔时即便为说：“汝等所作未办，汝所住地、近于佛慧，当观察筹量所得涅槃、非真实也。但是如来方便之力，于一佛乘、分别说三。”","para":false,"t":[1730.72,1748.02]},{"text":"如彼导师、为止息故，化作大城。既知息已，而告之言：“宝处在近，此城非实，我化作耳。”’","para":true,"t":[1748.29,1758.8]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[1759.41,1762.93]},{"text":"大通智胜佛，十劫坐道场，佛法不现前，不得成佛道。","para":true,"t":[1763.53,1770.18]},{"text":"诸天神龙王、阿修罗众等，常雨于天华，以供养彼佛，","para":true,"t":[1770.77,1777.5]},{"text":"诸天击天鼓，并作众伎乐，香风吹萎华，更雨新好者。","para":true,"t":[1778.09,1786.73]},{"text":"过十小劫已，乃得成佛道，诸天及世人，心皆怀踊跃。","para":true,"t":[1787.33,1794.97]},{"text":"彼佛十六子，皆与其眷属、千万亿围绕，俱行至佛所，","para":true,"t":[1795.57,1801.97]},{"text":"头面礼佛足，而请转法轮。圣师子法雨，充我及一切，","para":true,"t":[1802.57,1808.58]},{"text":"世尊甚难值，久远时一现，为觉悟群生，震动于一切。","para":true,"t":[1809.17,1816.01]},{"text":"东方诸世界、五百万亿国，梵宫殿光曜，昔所未曾有。","para":true,"t":[1816.61,1825.5]},{"text":"诸梵见此相，寻来至佛所，散花以供养，并奉上宫殿，","para":true,"t":[1826.1,1832.19]},{"text":"请佛转法轮，以偈而赞叹。佛知时未至，受请默然坐。","para":true,"t":[1832.76,1840.45]},{"text":"三方及四维、上下亦复尔，散华奉宫殿，请佛转法轮，","para":true,"t":[1841.05,1848.41]},{"text":"世尊甚难值，愿以大慈悲、广开甘露门，转无上法轮。","para":true,"t":[1849.01,1855.78]},{"text":"无量慧世尊，受彼众人请，为宣种种法，四谛十二缘，","para":true,"t":[1856.41,1864.13]},{"text":"无明至老死、皆从生缘有。如是众过患，汝等应当知。","para":true,"t":[1864.73,1872.53]},{"text":"宣畅是法时，六百万亿垓、得尽诸苦际，皆成阿罗汉。","para":true,"t":[1873.13,1879.55]},{"text":"第二说法时，千万恒沙众，于诸法不受，亦得阿罗汉。","para":true,"t":[1880.14,1888.03]},{"text":"从是后得道，其数无有量，万亿劫算数、不能得其边。","para":true,"t":[1888.61,1894.57]},{"text":"时十六王子、出家作沙弥，皆共请彼佛、演说大乘法。","para":true,"t":[1895.17,1901.37]},{"text":"我等及营从，皆当成佛道，愿得如世尊、慧眼第一净。","para":true,"t":[1901.98,1908.85]},{"text":"佛知童子心，宿世之所行，以无量因缘、种种诸譬喻，","para":true,"t":[1909.45,1916.74]},{"text":"说六波罗蜜、及诸神通事。分别真实法、菩萨所行道，","para":true,"t":[1917.33,1923.65]},{"text":"说是法华经，如恒河沙偈。彼佛说经已，静室入禅定，","para":true,"t":[1924.25,1932.73]},{"text":"一心一处坐、八万四千劫。是诸沙弥等，知佛禅未出，","para":true,"t":[1933.33,1940.45]},{"text":"为无量亿众、说佛无上慧，各各坐法座，说是大乘经，","para":true,"t":[1941.05,1948.59]},{"text":"于佛宴寂后，宣扬助法化。一一沙弥等、所度诸众生，","para":true,"t":[1949.17,1956.73]},{"text":"有六百万亿，恒河沙等众。彼佛灭度后，是诸闻法者，","para":true,"t":[1957.33,1963.37]},{"text":"在在诸佛土、常与师俱生。是十六沙弥，具足行佛道，","para":true,"t":[1963.97,1971.41]},{"text":"今现在十方，各得成正觉。尔时闻法者，各在诸佛所，","para":true,"t":[1972.01,1979.07]},{"text":"其有住声闻，渐教以佛道。我在十六数，曾亦为汝说，","para":true,"t":[1979.65,1987.81]},{"text":"是故以方便、引汝趋佛慧。以是本因缘，今说法华经，","para":true,"t":[1988.41,1995.13]},{"text":"令汝入佛道，慎勿怀惊惧。譬如险恶道，迥绝多毒兽，","para":true,"t":[1995.73,2003.37]},{"text":"又复无水草，人所怖畏处。无数千万众、欲过此险道，","para":true,"t":[2003.96,2012.49]},{"text":"其路甚旷远，经五百由旬。时有一导师，强识有智慧，","para":true,"t":[2013.09,2020.25]},{"text":"明了心决定，在险济众难。众人皆疲倦、而白导师言，","para":true,"t":[2020.85,2029.29]},{"text":"我等今顿乏，于此欲退还。导师作是念，此辈甚可愍，","para":true,"t":[2029.89,2037.93]},{"text":"如何欲退还，而失大珍宝。寻时思方便，当设神通力，","para":true,"t":[2038.53,2046.25]},{"text":"化作大城郭，庄严诸舍宅，周匝有园林、渠流及浴池，","para":true,"t":[2046.85,2054.33]},{"text":"重门高楼阁，男女皆充满。即作是化已，慰众言勿惧，","para":true,"t":[2054.93,2061.26]},{"text":"汝等入此城，各可随所乐。诸人既入城，心皆大欢喜，","para":true,"t":[2061.89,2067.79]},{"text":"皆生安隐想，自谓已得度。导师知息已，集众而告言，","para":true,"t":[2068.37,2075.85]},{"text":"汝等当前进，此是化城耳。我见汝疲极，中路欲退还，","para":true,"t":[2076.45,2084.01]},{"text":"故以方便力、权化作此城，汝今勤精进，当共至宝所。","para":true,"t":[2084.61,2092.94]},{"text":"我亦复如是，为一切导师。见诸求道者、中路而懈废，","para":true,"t":[2093.53,2101.33]},{"text":"不能度生死、烦恼诸险道。故以方便力，为息说涅槃，","para":true,"t":[2101.94,2108.6]},{"text":"言汝等苦灭，所作皆已办。既知到涅槃，皆得阿罗汉，","para":true,"t":[2109.17,2117.09]},{"text":"尔乃集大众，为说真实法。诸佛方便力，分别说三乘，","para":true,"t":[2117.69,2124.33]},{"text":"唯有一佛乘，息处故说二。今为汝说实，汝所得非灭，","para":true,"t":[2124.93,2132.53]},{"text":"为佛一切智，当发大精进。汝证一切智，十力等佛法，","para":true,"t":[2133.13,2139.92]},{"text":"具三十二相，乃是真实灭。诸佛之导师，为息说涅槃，","para":true,"t":[2140.55,2146.49]},{"text":"既知是息已，引入于佛慧。","para":true,"t":[2147.09,2151.65]}]},{"title":"五百弟子受记品第八","stem":"009_五百弟子受记品第八","dur":817.08,"src":"audio/009.mp3","pieces":[{"text":"五百弟子受记品第八","para":true,"t":[0.0,1.85]},{"text":"尔时富楼那弥多罗尼子、从佛闻是智慧方便、随宜说法，又闻授诸大弟子阿耨多罗三藐三菩提记，复闻宿世因缘之事，复闻诸佛有大自在神通之力，得未曾有，心净踊跃。","para":false,"t":[2.44,20.48]},{"text":"即从座起，到于佛前，头面礼足，却住一面，瞻仰尊颜、目不暂舍。而作是念：‘世尊甚奇特，所为稀有。随顺世间若干种性，以方便知见、而为说法，拔出众生处处贪著。","para":false,"t":[20.73,39.59]},{"text":"我等于佛功德，言不能宣，惟佛世尊能知我等深心本愿。’","para":true,"t":[39.86,47.76]},{"text":"尔时佛告诸比丘：‘汝等见是富楼那弥多罗尼子否。我常称其于说法人中、最为第一。","para":false,"t":[48.34,58.26]},{"text":"亦常叹其种种功德，精勤护持，助宣我法，能于四众、示教利喜，具足解释佛之正法，而大饶益同梵行者。自舍如来，无能尽其言论之辩。’","para":true,"t":[58.51,76.91]},{"text":"‘汝等勿谓富楼那但能护持助宣我法，亦于过去九十亿诸佛所、护持助宣佛之正法，于彼说法人中、亦最第一。","para":false,"t":[77.51,89.31]},{"text":"又于诸佛所说空法，明了通达，得四无碍智，常能审谛清净说法，无有疑惑，具足菩萨神通之力。随其寿命，常修梵行，彼佛世人、咸皆谓之实是声闻。","para":false,"t":[89.56,110.52]},{"text":"而富楼那以斯方便，饶益无量百千众生，又化无量阿僧祇人、令立阿耨多罗三藐三菩提。为净佛土故，常作佛事，教化众生。’","para":true,"t":[110.77,123.69]},{"text":"‘诸比丘，富楼那亦于七佛说法人中、而得第一，今于我所说法人中、亦为第一，于贤劫中当来诸佛、说法人中，亦复第一，而皆护持、助宣佛法。","para":false,"t":[124.3,139.61]},{"text":"亦于未来、护持助宣无量无边诸佛之法，教化饶益无量众生，令立阿耨多罗三藐三菩提。为净佛土故，常勤精进、教化众生，渐渐具足菩萨之道。","para":false,"t":[139.86,157.98]},{"text":"过无量阿僧祇劫，当于此土、得阿耨多罗三藐三菩提，号曰法明如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。’","para":true,"t":[158.23,176.55]},{"text":"其佛、以恒河沙等三千大千世界、为一佛土，七宝为地，地平如掌，无有山陵溪涧沟壑，七宝台观、充满其中，诸天宫殿，近处虚空，人天交接，两得相见。","para":false,"t":[177.15,194.87]},{"text":"无诸恶道，亦无女人，一切众生，皆以化生，无有淫欲。得大神通，身出光明，飞行自在，志念坚固，精进智慧，普皆金色，三十二相、而自庄严。","para":false,"t":[195.12,213.81]},{"text":"其国众生，常以二食，一者、法喜食，二者、禅悦食。有无量阿僧祇千万亿那由他诸菩萨众，得大神通、四无碍智，善能教化众生之类。","para":false,"t":[214.05,230.36]},{"text":"其声闻众、算数校计所不能知，皆得具足六通、三明、及八解脱。其佛国土、有如是等无量功德庄严成就。劫名宝明，国名善净。其佛、寿命无量阿僧祇劫。","para":false,"t":[230.58,248.02]},{"text":"法住甚久，佛灭度后，起七宝塔、遍满其国。","para":true,"t":[248.27,254.47]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[255.07,258.6]},{"text":"诸比丘谛听，佛子所行道，善学方便故，不可得思议。","para":true,"t":[259.19,266.29]},{"text":"知众乐小法、而畏于大智，是故诸菩萨，作声闻缘觉，","para":true,"t":[266.87,273.71]},{"text":"以无数方便、化诸众生类。自说是声闻，去佛道甚远，","para":true,"t":[274.31,280.95]},{"text":"度脱无量众，皆悉得成就，虽小欲懈怠，渐当令作佛。","para":true,"t":[281.55,290.99]},{"text":"内秘菩萨行，外现是声闻，少欲厌生死，实自净佛土。","para":true,"t":[291.59,299.19]},{"text":"示众有三毒，又现邪见相，我弟子如是，方便度众生。","para":true,"t":[299.79,305.99]},{"text":"若我具足说、种种现化事，众生闻是者，心则怀疑惑。","para":true,"t":[306.59,313.71]},{"text":"今此富楼那，于昔千亿佛、勤修所行道，宣护诸佛法。","para":true,"t":[314.31,323.43]},{"text":"为求无上慧，而于诸佛所，现居弟子上。多闻有智慧，","para":true,"t":[324.03,331.08]},{"text":"所说无所畏，能令众欢喜，未曾有疲倦，而以助佛事。","para":true,"t":[331.67,338.0]},{"text":"已度大神通，具四无碍智，知诸根利钝，常说清净法，","para":true,"t":[338.59,345.43]},{"text":"演畅如是义，教诸千亿众，令住大乘法，而自净佛土。","para":true,"t":[346.03,352.95]},{"text":"未来亦供养、无量无数佛，护助宣正法，亦自净佛土。","para":true,"t":[353.55,359.99]},{"text":"常以诸方便，说法无所畏，度不可计众、成就一切智。","para":true,"t":[360.59,366.31]},{"text":"供养诸如来，护持法宝藏，其后得成佛，号名曰法明。","para":true,"t":[366.91,373.68]},{"text":"其国名善净，七宝所合成，劫名为宝明。菩萨众甚多，","para":true,"t":[374.27,380.55]},{"text":"其数无量亿，皆度大神通，威德力具足，充满其国土。","para":true,"t":[381.15,387.56]},{"text":"声闻亦无数，三明八解脱，得四无碍智，以是等为僧。","para":true,"t":[388.15,395.59]},{"text":"其国诸众生，淫欲皆已断，纯一变化生，具相庄严身。","para":true,"t":[396.19,403.59]},{"text":"法喜禅悦食，更无余食想。无有诸女人，亦无诸恶道。","para":true,"t":[404.19,410.29]},{"text":"富楼那比丘，功德悉成满，当得斯净土，贤圣众甚多。","para":true,"t":[410.91,417.27]},{"text":"如是无量事，我今但略说。","para":true,"t":[417.87,421.95]},{"text":"尔时千二百阿罗汉心自在者、作是念：‘我等欢喜，得未曾有，若世尊各见授记、如余大弟子者，不亦快乎。’","para":false,"t":[422.55,433.83]},{"text":"佛知此等心之所念，告摩诃迦叶：‘是千二百阿罗汉，我今当现前次第与授阿耨多罗三藐三菩萨记。","para":false,"t":[434.08,446.52]},{"text":"于此众中，我大弟子憍陈如比丘，当供养六万二千亿佛，然后得成为佛，号曰普明如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[446.77,469.97]},{"text":"其五百阿罗汉、优楼频螺迦叶、伽耶迦叶、那提迦叶、迦留陀夷、优陀夷、阿冕楼驮、离婆多、劫宾那、薄拘罗、周陀、莎伽陀、等，皆当得阿耨多罗三藐三菩提，尽同一号，","para":false,"t":[470.22,488.46]},{"text":"名曰普明。’","para":true,"t":[488.71,490.61]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[491.18,495.01]},{"text":"憍陈如比丘，当见无量佛，过阿僧祇劫，乃成等正觉。","para":true,"t":[495.59,502.03]},{"text":"常放大光明，具足诸神通，名闻遍十方，一切之所敬，","para":true,"t":[502.63,509.43]},{"text":"常说无上道，故号为普明。其国土清净，菩萨皆勇猛，","para":true,"t":[510.04,516.83]},{"text":"咸升妙楼阁，游诸十方国，以无上供具、奉献于诸佛。","para":true,"t":[517.43,523.91]},{"text":"作是供养已，心怀大欢喜，须臾还本国，有如是神力。","para":true,"t":[524.51,531.15]},{"text":"佛寿六万劫，正法住倍寿，像法复倍是，法灭天人忧。","para":true,"t":[531.75,538.23]},{"text":"其五百比丘，次第当作佛，同号曰普明，转次而授记。","para":true,"t":[538.83,546.11]},{"text":"我灭度之后，某甲当作佛，其所化世间，亦如我今日。","para":true,"t":[546.7,553.23]},{"text":"国土之严净，及诸神通力，菩萨声闻众，正法及像法，","para":true,"t":[553.83,561.27]},{"text":"寿命劫多少，皆如上所说。迦叶汝已知，五百自在者，","para":true,"t":[561.87,568.4]},{"text":"余诸声闻众，亦当复如是。其不在此会，汝当为宣说。","para":true,"t":[568.99,575.92]},{"text":"尔时五百阿罗汉、于佛前得受记已，欢喜踊跃，即从座起，到于佛前，头面礼足，悔过自责：‘世尊，我等常作是念，自谓已得究竟灭度，今乃知之、如无智者。所以者何。","para":false,"t":[576.51,594.35]},{"text":"我等应得如来智慧，而便自以小智为足。’","para":true,"t":[594.6,598.72]},{"text":"‘世尊，譬如有人至亲友家，醉酒而卧。是时亲友官事当行，以无价宝珠、系其衣里，与之而去。其人醉卧，都不觉知。起已、游行，到于他国。","para":false,"t":[599.32,617.12]},{"text":"为衣食故，勤力求索，甚大艰难，若少有所得，便以为足。于后、亲友会遇见之，而作是言：“咄哉、丈夫，何为衣食乃至如是。","para":false,"t":[617.37,636.38]},{"text":"我昔欲令汝得安乐，五欲自恣，于某年月日，以无价宝珠、系汝衣里，今故现在。而汝不知，勤苦忧恼，以求自活，甚为痴也。汝今可以此宝、贸易所需，常可如意，无所乏短。”’","para":true,"t":[636.62,659.86]},{"text":"‘佛亦如是，为菩萨时，教化我等，令发一切智心。而寻废忘，不知不觉，既得阿罗汉道，自谓灭度，资生艰难，得少为足。一切智愿，犹在、不失。","para":false,"t":[660.46,683.22]},{"text":"今者、世尊觉悟我等，作如是言：“诸比丘，汝等所得，非究竟灭。我久令汝等种佛善根，以方便故，示涅槃相，而汝谓为实得灭度。”’","para":true,"t":[683.47,700.35]},{"text":"‘世尊，我今乃知实是菩萨，得受阿耨多罗三藐三菩提记，以是因缘，甚大欢喜，得未曾有。’","para":true,"t":[700.95,711.6]},{"text":"尔时阿若憍陈如等，欲重宣此义，而说偈言：","para":true,"t":[712.23,717.68]},{"text":"我等闻无上、安隐授记声，欢喜未曾有，礼无量智佛。","para":true,"t":[718.27,725.92]},{"text":"今于世尊前、自悔诸过咎，于无量佛宝，得少涅槃分，","para":true,"t":[726.51,734.47]},{"text":"如无智愚人，便自以为足。譬如贫穷人、往至亲友家，","para":true,"t":[735.07,742.07]},{"text":"其家甚大富，具设诸肴膳。以无价宝珠、系著内衣里，","para":true,"t":[742.66,751.11]},{"text":"默与而舍去，时卧不觉知。是人既已起，游行诣他国，","para":true,"t":[751.71,759.51]},{"text":"求衣食自济，资生甚艰难，得少便为足，更不愿好者。","para":true,"t":[760.11,767.16]},{"text":"不觉内衣里、有无价宝珠。与珠之亲友，后见此贫人，","para":true,"t":[767.75,773.63]},{"text":"苦切责之已，示以所系珠。贫人见此珠，其心大欢喜，","para":true,"t":[774.23,782.39]},{"text":"富有诸财物，五欲而自恣。我等亦如是，世尊于长夜，","para":true,"t":[782.99,790.32]},{"text":"常愍见教化，令种无上愿。我等无智故，不觉亦不知，","para":true,"t":[790.95,797.99]},{"text":"得少涅槃分，自足不求余。今佛觉悟我，言非实灭度，","para":true,"t":[798.59,804.55]},{"text":"得佛无上慧，尔乃为真灭。我今从佛闻 授记庄严事，","para":true,"t":[805.15,812.47]},{"text":"及转次受决，身心遍欢喜。","para":true,"t":[813.07,816.45]}]},{"title":"授学无学人记品第九","stem":"010_授学无学人记品第九","dur":438.77,"src":"audio/010.mp3","pieces":[{"text":"授学无学人记品第九","para":true,"t":[0.0,3.38]},{"text":"尔时阿难、罗侯罗、而作是念：‘我等每自思惟，设得授记，不亦快乎。’即从座起，到于佛前，头面礼足，俱白佛言：‘世尊，我等于此、亦应有分，惟有如来，我等所归。","para":false,"t":[3.96,26.97]},{"text":"又我等为一切世间天、人、阿修罗、所见知识，阿难常为侍者，护持法藏，罗侯罗是佛之子，若佛见授阿耨多罗三藐三菩提记者，我愿既满，众望亦足。’","para":true,"t":[27.21,44.45]},{"text":"尔时学无学声闻弟子二千人，皆从座起，偏袒右肩，到于佛前，一心合掌，瞻仰世尊，如阿难、罗侯罗、所愿，住立一面。","para":false,"t":[45.05,59.69]},{"text":"尔时佛告阿难：‘汝于来世、当得作佛，号山海慧自在通王如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[59.94,77.54]},{"text":"当供养六十二亿诸佛，护持法藏，然后得阿耨多罗三藐三菩提。教化二十千万亿恒河沙诸菩萨等，令成阿耨多罗三藐三菩提。国名常立胜幡，其土清净，琉璃为地，劫名妙音遍满。","para":false,"t":[77.78,99.71]},{"text":"其佛、寿命无量千万亿阿僧祇劫，若人于千万亿无量阿僧祇劫中、算数校计，不能得知。正法住世、倍于寿命，像法住世、复倍正法。","para":false,"t":[99.96,113.96]},{"text":"阿难，是山海慧自在通王佛，为十方无量千万亿恒河沙等诸佛如来、所共赞叹，称其功德。’","para":true,"t":[114.21,124.61]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[125.2,129.19]},{"text":"我今僧中说，阿难持法者，当供养诸佛，然后成正觉，","para":true,"t":[129.77,136.73]},{"text":"号曰山海慧 自在通王佛。其国土清净，名常立胜幡，","para":true,"t":[137.33,143.65]},{"text":"教化诸菩萨，其数如恒沙。佛有大威德，名闻满十方。","para":true,"t":[144.25,152.73]},{"text":"寿命无有量，以愍众生故。正法倍寿命，像法复倍是。","para":true,"t":[153.33,160.38]},{"text":"如恒河沙等、无数诸众生，于此佛法中，种佛道因缘。","para":true,"t":[160.97,167.57]},{"text":"尔时会中新发意菩萨八千人、咸作是念：‘我等尚不闻诸大菩萨得如是记，有何因缘、而诸声闻得如是决？’","para":true,"t":[168.17,179.49]},{"text":"尔时世尊知诸菩萨、心之所念，而告之曰：‘诸善男子，我与阿难等，于空王佛所、同时发阿耨多罗三藐三菩提心。阿难常乐多闻，我常勤精进。","para":false,"t":[180.09,197.09]},{"text":"是故我已得成阿耨多罗三藐三菩提，而阿难护持我法，亦护将来诸佛法藏，教化成就诸菩萨众，其本愿如是，故获斯记。’","para":true,"t":[197.33,210.39]},{"text":"阿难面于佛前，自闻授记、及国土庄严，所愿具足，心大欢喜，得未曾有。即时忆念过去无量千万亿诸佛法藏，通达无碍，如今所闻，亦识本愿。尔时阿难而说偈言：","para":true,"t":[210.98,233.75]},{"text":"世尊甚稀有，令我念过去，无量诸佛法，如今日所闻。","para":true,"t":[234.34,241.34]},{"text":"我今无复疑，安住于佛道，方便为侍者，护持诸佛法。","para":true,"t":[241.94,250.38]},{"text":"尔时佛告罗侯罗：‘汝于来世、当得作佛，号蹈七宝华如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[250.98,269.54]},{"text":"当供养十世界微尘等数诸佛如来，常为诸佛而作长子，犹如今也。是蹈七宝华佛，国土庄严，寿命劫数，所化弟子，正法、像法，亦如山海慧自在通王如来无异，亦为此佛而作长子。","para":false,"t":[269.79,291.83]},{"text":"过是已后，当得阿耨多罗三藐三菩提。’","para":true,"t":[292.08,297.65]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[298.24,302.36]},{"text":"我为太子时，罗侯为长子，我今成佛道，受法为法子，","para":true,"t":[302.95,310.24]},{"text":"于未来世中，见无量亿佛，皆为其长子，一心求佛道。","para":true,"t":[310.84,317.63]},{"text":"罗侯罗密行，惟我能知之，现为我长子，以示诸众生。","para":true,"t":[318.2,324.97]},{"text":"无量亿千万 功德不可数，安住于佛法，以求无上道。","para":true,"t":[325.6,332.36]},{"text":"尔时世尊见学无学二千人，其意柔软，寂然清净，一心观佛。佛告阿难：‘汝见是学无学二千人否。唯、然，已见。’","para":false,"t":[332.96,345.8]},{"text":"‘阿难，是诸人等，当供养五十世界微尘数诸佛如来，恭敬、尊重，护持法藏。","para":false,"t":[346.06,355.33]},{"text":"末后、同时于十方国、各得成佛，皆同一号，名曰宝相如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。寿命一劫。","para":false,"t":[355.58,372.1]},{"text":"国土庄严，声闻、菩萨、正法、像法、皆悉同等。’","para":true,"t":[372.34,379.23]},{"text":"尔时世尊重宣此义，而说偈言：","para":true,"t":[379.83,383.83]},{"text":"是二千声闻，今于我前住，悉皆与授记，未来当成佛。","para":true,"t":[384.43,391.99]},{"text":"所供养诸佛，如上说尘数，护持其法藏，后当成正觉。","para":true,"t":[392.59,399.39]},{"text":"各于十方国，悉同一名号，俱时坐道场，以证无上慧，","para":true,"t":[399.99,406.39]},{"text":"皆名为宝相。国土及弟子，正法与像法，悉等无有异。","para":true,"t":[406.99,414.0]},{"text":"咸以诸神通、度十方众生，名闻普周遍，渐入于涅槃。","para":true,"t":[414.59,421.8]},{"text":"尔时学无学二千人、闻佛授记，欢喜踊跃、而说偈言：","para":true,"t":[422.39,429.68]},{"text":"世尊慧灯明，我闻授记音，心欢喜充满，如甘露见灌。","para":true,"t":[430.27,438.11]}]},{"title":"法师品第十","stem":"011_法师品第十","dur":772.08,"src":"audio/011.mp3","pieces":[{"text":"法师品第十","para":true,"t":[0.0,1.48]},{"text":"尔时世尊因药王菩萨、告八万大士：‘药王，汝见是大众中，无量诸天、龙王、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人与非人、及比丘、比丘尼、优婆塞、优婆夷、","para":false,"t":[2.08,23.4]},{"text":"求声闻者，求辟支佛者，求佛道者，如是等类，咸于佛前、闻妙法华经一偈一句、乃至一念随喜者，我皆与授记，当得阿耨多罗三藐三菩提。’","para":true,"t":[23.65,40.33]},{"text":"佛告药王：‘又如来灭度之后，若有人闻妙法华经、乃至一偈一句，一念随喜者，我亦与授阿耨多罗三藐三菩提记。","para":false,"t":[40.93,55.41]},{"text":"若复有人、受持、读诵、解说、书写妙法华经，乃至一偈，于此经卷，敬视如佛，种种供养，华、香、璎珞、末香、涂香、烧香，缯盖、幢幡，衣服、伎乐，乃至合掌恭敬。","para":false,"t":[55.66,76.42]},{"text":"药王，当知是诸人等、已曾供养十万亿佛，于诸佛所、成就大愿，愍众生故，生此人间。’","para":true,"t":[76.66,88.41]},{"text":"‘药王，若有人问，何等众生，于未来世、当得作佛。应示、是诸人等，于未来世、必得作佛。何以故。","para":false,"t":[88.98,100.85]},{"text":"若善男子、善女人，于法华经、乃至一句，受持、读诵、解说、书写，种种供养经卷，华、香、璎珞，末香、涂香、烧香，缯盖、幢幡，衣服、伎乐，合掌恭敬，是人、","para":false,"t":[101.1,121.02]},{"text":"一切世间所应瞻奉，应以如来供养而供养之。当知此人是大菩萨，成就阿耨多罗三藐三菩提，哀愍众生，愿生此间，广演分别妙法华经。何况尽能受持、种种供养者？’","para":true,"t":[121.28,144.12]},{"text":"‘药王，当知是人、自舍清净业报，于我灭度后，愍众生故，生于恶世，广演此经。","para":false,"t":[144.72,155.27]},{"text":"若是善男子、善女人，我灭度后，能窃为一人说法华经、乃至一句，当知是人、则如来使，如来所遣、行如来事。何况于大众中、广为人说？’","para":true,"t":[155.53,171.85]},{"text":"‘药王，若有恶人，以不善心，于一劫中、现于佛前，常毁骂佛，其罪尚轻，若人以一恶言、毁呰在家出家读诵法华经者，其罪甚重。’","para":true,"t":[172.45,188.33]},{"text":"‘药王，其有读诵法华经者，当知是人、以佛庄严而自庄严，则为如来肩所荷担。","para":false,"t":[188.93,197.37]},{"text":"其所至方，应随向礼，一心合掌，恭敬、供养，尊重、赞叹，华、香、璎珞，末香、涂香、烧香，缯盖、幢幡，衣服、肴馔，作诸伎乐，人中上供、而供养之，应持天宝、而以散之，","para":false,"t":[197.62,223.43]},{"text":"天上宝聚，应以奉献。所以者何。是人欢喜说法，须臾闻之，即得究竟阿耨多罗三藐三菩提故。’","para":true,"t":[223.67,233.89]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[234.47,238.17]},{"text":"若欲住佛道，成就自然智，常当勤供养，受持法华者。","para":true,"t":[238.75,245.06]},{"text":"其有欲疾得，一切种智慧，当受持是经，并供养持者。","para":true,"t":[245.63,252.27]},{"text":"若有能受持，妙法华经者，当知佛所使，愍念诸众生。","para":true,"t":[252.87,261.12]},{"text":"诸有能受持，妙法华经者，舍于清净土，愍众故生此。","para":true,"t":[261.75,270.91]},{"text":"当知如是人，自在所欲生，能于此恶世，广说无上法。","para":true,"t":[271.51,278.91]},{"text":"应以天华香，及天宝衣服，天上妙宝聚，供养说法者。","para":true,"t":[279.51,286.75]},{"text":"吾灭后恶世、能持是经者，当合掌礼敬，如供养世尊，","para":true,"t":[287.35,294.15]},{"text":"上馔众甘美、及种种衣服、供养是佛子，冀得须臾闻。","para":true,"t":[294.75,301.79]},{"text":"若能于后世、受持是经者，我遣在人中，行于如来事。","para":true,"t":[302.39,309.24]},{"text":"若于一劫中，常怀不善心，作色而骂佛，获无量重罪，","para":true,"t":[309.83,315.55]},{"text":"其有读诵持、是法华经者，须臾加恶言，其罪复过彼。","para":true,"t":[316.17,323.59]},{"text":"有人求佛道，而于一劫中，合掌在我前，以无数偈赞。","para":true,"t":[324.19,331.15]},{"text":"由是赞佛故，得无量功德，叹美持经者、其福复过彼。","para":true,"t":[331.74,338.03]},{"text":"于八十亿劫，以最妙色声、及与香味触、供养持经者，","para":true,"t":[338.63,345.83]},{"text":"如是供养已，若得须臾闻，则应自欣庆、我今获大利。","para":true,"t":[346.43,354.07]},{"text":"药王今告汝，我所说诸经，而于此经中，法华最第一。","para":true,"t":[354.67,361.83]},{"text":"尔时佛复告药王菩萨摩诃萨：‘我所说经典、无量千万亿，已说、今说、当说，而于其中，此法华经、最为难信难解。","para":false,"t":[362.43,375.55]},{"text":"药王，此经是诸佛秘要之藏，不可分布、妄授与人，诸佛世尊之所守护，从昔已来，未曾显说。而此经者，如来现在，犹多怨嫉，况灭度后？’","para":true,"t":[375.8,391.4]},{"text":"‘药王，当知如来灭后，其能书、持、读、诵、供养、为他人说者，如来则为以衣覆之，又为他方现在诸佛之所护念。","para":false,"t":[392.0,405.15]},{"text":"是人有大信力，及志愿力、诸善根力，当知是人、与如来共宿，则为如来手摩其头。’","para":true,"t":[405.41,415.31]},{"text":"‘药王，在在处处，若说、若读、若诵、若书，若经卷所住处，皆应起七宝塔，极令高广严饰，不需复安舍利。所以者何。","para":false,"t":[415.89,430.17]},{"text":"此中已有如来全身，此塔、应以一切华、香、璎珞，缯盖、幢幡，伎乐、歌颂，供养、恭敬，尊重、赞叹。若有人得见此塔，礼拜、供养，当知是等、皆近阿耨多罗三藐三菩提。’","para":true,"t":[430.41,453.81]},{"text":"‘药王，多有人、在家出家行菩萨道，若不能得见、闻、读、诵、书、持、供养、是法华经者，当知是人未善行菩萨道，若有得闻是经典者，乃能善行菩萨之道。","para":false,"t":[454.41,471.63]},{"text":"其有众生、求佛道者，若见、若闻、是法华经，闻已、信解受持者，当知是人、得近阿耨多罗三藐三菩提。’","para":true,"t":[471.86,485.34]},{"text":"‘药王，譬如有人、渴乏需水，于彼高原、穿凿求之，犹见干土，知水尚远，施功不已，转见湿土，遂渐至泥，其心决定、知水必近。","para":false,"t":[485.96,502.19]},{"text":"菩萨亦复如是，若未闻、未解、未能修习是法华经者，当知是人、去阿耨多罗三藐三菩提尚远，若得闻、解、思惟、修习，必知得近阿耨多罗三藐三菩提。所以者何。","para":false,"t":[502.43,521.59]},{"text":"一切菩萨阿耨多罗三藐三菩提，皆属此经，此经开方便门，示真实相。是法华经藏，深固幽远，无人能到，今佛教化成就菩萨、而为开示。’","para":true,"t":[521.84,538.86]},{"text":"‘药王，若有菩萨闻是法华经，惊疑、怖畏，当知是为新发意菩萨，若声闻人闻是经，惊疑、怖畏，当知是为增上慢者。","para":false,"t":[539.48,552.36]},{"text":"药王，若有善男子、善女人，如来灭后，欲为四众说是法华经者，云何应说。是善男子、善女人，入如来室，著如来衣，坐如来座，尔乃应为四众广说斯经。","para":false,"t":[552.61,571.17]},{"text":"如来室者，一切众生中、大慈悲心是，如来衣者，柔和忍辱心是，如来座者，一切法空是，安住是中，然后以不懈怠心，为诸菩萨及四众、广说是法华经。’","para":true,"t":[571.42,589.48]},{"text":"‘药王，我于余国，遣化人、为其集听法众，亦遣化比丘、比丘尼、优婆塞、优婆夷、听其说法，是诸化人，闻法信受，随顺不逆。","para":false,"t":[590.06,605.19]},{"text":"若说法者在空闲处，我时广遣天龙、鬼神、乾闼婆、阿修罗、等，听其说法。我虽在异国，时时令说法者得见我身。若于此经忘失句读，我还为说，令得具足。’","para":true,"t":[605.43,621.47]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[622.07,626.59]},{"text":"欲舍诸懈怠，应当听此经，是经难得闻，信受者亦难。","para":true,"t":[627.19,633.3]},{"text":"如人渴需水，窄凿于高原，犹见干燥土，知去水尚远，","para":true,"t":[633.91,640.43]},{"text":"渐见湿土泥，决定知近水。药王汝当知，如是诸人等，","para":true,"t":[641.03,649.84]},{"text":"不闻法华经，去佛智甚远，若闻是深经，决了声闻法。","para":true,"t":[650.43,657.99]},{"text":"是诸经之王，闻已谛思惟，当知此人等、近于佛智慧。","para":true,"t":[658.59,665.59]},{"text":"若人说此经，应入如来室，著于如来衣，而坐如来座，","para":true,"t":[666.19,672.6]},{"text":"处众无所畏，广为分别说。大慈悲为室，柔和忍辱衣，","para":true,"t":[673.19,681.67]},{"text":"诸法空为座，处此为说法。若说此经时，有人恶口骂，","para":true,"t":[682.27,689.11]},{"text":"加刀杖瓦石，念佛故应忍。我千万亿土、现净坚固身，","para":true,"t":[689.71,700.67]},{"text":"于无量亿劫、为众生说法。若我灭度后、能说此经者，","para":true,"t":[701.27,708.87]},{"text":"我遣化四众、比丘比丘尼、及清信士女、供养于法师，","para":true,"t":[709.47,715.39]},{"text":"引导诸众生，集之令听法。若人欲加恶、刀杖及瓦石，","para":true,"t":[716.0,721.31]},{"text":"则遣变化人、为之作卫护。若说法之人，独在空闲处，","para":true,"t":[721.91,728.59]},{"text":"寂寞无人声，读诵此经典，我尔时为现 清净光明身。","para":true,"t":[729.19,736.87]},{"text":"若忘失章句，为说令通利。若人具是德，或为四众说，","para":true,"t":[737.47,744.31]},{"text":"空处读诵经，皆得见我身。若人在空闲，我遣天龙王、","para":true,"t":[744.92,752.49]},{"text":"夜叉鬼神等，为作听法众。是人乐说法，分别无挂碍，","para":true,"t":[753.07,758.55]},{"text":"诸佛护念故，能令大众喜。若亲近法师，速得菩萨道，","para":true,"t":[759.15,766.75]},{"text":"随顺是师学，得见恒沙佛。","para":true,"t":[767.35,771.43]}]},{"title":"见宝塔品第十一","stem":"012_见宝塔品第十一","dur":942.7,"src":"audio/012.mp3","pieces":[{"text":"见宝塔品第十一","para":true,"t":[0.0,2.34]},{"text":"尔时佛前有七宝塔，高五百由旬，纵广二百五十由旬，从地涌出，住在空中，种种宝物而庄校之。五千栏楯，龛室千万，无数幢幡以为严饰，垂宝璎珞宝铃万亿而悬其上。","para":false,"t":[2.96,21.84]},{"text":"四面皆出多摩罗跋栴檀之香，充遍世界。其诸幡盖，以金、银、琉璃、砗磲、玛瑙、真珠、玫瑰、七宝合成，高至四天王宫。三十三天、雨天曼陀罗华、供养宝塔。","para":false,"t":[22.09,39.33]},{"text":"余诸天龙、夜叉、乾闼婆、阿修罗、迦楼罗、紧那罗、摩侯罗伽、人非人、等，千万亿众，以一切华、香、璎珞、幡盖、伎乐，供养宝塔，恭敬、尊重、赞叹。","para":true,"t":[39.58,58.14]},{"text":"尔时宝塔中、出大音声，叹言：‘善哉善哉，释迦牟尼世尊，能以平等大慧教菩萨法、佛所护念、妙法华经、为大众说。如是如是，释迦牟尼世尊，如所说者，皆是真实。’","para":false,"t":[58.76,79.88]},{"text":"尔时四众见大宝塔住在空中，又闻塔中所出音声，皆得法喜，怪未曾有，从座而起，恭敬合掌，却住一面。","para":true,"t":[80.13,90.89]},{"text":"尔时有菩萨摩诃萨、名大乐说，知一切世间天、人、阿修罗、等，心之所疑，而白佛言，世尊：‘以何因缘，有此宝塔、从地涌出，又于其中发是音声？’","para":false,"t":[91.49,109.9]},{"text":"尔时佛告大乐说菩萨：‘此宝塔中、有如来全身，乃往过去、东方无量千万亿阿僧祇世界，国名宝净，彼中有佛，号曰多宝。","para":false,"t":[110.14,123.46]},{"text":"其佛行菩萨道时，作大誓愿：“若我成佛、灭度之后，于十方国土、有说法华经处，我之塔庙，为听是经故、涌现其前，为作证明，赞言、善哉。”’","para":true,"t":[123.71,141.17]},{"text":"‘彼佛成道已，临灭度时，于天人大众中、告诸比丘，我灭度后，欲供养我全身者，应起一大塔。","para":false,"t":[141.79,154.64]},{"text":"其佛以神通愿力，十方世界，在在处处、若有说法华经者，彼之宝塔、皆涌出其前，全身在于塔中，赞言：“善哉善哉。”’","para":true,"t":[154.88,167.77]},{"text":"‘大乐说，今多宝如来塔、闻说法华经故，从地涌出，赞言：“善哉善哉。”’","para":true,"t":[168.36,177.33]},{"text":"是时大乐说菩萨、以如来神力故，白佛言：‘世尊，我等愿欲见此佛身。’","para":false,"t":[177.92,186.44]},{"text":"佛告大乐说菩萨摩诃萨：‘是多宝佛、有深重愿，若我宝塔、为听法华经故、出于诸佛前时，其有欲以我身示四众者，彼佛分身诸佛、在于十方世界说法，尽还集一处，","para":false,"t":[186.68,207.32]},{"text":"然后我身乃出现耳。’","para":true,"t":[207.57,210.39]},{"text":"‘大乐说，我分身诸佛、在于十方世界说法者，今应当集。’","para":true,"t":[210.97,216.22]},{"text":"大乐说白佛言：‘世尊，我等亦愿欲见世尊分身诸佛，礼拜供养。’","para":false,"t":[216.85,225.21]},{"text":"尔时佛放白毫一光，即见东方五百万亿那由他恒河沙等国土诸佛，彼诸国土，皆以玻璃为地，宝树、宝衣、以为庄严，无数千万亿菩萨、充满其中，遍张宝幔，宝网罗上。","para":false,"t":[225.46,245.38]},{"text":"彼国诸佛，以大妙音而说诸法，及见无量千万亿菩萨，遍满诸国，为众说法。南西北方、四维、上下、白毫相光所照之处，亦复如是。","para":true,"t":[245.63,260.95]},{"text":"尔时十方诸佛、各告众菩萨言：‘善男子，我今应往娑婆世界、释迦牟尼佛所，并供养多宝如来宝塔。’","para":false,"t":[261.55,272.39]},{"text":"时娑婆世界、即变清净，琉璃为地，宝树庄严，黄金为绳、以界八道，无诸聚落、村营、城邑、大海、江河、山川、林薮。","para":false,"t":[272.64,287.76]},{"text":"烧大宝香，曼陀罗华、遍布其地，以宝网幔，罗覆其上，悬诸宝铃。惟留此会众，移诸天人、置于他土。是时、诸佛各将一大菩萨、以为侍者，至娑婆世界，各到宝树下。","para":false,"t":[288.01,309.89]},{"text":"一一宝树、高五百由旬，枝、叶、华、果、次第庄严，诸宝树下、皆有师子之座，高五由旬，亦以大宝而校饰之。尔时诸佛、各于此座结跏趺坐。","para":false,"t":[310.14,326.26]},{"text":"如是展转遍满三千大千世界，而于释迦牟尼佛、一方所分之身，犹故未尽。","para":true,"t":[326.51,335.32]},{"text":"时释迦牟尼佛、欲容受所分身诸佛故，八方各更变二百万亿那由他国，皆令清净，无有地狱、饿鬼、畜生、及阿修罗，又移诸天、人、置于他土。","para":false,"t":[335.91,352.55]},{"text":"所化之国，亦以琉璃为地，宝树庄严，树高五百由旬，枝、叶、华、果、次第严饰，树下皆有宝师子座，高五由旬，种种诸宝以为庄校。","para":false,"t":[352.8,368.0]},{"text":"亦无大海、江河、及目真邻陀山、摩诃目真邻陀山、铁围山、大铁围山、须弥山、等，诸山王，通为一佛国土。","para":false,"t":[368.25,379.94]},{"text":"宝地平正，宝交露幔、遍覆其上，悬诸幡盖，烧大宝香，诸天宝华遍布其地。","para":true,"t":[380.18,390.17]},{"text":"释迦牟尼佛为诸佛当来坐故，复于八方、各更变二百万亿那由他国，皆令清净，无有地狱、饿鬼、畜生、及阿修罗，又移诸天、人、置于他土。","para":false,"t":[390.78,405.86]},{"text":"所化之国，亦以琉璃为地，宝树庄严，树高五百由旬，枝、叶、华、果、次第庄严，树下皆有宝师子座，高五由旬，亦以大宝而校饰之。","para":false,"t":[406.11,421.63]},{"text":"亦无大海、江河、及目真邻陀山、摩诃目真邻陀山、铁围山、大铁围山、须弥山、等，诸山王，通为一佛国土。","para":false,"t":[421.88,434.08]},{"text":"宝地平正，宝交露幔、遍覆其上，悬诸幡盖，烧大宝香，诸天宝华、遍布其地。","para":true,"t":[434.33,443.2]},{"text":"尔时东方释迦牟尼佛所分之身、百千万亿那由他恒河沙等国土中诸佛，各各说法、来集于此，如是次第十方诸佛、皆悉来集，坐于八方，尔时一一方、四百万亿那由他国土诸佛如来、","para":false,"t":[443.77,462.65]},{"text":"遍满其中。是时、诸佛各在宝树下、坐师子座，皆遣侍者问讯释迦牟尼佛，各赍宝华满掬、而告之言：","para":true,"t":[462.9,476.18]},{"text":"‘善男子，汝往诣耆阇崛山、释迦牟尼佛所，如我辞曰：“少病、少恼，气力安乐，及菩萨、声闻众、悉安隐否？”","para":false,"t":[476.78,489.14]},{"text":"以此宝华、散佛供养，而作是言：“彼某甲佛，与欲开此宝塔”，诸佛遣使、亦复如是。’","para":true,"t":[489.39,499.91]},{"text":"尔时释迦牟尼佛、见所分身佛悉已来集，各各坐于师子之座，皆闻诸佛与欲同开宝塔。即从座起，住虚空中。一切四众，起立、合掌，一心观佛。","para":false,"t":[500.51,519.75]},{"text":"于是释迦牟尼佛、以右指开七宝塔户，出大音声，如却关钥、开大城门。即时一切众会，皆见多宝如来、于宝塔中坐师子座，全身不散，如入禅定。","para":false,"t":[520.0,537.92]},{"text":"又闻其言：‘善哉善哉，释迦牟尼佛、快说是法华经，我为听是经故、而来至此。’","para":false,"t":[538.17,548.29]},{"text":"尔时四众等、见过去无量千万亿劫灭度佛说如是言，叹未曾有，以天宝华聚、散多宝佛及释迦牟尼佛上。","para":true,"t":[548.54,561.34]},{"text":"尔时多宝佛、于宝塔中、分半座与释迦牟尼佛，而作是言：‘释迦牟尼佛、可就此座。’即时释迦牟尼佛入其塔中，坐其半座，结跏趺坐。","para":false,"t":[561.94,577.42]},{"text":"尔时、大众见二如来在七宝塔中师子座上、结跏趺坐，各作是念：‘佛座高远，惟愿如来以神通力，令我等辈、俱处虚空。’即时释迦牟尼佛、以神通力，接诸大众、皆在虚空。","para":false,"t":[577.67,598.31]},{"text":"以大音声、普告四众：‘谁能于此娑婆国土、广说妙法华经，今正是时。如来不久当入涅槃，佛欲以此妙法华经、付嘱有在。’","para":true,"t":[598.55,612.4]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[613.0,616.78]},{"text":"圣主世尊、虽久灭度，在宝塔中，尚为法来，","para":true,"t":[617.36,622.96]},{"text":"诸人云何 不勤为法。此佛灭度，无央数劫，","para":true,"t":[623.56,629.52]},{"text":"处处听法，以难遇故。彼佛本愿，我灭度后，","para":true,"t":[630.12,635.72]},{"text":"在在所往，常为听法。又我分身，无量诸佛，","para":true,"t":[636.32,643.84]},{"text":"如恒沙等，来欲听法。及见灭度，多宝如来，","para":true,"t":[644.44,649.82]},{"text":"各舍妙土，及弟子众、天人龙神、诸供养事，","para":true,"t":[650.4,656.16]},{"text":"令法久住，故来至此。为坐诸佛，以神通力、","para":true,"t":[656.76,663.12]},{"text":"移无量众，令国清净。诸佛各各，诣宝树下，","para":true,"t":[663.72,669.76]},{"text":"如清净池、莲华庄严。其宝树下、诸师子座，","para":true,"t":[670.36,677.2]},{"text":"佛坐其上，光明严饰，如夜闇中、燃大炬火。","para":true,"t":[677.8,685.08]},{"text":"身出妙香，遍十方国，众生蒙薰，喜不自胜，","para":true,"t":[685.68,691.17]},{"text":"譬如大风、吹小树枝。以是方便，令法久住。","para":true,"t":[691.8,697.72]},{"text":"告诸大众，我灭度后，谁能护持、读说斯经，","para":true,"t":[698.32,704.49]},{"text":"今于佛前、自说誓言。其多宝佛，虽久灭度，","para":true,"t":[705.12,711.77]},{"text":"以大誓愿、而师子吼。多宝如来，及与我身，","para":true,"t":[712.36,717.92]},{"text":"所集化佛，当知此意。诸佛子等，谁能护法，","para":true,"t":[718.52,724.71]},{"text":"当发大愿，令得久住。其有能护，此经法者，","para":true,"t":[725.29,731.55]},{"text":"则为供养，我及多宝。此多宝佛，处于宝塔，","para":true,"t":[732.12,737.56]},{"text":"常游十方，为是经故，亦复供养，诸来化佛，","para":true,"t":[738.16,745.36]},{"text":"庄严光饰、诸世界者，若说此经，则为见我，","para":true,"t":[745.96,752.01]},{"text":"多宝如来、及诸化佛。诸善男子，各谛思惟，","para":true,"t":[752.6,758.68]},{"text":"此为难事，宜发大愿。诸余经典，数如恒沙，","para":true,"t":[759.28,765.16]},{"text":"虽说此等，未足为难。若接须弥，掷置他方，","para":true,"t":[765.76,772.08]},{"text":"无数佛土，亦未为难。若以足指，动大千界，","para":true,"t":[772.68,780.05]},{"text":"远掷他国，亦未为难。若立有顶，为众演说，","para":true,"t":[780.64,786.97]},{"text":"无量余经，亦未为难。若佛灭后，于恶世中、","para":true,"t":[787.6,794.6]},{"text":"能说此经，是则为难。假使有人，手把虚空、","para":true,"t":[795.2,800.61]},{"text":"而以游行，亦未为难。于我灭后，若自书持，","para":true,"t":[801.2,807.2]},{"text":"若使人书，是则为难。若以大地，置足甲上，","para":true,"t":[807.8,815.72]},{"text":"升于梵天，亦未为难。佛灭度后，于恶世中、","para":true,"t":[816.32,822.88]},{"text":"暂读此经，是则为难。假使劫烧，担负干草、","para":true,"t":[823.48,830.76]},{"text":"入中不烧，亦未为难。我灭度后，若持此经、","para":true,"t":[831.36,836.5]},{"text":"为一人说，是则为难。若持八万、四千法藏、","para":true,"t":[837.08,842.53]},{"text":"十二部经、为人演说，令诸听者，得六神通，","para":true,"t":[843.12,848.0]},{"text":"虽能如是，亦未为难。于我灭后，听受此经，","para":true,"t":[848.6,854.16]},{"text":"问其义趣，是则为难。若人说法，令千万亿、","para":true,"t":[854.76,860.6]},{"text":"无量无数，恒沙众生、得阿罗汉，具六神通，","para":true,"t":[861.19,868.26]},{"text":"虽有是益，亦未为难。于我灭后，若能奉持，","para":true,"t":[868.84,876.04]},{"text":"如斯经典，是则为难。我为佛道，于无量土，","para":true,"t":[876.64,883.32]},{"text":"从始至今、广说诸经，而于其中，此经第一。","para":true,"t":[883.92,889.84]},{"text":"若有能持，则持佛身。诸善男子，于我灭后，","para":true,"t":[890.43,896.28]},{"text":"谁能受持、读诵此经，今于佛前、自说誓言。","para":true,"t":[896.88,902.48]},{"text":"此经难持，若暂持者，我则欢喜，诸佛亦然，","para":true,"t":[903.08,909.28]},{"text":"如是之人，诸佛所叹。是则勇猛，是则精进，","para":true,"t":[909.88,916.72]},{"text":"是名持戒、行头陀者，则为疾得，无上佛道。","para":true,"t":[917.32,921.48]},{"text":"能于来世，读持此经，是真佛子，住淳善地。","para":true,"t":[922.08,928.16]},{"text":"佛灭度后，能解其义，是诸天人、世间之眼。","para":true,"t":[928.75,935.04]},{"text":"于恐畏世，能须臾说，一切天人、皆应供养。","para":true,"t":[935.64,942.05]}]},{"title":"提婆达多品第十二","stem":"013_提婆达多品第十二","dur":625.01,"src":"audio/013.mp3","pieces":[{"text":"提婆达多品第十二","para":true,"t":[0.0,1.86]},{"text":"尔时佛告诸菩萨、及天人四众：‘吾于过去无量劫中，求法华经，无有懈倦。于多劫中、常作国王，发愿求于无上菩提，心不退转。","para":false,"t":[2.44,18.52]},{"text":"为欲满足六波罗蜜，勤行布施，心无吝惜，象、马、七珍、国、城、妻、子，奴婢、仆从，头、目、髓、脑，身、肉、手、足，不惜躯命。","para":false,"t":[18.77,36.33]},{"text":"时世人民、寿命无量，为于法故，捐舍国位，委政太子，击鼓宣令、四方求法：“谁能为我说大乘者，吾当终身供给走使。”","para":false,"t":[36.58,50.14]},{"text":"时有仙人、来白王言：“我有大乘，名妙法莲华经，若不违我，当为宣说。”王闻仙言，欢喜踊跃，即随仙人、供给所需，采果、汲水，拾薪、设食，乃至以身而为床座，身心无倦。","para":false,"t":[50.39,72.05]},{"text":"于时奉事、经于千岁，为于法故，精勤给侍，令无所乏。’","para":true,"t":[72.28,79.92]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[80.52,85.12]},{"text":"我念过去劫，为求大法故，虽作世国王，不贪五欲乐。","para":true,"t":[85.72,93.44]},{"text":"捶钟告四方，谁有大法者，若为我解说，身当为奴仆。","para":true,"t":[94.04,103.36]},{"text":"时有阿私仙，来白于大王，我有微妙法，世间所稀有，","para":true,"t":[103.96,111.29]},{"text":"若能修行者，吾当为汝说。时王闻仙言，心生大喜悦，","para":true,"t":[111.88,119.17]},{"text":"即便随仙人，供给于所需。采薪及果蓏，随时恭敬与，","para":true,"t":[119.76,126.8]},{"text":"情存妙法故，身心无懈倦。普为诸众生，勤求于大法，","para":true,"t":[127.4,134.36]},{"text":"亦不为己身、及以五欲乐。故为大国王，勤求获此法，","para":true,"t":[134.96,142.36]},{"text":"遂致得成佛，今故为汝说。","para":true,"t":[142.96,147.48]},{"text":"佛告诸比丘：‘尔时王者，则我身是。时仙人者，今提婆达多是。","para":false,"t":[148.08,157.56]},{"text":"由提婆达多善知识故，令我具足六波罗蜜，慈悲喜舍，三十二相，八十种好，紫磨金色，十力、四无所畏、四摄法、十八不共、神通道力，成等正觉，广度众生，","para":false,"t":[157.81,175.05]},{"text":"皆因提婆达多善知识故。’","para":true,"t":[175.3,178.29]},{"text":"告诸四众：‘提婆达多却后过无量劫，当得成佛，号曰天王如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。世界名天道。","para":false,"t":[178.88,197.7]},{"text":"时天王佛、住世二十中劫，广为众生说于妙法，恒河沙众生得阿罗汉果，无量众生发缘觉心，恒河沙众生发无上道心，得无生忍，至不退转。’","para":true,"t":[197.96,215.15]},{"text":"‘时天王佛般涅槃后，正法住世二十中劫。","para":false,"t":[215.75,220.0]},{"text":"全身舍利、起七宝塔，高六十由旬，纵广四十由旬，诸天人民，悉以杂华、末香、烧香、涂香，衣服、璎珞、幢幡、宝盖，伎乐、歌颂，礼拜、供养七宝妙塔。","para":false,"t":[220.24,238.84]},{"text":"无量众生、得阿罗汉果，无量众生、悟辟支佛，不可思议众生、发菩提心，至不退转。’","para":true,"t":[239.09,247.13]},{"text":"佛告诸比丘：‘未来世中，若有善男子、善女人，闻妙法华经提婆达多品，净心信敬，不生疑惑者，不堕地狱、饿鬼、畜生，生十方佛前，所生之处，常闻此经。","para":false,"t":[247.73,268.49]},{"text":"若生人天中，受胜妙乐，若在佛前，莲华化生。’","para":true,"t":[268.74,274.46]},{"text":"于时下方多宝世尊、所从菩萨，名曰智积，白多宝佛：‘当还本土。’释迦牟尼佛告智积曰：‘善男子，且待须臾，此有菩萨、名文殊师利，可与相见，论说妙法，可还本土。’","para":true,"t":[275.06,293.46]},{"text":"尔时文殊师利、坐千叶莲华，大如车轮，俱来菩萨亦坐宝莲华，从于大海娑竭罗龙宫、自然涌出，住虚空中，诣灵鹫山，从莲华下，至于佛所，头面敬礼二世尊足。","para":false,"t":[294.06,314.94]},{"text":"修敬已毕，往智积所，共相慰问，却坐一面。","para":true,"t":[315.19,322.21]},{"text":"智积菩萨问文殊师利：‘仁往龙宫，所化众生，其数几何？’文殊师利言：‘其数无量，不可称计，非口所宣，非心所测，且待须臾，自当证知。’","para":false,"t":[322.79,342.55]},{"text":"所言未竟，无数菩萨、坐宝莲华，从海涌出，诣灵鹫山，住虚空中。此诸菩萨，皆是文殊师利之所化度，具菩萨行，皆共论说六波罗蜜。","para":false,"t":[342.8,360.24]},{"text":"本声闻人、在虚空中说声闻行，今皆修行大乘空义。文殊师利谓智积曰：‘于海教化，其事如是。’尔时智积菩萨，以偈赞曰：","para":true,"t":[360.49,376.97]},{"text":"大智德勇健，化度无量众，今此诸大会、及我皆已见。","para":true,"t":[377.57,384.17]},{"text":"演畅实相义，开阐一乘法，广导诸众生，令速成菩提，","para":true,"t":[384.77,391.71]},{"text":"文殊师利言：‘我于海中，惟常宣说妙法华经。’智积问文殊师利言：‘此经甚深微妙，诸经中宝，世所稀有，颇有众生、勤加精进，修行此经，速得佛否？’","para":false,"t":[392.29,412.65]},{"text":"文殊师利言：‘有裟竭罗龙王女，年始八岁，智慧利根，善知众生诸根行业，得陀罗尼，诸佛所说甚深秘藏，悉能受持。","para":false,"t":[412.9,427.98]},{"text":"深入禅定，了达诸法，于刹那顷、发菩提心，得不退转，辩才无碍。慈念众生、犹如赤子，功德具足，心念口演，微妙广大，慈悲仁让，志意和雅，能至菩提。’","para":true,"t":[428.23,446.83]},{"text":"智积菩萨言：‘我见释迦如来，于无量劫、难行苦行，积功累德，求菩提道，未曾止息。观三千大千世界，乃至无有如芥子许、非是菩萨舍身命处，为众生故，然后乃得成菩提道。","para":false,"t":[447.43,470.72]},{"text":"不信此女于须臾顷、便成正觉。’言论未讫，时龙王女、忽现于前，头面礼敬，却住一面，以偈赞曰：","para":true,"t":[470.96,483.08]},{"text":"深达罪福相，遍照于十方，微妙净法身，具相三十二，","para":true,"t":[483.68,490.77]},{"text":"以八十种好、用庄严法身。天人所戴仰，龙神咸恭敬，","para":true,"t":[491.36,499.25]},{"text":"一切众生类，无不宗奉者。又闻成菩提，唯佛当证知，","para":true,"t":[499.84,508.4]},{"text":"我阐大乘教，度脱苦众生。","para":true,"t":[509.0,512.12]},{"text":"时舍利弗语龙女言：‘汝谓不久得无上道，是事难信。所以者何。女身垢秽，非是法器，云何能得无上菩提。佛道悬旷，经无量劫、勤苦积行，具修诸度，然后乃成。","para":false,"t":[512.72,535.54]},{"text":"又女人身、犹有五障，一者、不得作梵天王，二者、帝释，三者、魔王，四者、转轮圣王，五者、佛身，云何女身速得成佛？’","para":true,"t":[535.77,549.81]},{"text":"尔时龙女有一宝珠，价值三千大千世界，持以上佛。佛即受之。龙女谓智积菩萨、尊者舍利弗言：‘我献宝珠，世尊纳受，是事疾否？’答言：‘甚疾。’","para":false,"t":[550.41,567.61]},{"text":"女言：‘以汝神力、观我成佛，复速于此。’","para":false,"t":[567.86,572.78]},{"text":"当时众会，皆见龙女、忽然之间、变成男子，具菩萨行，即往南方无垢世界，坐宝莲华，成等正觉，三十二相、八十种好，普为十方一切众生、演说妙法。","para":false,"t":[573.03,589.02]},{"text":"尔时娑婆世界、菩萨、声闻、天龙八部、人与非人，皆遥见彼龙女成佛，普为时会人天说法，心大欢喜，悉遥敬礼。","para":false,"t":[589.24,602.84]},{"text":"无量众生、闻法解悟，得不退转，无量众生、得受道记，无垢世界、六反震动，娑婆世界、三千众生住不退地、三千众生发菩提心、而得受记。","para":false,"t":[603.09,619.33]},{"text":"智积菩萨、及舍利弗，一切众会，默然信受。","para":true,"t":[619.58,624.34]}]},{"title":"劝持品第十三","stem":"014_劝持品第十三","dur":430.39,"src":"audio/014.mp3","pieces":[{"text":"劝持品第十三","para":true,"t":[0.0,2.08]},{"text":"尔时药王菩萨摩诃萨、及大乐说菩萨摩诃萨、与二万菩萨眷属俱，皆于佛前、作是誓言：‘惟愿世尊不以为虑，我等于佛灭后，当奉持、读诵、说此经典。","para":false,"t":[2.68,18.4]},{"text":"后恶世众生，善根转少，多增上慢，贪利供养，增不善根，远离解脱。虽难可教化，我等当起大忍力，读诵此经，持说、书写、种种供养、不惜身命。’","para":true,"t":[18.64,37.48]},{"text":"尔时众中五百阿罗汉得受记者、白佛言：‘世尊，我等亦自誓愿，于异国土、广说此经。’","para":false,"t":[38.08,49.04]},{"text":"复有学无学八千人、得受记者，从座而起，合掌向佛、作是誓言：‘世尊，我等亦当于他国土、广说此经。所以者何。","para":false,"t":[49.29,62.76]},{"text":"是娑婆国中、人多敝恶，怀增上慢，功德浅薄、嗔浊、谄曲，心不实故。’","para":true,"t":[63.02,71.47]},{"text":"尔时佛姨母摩诃波阇波提比丘尼、与学无学比丘尼六千人俱，从座而起，一心合掌，瞻仰尊颜，目不暂舍。","para":false,"t":[72.06,84.74]},{"text":"于时世尊告憍昙弥：‘何故忧色而视如来，汝心、将无谓我不说汝名，授阿耨多罗三藐三菩提记耶？’","para":true,"t":[84.99,98.87]},{"text":"‘憍昙弥，我先总说、一切声闻皆已授记，今汝欲知记者，将来之世，当于六万八千亿诸佛法中、为大法师。及六千学无学比丘尼、俱为法师。","para":false,"t":[99.47,116.6]},{"text":"汝如是渐渐具菩萨道，当得作佛，号一切众生喜见如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。","para":false,"t":[116.84,135.24]},{"text":"憍昙弥，是一切众生喜见佛、及六千菩萨，转次授记、得阿耨多罗三藐三菩提。’","para":true,"t":[135.49,144.85]},{"text":"尔时罗侯罗母耶输陀罗比丘尼作是念：‘世尊于授记中，独不说我名。’佛告耶输陀罗：‘汝于来世百千万亿诸佛法中、修菩萨行，为大法师，渐具佛道。","para":false,"t":[145.45,163.75]},{"text":"于善国中、当得作佛，号具足千万光相如来、应供、正遍知、明行足、善逝世间解、无上士、调御丈夫、天人师、佛、世尊。佛寿无量阿僧祇劫。’","para":true,"t":[163.98,180.82]},{"text":"尔时摩诃波阇波提比丘尼、及耶输陀罗比丘尼、并其眷属，皆大欢喜，得未曾有，即于佛前而说偈言：","para":true,"t":[181.42,193.46]},{"text":"世尊导师，安隐天人，我等闻记，心安具足。","para":true,"t":[194.06,199.44]},{"text":"诸比丘尼说是偈已，白佛言：‘世尊，我等亦能于他方国土、广宣此经。’尔时世尊视八十万亿那由他诸菩萨摩诃萨。是诸菩萨，皆是阿惟越致，转不退法轮，得诸陀罗尼。","para":false,"t":[200.02,220.5]},{"text":"即从座起，至于佛前，一心合掌，而作是念：‘若世尊告敕我等、持说此经者，当如佛教，广宣斯法。’复作是念：‘佛今默然、不见告敕，我当云何？’","para":true,"t":[220.77,239.2]},{"text":"时诸菩萨敬顺佛意，并欲自满本愿，便于佛前、作师子吼，而发誓言：‘世尊，我等于如来灭后，周旋往返十方世界，能令众生书写此经，受持、读诵，解说其义，如法修行，","para":false,"t":[239.79,260.71]},{"text":"正忆念，皆是佛之威力，惟愿世尊，在于他方、遥见守护。’即时诸菩萨俱同发声、而说偈言：","para":true,"t":[260.97,272.04]},{"text":"惟愿不为虑，于佛灭度后，恐怖恶世中，我等当广说。","para":true,"t":[272.64,279.88]},{"text":"有诸无智人，恶口骂詈等，及加刀杖者，我等皆当忍。","para":true,"t":[280.48,286.73]},{"text":"恶世中比丘，邪智心谄曲，未得谓为得，我慢心充满。","para":true,"t":[287.32,295.7]},{"text":"或有阿练若，纳衣在空闲，自谓行真道，轻贱人间者。","para":true,"t":[296.28,303.0]},{"text":"贪著利养故，与白衣说法，为世所恭敬、如六通罗汉。","para":true,"t":[303.61,309.69]},{"text":"是人怀恶心，常念世俗事，假名阿练若，好出我等过，","para":true,"t":[310.32,318.36]},{"text":"而作如是言，此诸比丘等，为贪利养故、说外道论议，","para":true,"t":[318.96,326.17]},{"text":"自作此经典，诳惑世间人，为求名闻故。分别于是经，","para":true,"t":[326.76,334.25]},{"text":"常在大众中、欲毁我等故，向国王大臣、婆罗门居士、","para":true,"t":[334.84,341.16]},{"text":"及余比丘众，诽谤说我恶，谓是邪见人、说外道论议。","para":true,"t":[341.72,347.92]},{"text":"我等敬佛故，悉忍是诸恶。为斯所轻言、汝等皆是佛，","para":true,"t":[348.52,356.2]},{"text":"如此轻慢言，皆当忍受之。浊劫恶世中，多有诸恐怖，","para":true,"t":[356.8,364.24]},{"text":"恶鬼入其身，骂詈毁辱我。我等敬信佛，当著忍辱铠，","para":true,"t":[364.84,371.08]},{"text":"为说是经故，忍此诸难事。我不爱身命，但惜无上道，","para":true,"t":[371.68,380.71]},{"text":"我等于来世，护持佛所嘱，世尊自当知。浊世恶比丘，","para":true,"t":[381.28,391.0]},{"text":"不知佛方便、随宜所说法，恶口而颦蹙，数数见摈出，","para":true,"t":[391.6,397.64]},{"text":"远离于塔寺。如是等众恶，念佛告敕故，皆当忍是事。","para":true,"t":[398.24,405.64]},{"text":"诸聚落城邑，其有求法者，我皆到其所，说佛所嘱法。","para":true,"t":[406.24,413.85]},{"text":"我是世尊使，处众无所畏，我当善说法，愿佛安隐住。","para":true,"t":[414.44,421.4]},{"text":"我于世尊前、诸来十方佛，发如是誓言，佛自知我心。","para":true,"t":[422.0,429.72]}]},{"title":"安乐行品第十四","stem":"015_安乐行品第十四","dur":1192.49,"src":"audio/015.mp3","pieces":[{"text":"安乐行品第十四","para":true,"t":[0.0,2.19]},{"text":"尔时文殊师利法王子菩萨摩诃萨、白佛言：‘世尊，是诸菩萨，甚为稀有，敬顺佛故，发大誓愿，于后恶世、护持读说是法华经。世尊，菩萨摩诃萨、于后恶世、云何能说是经。’","para":false,"t":[2.76,23.32]},{"text":"佛告文殊师利：‘若菩萨摩诃萨，于后恶世、欲说是经，当安住四法。一者、安住菩萨行处及亲近处，能为众生演说是经。’","para":true,"t":[23.57,39.75]},{"text":"‘文殊师利，云何名菩萨摩诃萨行处，若菩萨摩诃萨住忍辱地，柔和善顺、而不卒暴，心亦不惊，又复于法、无所行，而观诸法如实相，亦不行、不分别，是名菩萨摩诃萨行处。’","para":true,"t":[40.33,58.97]},{"text":"‘云何名菩萨摩诃萨亲近处。","para":false,"t":[59.57,62.49]},{"text":"菩萨摩诃萨不亲近国王、王子、大臣、官长，不亲近诸外道梵志、尼犍子等，及造世俗文笔、赞咏外书，及路伽耶陀、逆路伽耶陀者，亦不亲近诸有凶戏、相叉相扑、","para":false,"t":[62.74,77.96]},{"text":"及那罗等种种变现之戏，又不亲近旃陀罗、及畜猪羊鸡狗、畋猎渔捕、诸恶律仪。如是人等、或时来者，则为说法，无所希望。","para":false,"t":[78.19,91.03]},{"text":"又不亲近求声闻比丘、比丘尼、优婆塞、优婆夷，亦不问讯。若于房中，若经行处，若在讲堂中，不共住止。或时来者，随宜说法，无所希求。’","para":true,"t":[91.28,108.24]},{"text":"‘文殊师利，又菩萨摩诃萨不应于女人身、取能生欲想相，而为说法，亦不乐见。若入他家，不与小女、处女、寡女等共语。","para":false,"t":[108.84,122.34]},{"text":"亦复不近五种不男之人、以为亲厚，不独入他家，若有因缘、须独入时，但一心念佛。若为女人说法，不露齿笑，不现胸臆，乃至为法、犹不亲厚，况复余事。","para":false,"t":[122.57,141.13]},{"text":"不乐畜年少弟子、沙弥、小儿，亦不乐与同师。常好坐禅，在于闲处、修摄其心。文殊师利，是名初亲近处。’","para":true,"t":[141.38,155.9]},{"text":"‘复次、菩萨摩诃萨观一切法空，如实相，不颠倒，不动，不退，不转，如虚空，无所有性。","para":false,"t":[156.52,168.42]},{"text":"一切语言道断，不生、不出、不起，无名、无相，实无所有，无量、无边，无碍、无障，但以因缘有，从颠倒生，故说。常乐观如是法相，是名菩萨摩诃萨第二亲近处。’","para":true,"t":[168.67,191.39]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[191.99,196.13]},{"text":"若有菩萨，于后恶世，无怖畏心，欲说是经，","para":true,"t":[196.75,202.72]},{"text":"应入行处、及亲近处。常离国王、及国王子、","para":true,"t":[203.31,208.75]},{"text":"大臣官长，凶险戏者，及旃陀罗、外道梵志。","para":true,"t":[209.35,214.71]},{"text":"亦不亲近，增上慢人，贪著小乘、三藏学者，","para":true,"t":[215.3,220.63]},{"text":"破戒比丘，名字罗汉。及比丘尼，好戏笑者，","para":true,"t":[221.23,228.12]},{"text":"深著五欲，求现灭度，诸优婆夷，皆勿亲近。","para":true,"t":[228.71,236.11]},{"text":"若是人等、以好心来，到菩萨所、为闻佛道、","para":true,"t":[236.7,241.24]},{"text":"菩萨则以，无所畏心，不怀希望、而为说法。","para":true,"t":[241.82,247.39]},{"text":"寡女处女、及诸不男，皆勿亲近、以为亲厚。","para":true,"t":[247.99,254.27]},{"text":"亦莫亲近，屠儿魁脍，畋猎渔捕，为利杀害，","para":true,"t":[254.87,260.44]},{"text":"贩肉自活，炫卖女色，如是之人，皆勿亲近。","para":true,"t":[261.03,267.23]},{"text":"凶险相扑，种种嬉戏，诸淫女等，尽勿亲近。","para":true,"t":[267.83,273.59]},{"text":"莫独屏处、为女说法，若说法时，无得戏笑。","para":true,"t":[274.19,281.43]},{"text":"入里乞食，将一比丘，若无比丘，一心念佛。","para":true,"t":[282.03,287.81]},{"text":"是则名为，行处近处，以此二处，能安乐说。","para":true,"t":[288.38,293.4]},{"text":"又复不行，上中下法，有为无为，实不实法，","para":true,"t":[293.99,299.43]},{"text":"亦不分别，是男是女，不得诸法，不知不见，","para":true,"t":[300.03,305.74]},{"text":"是则名为，菩萨行处。一切诸法，空无所有，","para":true,"t":[306.31,312.79]},{"text":"无有常住，亦无起灭，是名智者，所亲近处。","para":true,"t":[313.39,319.55]},{"text":"颠倒分别，诸法有无，是实非实，是生非生。","para":true,"t":[320.15,326.91]},{"text":"在于闲处、修摄其心，安住不动，如须弥山。","para":true,"t":[327.51,333.55]},{"text":"观一切法、皆无所有、犹如虚空，无有坚固、","para":true,"t":[334.15,339.19]},{"text":"不生不出，不动不退，常住一相，是名近处。","para":true,"t":[339.79,345.99]},{"text":"若有比丘，于我灭后，入是行处、及亲近处，","para":true,"t":[346.59,352.6]},{"text":"说斯经时，无有怯弱。菩萨有时、入于静室，","para":true,"t":[353.19,360.67]},{"text":"以正忆念、随义观法。从禅定起。为诸国王、","para":true,"t":[361.27,365.99]},{"text":"王子臣民、婆罗门等，开化演畅，说斯经典，","para":true,"t":[366.59,371.83]},{"text":"其心安隐，无有怯弱。文殊师利，是名菩萨，","para":true,"t":[372.43,379.67]},{"text":"安住初法，能于后世、说法华经。","para":true,"t":[380.27,384.2]},{"text":"‘又、文殊师利，如来灭后，于末法中、欲说是经，应住安乐行。若口宣说、若读经时，不乐说人、及经典过。亦不轻慢诸余法师，不说他人好恶、长短。","para":false,"t":[384.79,403.03]},{"text":"于声闻人，亦不称名说其过恶，亦不称名赞叹其美，又亦不生怨嫌之心。善修如是安乐心故，诸有听者、不逆其意，有所难问，不以小乘法答，但以大乘而为解说，令得一切种智。’","para":true,"t":[403.28,422.56]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[423.16,427.05]},{"text":"菩萨常乐 安隐说法，于清净地、而施床座，","para":true,"t":[427.64,432.52]},{"text":"以油涂身，澡浴尘秽，著新净衣，内外俱净。","para":true,"t":[433.12,440.0]},{"text":"安处法座，随问为说。若有比丘、及比丘尼，","para":true,"t":[440.6,446.01]},{"text":"诸优婆塞、及优婆夷，国王王子、群臣士民，","para":true,"t":[446.6,451.78]},{"text":"以微妙义，和颜为说。若有难问，随义而答。","para":true,"t":[452.36,457.72]},{"text":"因缘譬喻，敷演分别、以是方便，皆使发心，","para":true,"t":[458.32,463.88]},{"text":"渐渐增益、入于佛道。除懒惰意、及懈怠想，","para":true,"t":[464.48,470.44]},{"text":"离诸忧恼，慈心说法。昼夜常说，无上道教，","para":true,"t":[471.04,478.16]},{"text":"以诸因缘、无量譬喻、开示众生，咸令欢喜。","para":true,"t":[478.76,485.53]},{"text":"衣服卧具，饮食医药，而于其中，无所希望。","para":true,"t":[486.12,491.52]},{"text":"但一心念，说法因缘、愿成佛道，令众亦尔，","para":true,"t":[492.14,496.93]},{"text":"是则大利、安乐供养。我灭度后，若有比丘、","para":true,"t":[497.52,502.37]},{"text":"能演说斯 妙法华经，心无嫉恚、诸恼障碍，","para":true,"t":[502.96,508.2]},{"text":"亦无忧愁、及骂詈者，又无怖畏 加刀杖等，","para":true,"t":[508.8,513.46]},{"text":"亦无摈出，安住忍故。智者如是，善修其心，","para":true,"t":[514.03,520.4]},{"text":"能住安乐，如我上说。其人功德，千万亿劫、","para":true,"t":[521.0,525.87]},{"text":"算数譬喻、说不能尽。","para":true,"t":[526.44,528.96]},{"text":"‘又、文殊师利菩萨摩诃萨，于后末世、法欲灭时，受持、读诵、斯经典者，无怀嫉妒谄诳之心，亦勿轻骂学佛道者、求其长短。","para":false,"t":[529.56,545.43]},{"text":"若比丘、比丘尼、优婆塞、优婆夷，求声闻者，求辟支佛者，求菩萨道者，无得恼之，令其疑悔。语其人言：“汝等去道甚远，终不能得一切种智，所以者何？","para":false,"t":[545.69,566.37]},{"text":"汝是放逸之人，于道懈怠故。”又亦不应戏论诸法，有所诤竞。当于一切众生、起大悲想，于诸如来、起慈父想，于诸菩萨、起大师想，于十方诸大菩萨，常应深心、恭敬礼拜。","para":false,"t":[566.62,589.3]},{"text":"于一切众生，平等说法，以顺法故，不多不少，乃至深爱法者、亦不为多说。’","para":true,"t":[589.55,598.62]},{"text":"‘文殊师利，是菩萨摩诃萨，于后末世、法欲灭时，有成就是第三安乐行者，说是法时，无能恼乱，得好同学、共读诵是经，亦得大众而来听受，听已、能持，持已、能诵，诵已、","para":false,"t":[599.23,620.19]},{"text":"能说，说已、能书，若使人书，供养经卷，恭敬、尊重、赞叹。’","para":true,"t":[620.43,629.51]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[630.11,634.49]},{"text":"若欲说是经，当舍嫉恚慢、谄诳邪伪心，常修质直行，","para":true,"t":[635.07,642.87]},{"text":"不轻蔑于人，亦不戏论法，不令他疑悔，云汝不得佛。","para":true,"t":[643.47,650.71]},{"text":"是佛子说法，常柔和能忍，慈悲于一切，不生懈怠心。","para":true,"t":[651.31,658.01]},{"text":"十方大菩萨，愍众故行道，应生恭敬心，是则我大师。","para":true,"t":[658.62,666.49]},{"text":"于诸佛世尊，生无上父想，破于憍慢心，说法无障碍，","para":true,"t":[667.07,674.07]},{"text":"第三法如是，智者应守护，一心安乐行，无量众所敬。","para":true,"t":[674.67,680.75]},{"text":"‘又、文殊师利，菩萨摩诃萨，于后末世、法欲灭时，有持是法华经者，于在家出家人中、生大慈心，于非菩萨人中、生大悲心，应作是念：“如是之人，则为大失。","para":false,"t":[681.35,701.51]},{"text":"如来方便随宜说法，不闻不知不觉、不问不信不解，其人虽不问不信不解是经，我得阿耨多罗三藐三菩提时，随在何地，以神通力、智慧力、引之，令得住是法中。”","para":false,"t":[701.76,719.26]},{"text":"文殊师利，是菩萨摩诃萨，于如来灭后、有成就此第四法者，说是法时，无有过失，常为比丘、比丘尼、优婆塞、优婆夷、国王、王子、大臣、人民、婆罗门、居士、等，供养、","para":false,"t":[719.53,739.65]},{"text":"恭敬、尊重、赞叹。虚空诸天、为听法故，亦常随侍，若在聚落、城邑、空闲林中，有人来、欲难问者，诸天昼夜、常为法故而卫护之，能令听者皆得欢喜。所以者何。","para":false,"t":[739.9,764.58]},{"text":"此经是一切过去未来现在诸佛、神力所护故。文殊师利，是法华经，于无量国中、乃至名字不可得闻，何况得见、受持读诵？’","para":true,"t":[764.83,782.88]},{"text":"‘文殊师利，譬如强力转轮圣王，欲以威势降伏诸国，而诸小王不顺其命，时转轮王、起种种兵而往讨罚。","para":false,"t":[783.47,795.87]},{"text":"王见兵众、战有功者，即大欢喜，随功赏赐，或与田宅、聚落、城邑，或与衣服、严身之具，或与种种珍宝，金银、琉璃，砗磲、玛瑙，珊瑚、琥珀，象、马、车乘，奴婢、人民，","para":false,"t":[796.12,818.76]},{"text":"惟髻中明珠、不以与之。所以者何。独王顶上有此一珠，若以与之，王诸眷属、必大惊怪。’","para":true,"t":[819.01,830.1]},{"text":"‘文殊师利，如来亦复如是，以禅定智慧力、得法国土，王于三界，而诸魔王不肯顺伏。","para":false,"t":[830.69,840.45]},{"text":"如来贤圣诸将、与之共战，其有功者，心亦欢喜，于四众中、为说诸经，令其心悦，赐以禅定、解脱、无漏根力、诸法之财，又复赐与涅槃之城，言得灭度，引导其心，令皆欢喜，","para":false,"t":[840.7,863.78]},{"text":"而不为说是法华经。’","para":true,"t":[864.03,866.26]},{"text":"‘文殊师利，如转轮王、见诸兵众有大功者，心甚欢喜，以此难信之珠、久在髻中，不妄与人，而今与之。","para":false,"t":[866.83,879.48]},{"text":"如来亦复如是，于三界中、为大法王，以法教化一切众生、见贤圣军，与五阴魔、烦恼魔、死魔、共战，有大功勋，灭三毒，出三界，破魔网，尔时如来亦大欢喜，此法华经，","para":false,"t":[879.72,899.76]},{"text":"能令众生至一切智，一切世间、多怨难信，先所未说，而今说之。’","para":true,"t":[900.01,908.25]},{"text":"‘文殊师利，此法华经，是诸如来第一之说，于诸说中、最为甚深，末后赐与，如彼强力之王、久护明珠，今乃与之。","para":false,"t":[908.85,924.21]},{"text":"文殊师利，此法华经，诸佛如来秘密之藏，于诸经中、最在其上，长夜守护，不妄宣说，始于今日、乃与汝等而敷演之。’","para":true,"t":[924.46,938.59]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[939.18,943.22]},{"text":"常行忍辱，哀愍一切，乃能演说，佛所赞经。","para":true,"t":[943.82,950.18]},{"text":"后末世时、持此经者，于家出家、及非菩萨，","para":true,"t":[950.78,955.83]},{"text":"应生慈悲，斯等不闻，不信是经，则为大失。","para":true,"t":[956.41,962.3]},{"text":"我得佛道，以诸方便、为说此法，令住其中。","para":true,"t":[962.9,967.86]},{"text":"譬如强力 转轮之王，兵战有功，赏赐诸物，","para":true,"t":[968.45,973.18]},{"text":"象马车乘，严身之具，及诸田宅，聚落城邑，","para":true,"t":[973.78,981.22]},{"text":"或与衣服、种种珍宝，奴婢财物，欢喜赐与。","para":true,"t":[981.82,986.39]},{"text":"如有勇健、能为难事，王解髻中，明珠赐之。","para":true,"t":[986.99,992.48]},{"text":"如来亦尔，为诸法王，忍辱大力，智慧宝藏，","para":true,"t":[993.1,999.19]},{"text":"以大慈悲、如法化世。见一切人、受诸苦恼，","para":true,"t":[999.78,1005.87]},{"text":"欲求解脱，与诸魔战。为是众生，说种种法，","para":true,"t":[1006.45,1013.52]},{"text":"以大方便、说此诸经。既知众生，得其力已，","para":true,"t":[1014.1,1019.06]},{"text":"末后乃为，说是法华，如王解髻，明珠与之。","para":true,"t":[1019.66,1025.1]},{"text":"此经为尊，众经中上，我常守护，不妄开示，","para":true,"t":[1025.7,1032.55]},{"text":"今正是时，为汝等说，我灭度后，求佛道者、","para":true,"t":[1033.14,1039.02]},{"text":"欲得安隐，演说斯经，应当亲近，如是四法。","para":true,"t":[1039.62,1046.82]},{"text":"读是经者，常无忧恼，又无病痛，颜色鲜白，","para":true,"t":[1047.42,1052.67]},{"text":"不生贫穷、卑贱丑陋。众生乐见，如慕贤圣，","para":true,"t":[1053.26,1058.9]},{"text":"天诸童子、以为给使。刀杖不加，毒不能害，","para":true,"t":[1059.5,1065.01]},{"text":"若人恶骂，口则闭塞。游行无畏，如师子王，","para":true,"t":[1065.62,1071.26]},{"text":"智慧光明，如日之照。若于梦中，但见妙事。","para":true,"t":[1071.86,1078.42]},{"text":"见诸如来，坐师子座，诸比丘众、围绕说法。","para":true,"t":[1079.02,1084.22]},{"text":"又见龙神、阿修罗等，数如恒沙，恭敬合掌、","para":true,"t":[1084.82,1090.26]},{"text":"自见其身，而为说法。又见诸佛、身相金色，","para":true,"t":[1090.86,1096.59]},{"text":"放无量光、照于一切，以梵音声、演说诸法。","para":true,"t":[1097.18,1103.22]},{"text":"佛为四众，说无上法，见身处中，合掌赞佛，","para":true,"t":[1103.82,1110.49]},{"text":"闻法欢喜、而为供养，得陀罗尼，证不退智。","para":true,"t":[1111.1,1116.03]},{"text":"佛知其心，深入佛道，即为授记、成最正觉。","para":true,"t":[1116.62,1122.62]},{"text":"汝善男子，当于来世，得无量智、佛之大道，","para":true,"t":[1123.22,1129.82]},{"text":"国土严净，广大无比，亦有四众、合掌听法。","para":true,"t":[1130.42,1135.86]},{"text":"又见自身、在山林中，修习善法，证诸实相，","para":true,"t":[1136.46,1141.9]},{"text":"深入禅定，见十方佛。","para":true,"t":[1142.5,1146.15]},{"text":"诸佛身金色，百福相庄严，闻法为人说，常有是好梦。","para":true,"t":[1146.74,1153.89]},{"text":"又梦作国王，舍宫殿眷属、及上妙五欲，行诣于道场。","para":true,"t":[1154.46,1161.82]},{"text":"在菩提树下、而处师子座，求道过七日，得诸佛之智。","para":true,"t":[1162.42,1169.3]},{"text":"成无上道已，起而转法轮，为四众说法、经千万亿劫，","para":true,"t":[1169.9,1177.62]},{"text":"说无漏妙法，度无量众生。后当入涅槃，如烟尽灯灭。","para":true,"t":[1178.22,1184.38]},{"text":"若后恶世中、说是第一法，是人得大利 ，如上诸功德。","para":true,"t":[1184.98,1191.82]}]},{"title":"从地涌出品第十五","stem":"016_从地涌出品第十五","dur":975.22,"src":"audio/016.mp3","pieces":[{"text":"从地涌出品第十五","para":true,"t":[0.0,1.96]},{"text":"尔时他方国土诸来菩萨摩诃萨，过八恒河沙数，于大众中起，合掌作礼、而白佛言：‘世尊，若听我等、于佛灭后，在此娑婆世界，勤加精进，护持、读诵、书写、供养、是经典者，","para":false,"t":[2.56,22.88]},{"text":"当于此土而广说之。’尔时佛告诸菩萨摩诃萨众：‘止，善男子，不需汝等护持此经。所以者何。","para":false,"t":[23.13,38.73]},{"text":"我娑婆世界、自有六万恒河沙等菩萨摩诃萨，一一菩萨、各有六万恒河沙眷属，是诸人等，能于我灭后、护持读诵广说此经。’","para":true,"t":[38.98,51.94]},{"text":"佛说是时，娑婆世界三千大千国土，地皆震裂，而于其中，有无量千万亿菩萨摩诃萨、同时涌出。","para":false,"t":[52.54,65.58]},{"text":"是诸菩萨，身皆金色，三十二相，无量光明，先尽在此娑婆世界之下、此界虚空中住。是诸菩萨、闻释迦牟尼佛所说音声，从下发来。","para":false,"t":[65.83,81.15]},{"text":"一一菩萨、皆是大众唱导之首，各将六万恒河沙眷属，况将五万、四万、三万、二万、一万、恒河沙等眷属者，况复乃至一恒河沙、半恒河沙、四分之一、乃至千万亿那由他分之一，","para":false,"t":[81.4,101.48]},{"text":"况复千万亿那由他眷属，况复亿万眷属，况复千万、百万、乃至一万，况复一千、一百、乃至一十，况复将五、四、三、二、一、弟子者，况复单己、乐远离行，如是等比、","para":false,"t":[101.73,122.61]},{"text":"无量无边，算数譬喻所不能知。","para":true,"t":[122.86,127.03]},{"text":"是诸菩萨从地出已，各诣虚空七宝妙塔多宝如来、释迦牟尼佛、所，到已、向二世尊头面礼足、及至诸宝树下师子座上佛所、亦皆作礼，右绕三匝，合掌恭敬，以诸菩萨种种赞法、","para":false,"t":[127.62,144.66]},{"text":"而以赞叹，住在一面，欣乐瞻仰于二世尊。是诸菩萨摩诃萨，从初涌出，以诸菩萨种种赞法、而赞于佛，如是时间、经五十小劫。","para":false,"t":[144.91,160.19]},{"text":"是时释迦牟尼佛默然而坐，及诸四众、亦皆默然五十小劫，佛神力故，令诸大众谓如半日。尔时四众亦以佛神力故，见诸菩萨、遍满无量百千万亿国土虚空。","para":true,"t":[160.44,179.77]},{"text":"是菩萨众中、有四导师，一、名上行，二、名无边行，三、名净行，四、名安立行，是四菩萨，于其众中、最为上首唱导之师，在大众前，各共合掌，观释迦牟尼佛、而问讯言：","para":false,"t":[180.35,205.52]},{"text":"‘世尊，少病、少恼，安乐行否，所应度者，受教易否，不令世尊生疲劳耶？’","para":true,"t":[205.77,214.61]},{"text":"尔时四大菩萨而说偈言：","para":true,"t":[215.21,217.94]},{"text":"世尊安乐，少病少恼，教化众生，得无疲倦。","para":true,"t":[218.53,224.39]},{"text":"又诸众生、受化易否，不令世尊，生疲劳耶。","para":true,"t":[224.97,232.25]},{"text":"尔时世尊、于菩萨大众中而作是言：‘如是、如是，诸善男子，如来安乐，少病、少恼，诸众生等，易可化度，无有疲劳。所以者何。","para":false,"t":[232.85,250.96]},{"text":"是诸众生，世世已来、常受我化，亦于过去诸佛、恭敬尊重，种诸善根。此诸众生，始见我身，闻我所说，即皆信受、入如来慧。","para":false,"t":[251.21,267.46]},{"text":"除先修习、学小乘者，如是之人，我今亦令得闻是经，入于佛慧。’尔时诸大菩萨而说偈言：","para":true,"t":[267.72,278.91]},{"text":"善哉善哉，大雄世尊，诸众生等，易可化度。","para":true,"t":[279.51,285.63]},{"text":"能问诸佛，甚深智慧，闻已信行，我等随喜。","para":true,"t":[286.23,291.11]},{"text":"于时世尊赞叹上首诸大菩萨：‘善哉、善哉，善男子，汝等能于如来、发随喜心。’","para":false,"t":[291.71,301.44]},{"text":"尔时弥勒菩萨及八千恒河沙诸菩萨众、皆作是念：‘我等从昔已来，不见不闻如是大菩萨摩诃萨众、从地涌出，住世尊前，合掌、供养，问讯如来。’","para":true,"t":[301.68,318.96]},{"text":"时弥勒菩萨摩诃萨、知八千恒河沙诸菩萨等、心之所念，并欲自决所疑，合掌向佛，以偈问曰：","para":true,"t":[319.56,331.69]},{"text":"无量千万亿、大众诸菩萨，昔所未曾见，愿两足尊说，","para":true,"t":[332.28,340.11]},{"text":"是从何所来，以何因缘集。巨身大神通，智慧叵思议、","para":true,"t":[340.71,347.97]},{"text":"其志念坚固，有大忍辱力，众生所乐见，为从何所来。","para":true,"t":[348.56,357.48]},{"text":"一一诸菩萨、所将诸眷属，其数无有量，如恒河沙等。","para":true,"t":[358.08,365.6]},{"text":"或有大菩萨，将六万恒沙，如是诸大众，一心求佛道。","para":true,"t":[366.2,373.16]},{"text":"是诸大师等，六万恒河沙，俱来供养佛、及护持是经。","para":true,"t":[373.76,380.61]},{"text":"将五万恒沙，其数过于是。四万及三万、二万至一万、","para":true,"t":[381.2,387.08]},{"text":"一千一百等，乃至一恒沙、半及三四分、亿万分之一，","para":true,"t":[387.68,393.2]},{"text":"千万那由他，万亿诸弟子，乃至于半亿，其数复过上。","para":true,"t":[393.8,399.84]},{"text":"百万至一万、一千及一百、五十与一十、乃至三二一、","para":true,"t":[400.45,407.32]},{"text":"单己无眷属，乐于独处者，俱来至佛所，其数转过上。","para":true,"t":[407.91,415.04]},{"text":"如是诸大众，若人行筹数，过于恒沙劫，犹不能尽知。","para":true,"t":[415.64,422.4]},{"text":"是诸大威德、精进菩萨众，谁为其说法，教化而成就。","para":true,"t":[423.0,429.8]},{"text":"从谁初发心，称扬何佛法，受持行谁经，修习何佛道。","para":true,"t":[430.42,438.12]},{"text":"如是诸菩萨，神通大智力，四方地震裂，皆从中涌出。","para":true,"t":[438.72,444.6]},{"text":"世尊我昔来，未曾见是事，愿说其所从，国土之名号。","para":true,"t":[445.19,450.96]},{"text":"我常游诸国，未曾见是众，我于此众中、乃不识一人，","para":true,"t":[451.56,457.7]},{"text":"忽然从地出，愿说其因缘。今此之大会，无量百千亿，","para":true,"t":[458.28,465.3]},{"text":"是诸菩萨等，皆欲知此事。是诸菩萨众、本末之因缘，","para":true,"t":[465.87,472.13]},{"text":"无量德世尊，惟愿决众疑。","para":true,"t":[472.72,477.04]},{"text":"尔时释迦牟尼分身诸佛、从无量千万亿他方国土来者，在于八方诸宝树下、师子座上，结跏趺坐。其佛侍者，各各见是菩萨大众，于三千大千世界、四方、从地涌出，住于虚空。","para":false,"t":[477.64,495.2]},{"text":"各白其佛言：‘世尊，此诸无量无边阿僧祇菩萨大众，从何所来？’","para":false,"t":[495.45,503.41]},{"text":"尔时诸佛各告侍者：‘诸善男子，且待须臾，有菩萨摩诃萨、名曰弥勒，释迦牟尼佛之所授记，次后作佛，已问斯事，佛今答之，汝等自当因是得闻。’","para":true,"t":[503.66,520.42]},{"text":"尔时释迦牟尼佛告弥勒菩萨：‘善哉、善哉，阿逸多，乃能问佛如是大事。","para":false,"t":[521.02,529.41]},{"text":"汝等当共一心，被精进铠，发坚固意，如来今欲显发宣示诸佛智慧，诸佛自在神通之力，诸佛师子奋迅之力，诸佛威猛大势之力。’","para":true,"t":[529.62,546.83]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[547.43,551.82]},{"text":"当精进一心，我欲说此事，勿得有疑悔 ，佛智叵思议。","para":true,"t":[552.39,560.4]},{"text":"汝今出信力，住于忍善中，昔所未闻法，今皆当得闻。","para":true,"t":[560.99,567.23]},{"text":"我今安慰汝，勿得怀疑惧，佛无不实语，智慧不可量。","para":true,"t":[567.83,574.59]},{"text":"所得第一法，甚深叵分别，如是今当说，汝等一心听。","para":true,"t":[575.19,582.21]},{"text":"尔时世尊说此偈已，告弥勒菩萨：‘我今于此大众、宣告汝等，阿逸多，是诸大菩萨摩诃萨，无量无数阿僧祇、从地涌出，汝等昔所未见者，我于是娑婆世界、","para":false,"t":[582.79,602.56]},{"text":"得阿耨多罗三藐三菩提已，教化示导是诸菩萨，调伏其心，令发道意。此诸菩萨，皆于是娑婆世界之下、此界虚空中住，于诸经典，读诵通利，思惟分别、正忆念。","para":false,"t":[602.8,623.68]},{"text":"阿逸多，是诸善男子等，不乐在众、多有所说，常乐静处、勤行精进，未曾休息。亦不依止人天而住。常乐深智，无有障碍、亦常乐于诸佛之法，一心精进，求无上慧。’","para":true,"t":[623.93,640.45]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[641.05,644.85]},{"text":"阿逸汝当知，是诸大菩萨，从无数劫来，修习佛智慧，","para":true,"t":[645.45,652.58]},{"text":"悉是我所化，令发大道心。此等是我子，依止是世界，","para":true,"t":[653.17,661.46]},{"text":"常行头陀事，志乐于静处，舍大众愦闹，不乐多所说。","para":true,"t":[662.05,668.29]},{"text":"如是诸子等，学习我道法，昼夜常精进，为求佛道故，","para":true,"t":[668.89,676.17]},{"text":"在娑婆世界、下方空中住，志念力坚固，常勤求智慧，","para":true,"t":[676.77,683.22]},{"text":"说种种妙法，其心无所畏。我于伽耶城、菩提树下坐，","para":true,"t":[683.81,690.49]},{"text":"得成最正觉，转无上法轮。尔乃教化之、令初发道心，","para":true,"t":[691.09,698.49]},{"text":"今皆住不退，悉当得成佛。我今说实语，汝等一心信，","para":true,"t":[699.09,707.76]},{"text":"我从久远来、教化是等众。","para":true,"t":[708.33,711.25]},{"text":"尔时、弥勒菩萨摩诃萨、及无数诸菩萨等，心生疑惑，怪未曾有，而作是念：‘云何世尊于少时间、教化如是无量无边阿僧祇诸大菩萨，令住阿耨多罗三藐三菩提？’","para":false,"t":[711.85,732.17]},{"text":"即白佛言：‘世尊，如来为太子时，出于释宫，去伽耶城不远，坐于道场，得成阿耨多罗三藐三菩提，从是已来，始过四十余年，世尊，云何于此少时、大作佛事，以佛势力，","para":false,"t":[732.42,754.9]},{"text":"以佛功德，教化如是无量大菩萨众、当成阿耨多罗三藐三菩提？’","para":true,"t":[755.15,762.2]},{"text":"‘世尊，此大菩萨众，假使有人，于千万亿劫、数不能尽，不得其边，斯等久远已来，于无量无边诸佛所、植诸善根，成就菩萨道，常修梵行。世尊，如此之事，世所难信。","para":false,"t":[762.79,784.35]},{"text":"譬如有人、色美发黑，年二十五，指百岁人、言是我子，其百岁人，亦指年少，言是我父，生育我等，是事难信。’","para":true,"t":[784.6,797.4]},{"text":"‘佛亦如是，得道已来，其实未久，而此大众诸菩萨等，已于无量千万亿劫，为佛道故，勤行精进，善入出住无量百千万亿三昧，得大神通，久修梵行，善能次第习诸善法，","para":false,"t":[798.0,817.36]},{"text":"巧于问答，人中之宝，一切世间甚为稀有。今日世尊方云，得佛道时，初令发心，教化示导，令向阿耨多罗三藐三菩提，世尊得佛未久，乃能作此大功德事。","para":false,"t":[817.61,835.25]},{"text":"我等虽复信佛随宜所说，佛所出言、未曾虚妄，佛所知者，皆悉通达，然诸新发意菩萨，于佛灭后，若闻是语，或不信受、而起破法罪业因缘。","para":false,"t":[835.5,852.73]},{"text":"惟、然，世尊，愿为解说，除我等疑，及未来世诸善男子、闻此事已，亦不生疑。’","para":true,"t":[852.98,862.35]},{"text":"尔时弥勒菩萨欲重宣此义，而说偈言：","para":true,"t":[862.95,867.43]},{"text":"佛昔从释种、出家近伽耶，坐于菩提树，尔来尚未久。","para":true,"t":[868.03,875.83]},{"text":"此诸佛子等，其数不可量，久已行佛道，住于神通力，","para":true,"t":[876.43,882.63]},{"text":"善学菩萨道，不染世间法，如莲华在水，从地而涌出，","para":true,"t":[883.23,891.27]},{"text":"皆起恭敬心，住于世尊前。是事难思议，云何而可信，","para":true,"t":[891.87,899.4]},{"text":"佛得道甚近、所成就甚多，愿为除众疑，如实分别说。","para":true,"t":[899.99,906.51]},{"text":"譬如少壮人，年始二十五，示人百岁子，发白而面皱，","para":true,"t":[907.11,913.63]},{"text":"是等我所生，子亦说是父，父少而子老，举世所不信。","para":true,"t":[914.22,921.67]},{"text":"世尊亦如是，得道来甚近。是诸菩萨等，志固无怯弱，","para":true,"t":[922.27,928.45]},{"text":"从无量劫来、而行菩萨道，巧于难问答，其心无所畏，","para":true,"t":[929.03,936.31]},{"text":"忍辱心决定，端正有威德，十方佛所赞，善能分别说，","para":true,"t":[936.91,944.63]},{"text":"不乐在人众，常好在禅定，为求佛道故，于下空中住。","para":true,"t":[945.23,952.15]},{"text":"我等从佛闻、于此事无疑，愿佛为未来，演说令开解。","para":true,"t":[952.75,958.83]},{"text":"若有于此经、生疑不信者，即当堕恶道。愿今为解说，","para":true,"t":[959.43,966.1]},{"text":"是无量菩萨，云何于少时、教化令发心，而住不退地。","para":true,"t":[966.71,974.55]}]},{"title":"如来寿量品第十六","stem":"017_如来寿量品第十六","dur":736.15,"src":"audio/017.mp3","pieces":[{"text":"如来寿量品第十六","para":true,"t":[0.0,2.56]},{"text":"尔时、佛告诸菩萨及一切大众：‘诸善男子，汝等当信解如来诚谛之语。’复告大众：‘汝等当信解如来诚谛之语。’又复告诸大众：‘汝等当信解如来诚谛之语。’","para":false,"t":[3.16,23.0]},{"text":"是时菩萨大众，弥勒为首，合掌白佛言：‘世尊，惟愿说之，我等当信受佛语。’如是三白已，复言：‘惟愿说之，我等当信受佛语。’","para":true,"t":[23.25,39.9]},{"text":"尔时世尊知诸菩萨三请不止，而告之言：‘汝等谛听，如来秘密神通之力。","para":false,"t":[40.53,49.17]},{"text":"一切世间天、人、及阿修罗，皆谓，今释迦牟尼佛、出释氏宫，去伽耶城不远，坐于道场，得阿耨多罗三藐三菩提。然善男子，我实成佛已来、无量无边、百千万亿那由他劫。’","para":true,"t":[49.42,70.94]},{"text":"‘譬如五百千万亿那由他、阿僧祇、三千大千世界，假使有人、抹为微尘，过于东方五百千万亿那由他阿僧祇国、乃下一尘，如是东行，尽是微尘，诸善男子、于意云何，是诸世界，","para":false,"t":[71.54,92.04]},{"text":"可得思惟校计、知其数否。’","para":true,"t":[92.27,95.35]},{"text":"弥勒菩萨等、俱白佛言：‘世尊，是诸世界，无量无边，非算数所知、亦非心力所及，一切声闻、辟支佛，以无漏智，不能思惟、知其限数，我等住阿惟越致地，于是事中、","para":false,"t":[95.95,113.16]},{"text":"亦所不达，世尊，如是诸世界，无量无边。’","para":true,"t":[113.4,119.29]},{"text":"尔时佛告大菩萨众：‘诸善男子，今当分明宣语汝等，是诸世界，若著微尘及不著者、尽以为尘，一尘一劫，我成佛已来，复过于此百千万亿那由他阿僧祇劫。","para":false,"t":[119.88,140.64]},{"text":"自从是来，我常在此娑婆世界、说法教化，亦于余处百千万亿那由他阿僧祇国、导利众生。’","para":true,"t":[140.92,151.29]},{"text":"‘诸善男子，于是中间，我说燃灯佛等，又复言其入于涅槃，如是、皆以方便分别。","para":false,"t":[151.89,161.06]},{"text":"诸善男子，若有众生、来至我所，我以佛眼、观其信等、诸根利钝，随所应度，处处自说、名字不同、年纪大小，亦复现言、当入涅槃，又以种种方便、说微妙法，","para":false,"t":[161.3,178.86]},{"text":"能令众生发欢喜心。","para":false,"t":[179.11,180.99]},{"text":"诸善男子，如来见诸众生、乐于小法，德薄垢重者，为是人说，我少出家，得阿耨多罗三藐三菩提，然我实成佛已来、久远若斯，但以方便、教化众生，令入佛道，作如是说。’","para":true,"t":[181.24,202.0]},{"text":"‘诸善男子，如来所演经典，皆为度脱众生，或说己身，或说他身，或示己身，或示他身，或示己事，或示他事，诸所言说，皆实不虚。所以者何。","para":false,"t":[202.6,220.56]},{"text":"如来如实知见三界之相，无有生死、若退若出，亦无在世、及灭度者，非实非虚，非如非异，不如三界、见于三界，如斯之事，如来明见，无有错谬。","para":false,"t":[220.81,238.57]},{"text":"以诸众生有种种性、种种欲、种种行、种种忆想分别故，欲令生诸善根，以若干因缘、譬喻、言辞、种种说法，所作佛事，未曾暂废。","para":false,"t":[238.82,254.94]},{"text":"如是，我成佛已来、甚大久远，寿命无量阿僧祇劫，常住不灭。’","para":true,"t":[255.19,263.51]},{"text":"‘诸善男子，我本行菩萨道、所成寿命，今犹未尽，复倍上数。然今非实灭度，而便唱言、当取灭度，如来以是方便、教化众生。所以者何。","para":false,"t":[264.11,282.89]},{"text":"若佛久住于世，薄德之人，不种善根，贫穷下贱，贪著五欲，入于忆想妄见网中，若见如来常在不灭，便起憍恣、而怀厌怠，不能生难遭之想、恭敬之心，是故如来以方便说：","para":false,"t":[283.16,307.2]},{"text":"“比丘当知，诸佛出世，难可值遇。”所以者何。诸薄德人，过无量百千万亿劫，或有见佛，或不见者，以此事故，我作是言：“诸比丘，如来难可得见。”","para":false,"t":[307.45,328.81]},{"text":"斯众生等、闻如是语，必当生于难遭之想，心怀恋慕，渴仰于佛，便种善根，是故如来虽不实灭，而言灭度。’","para":true,"t":[329.06,343.26]},{"text":"‘又、善男子，诸佛如来、法皆如是，为度众生，皆实不虚。譬如良医，智慧聪达，明练方药，善治众病。其人多诸子息，若十、二十、乃至百数，以有事缘，远至余国。","para":false,"t":[343.86,364.78]},{"text":"诸子于后、饮他毒药，药发、闷乱，宛转于地。","para":false,"t":[365.03,370.31]},{"text":"是时其父还来归家，诸子饮毒，或失本心，或不失者，遥见其父，皆大欢喜，拜跪、问讯、善安隐归：“我等愚痴，误服毒药，愿见救疗，更赐寿命。”","para":false,"t":[370.56,389.36]},{"text":"父见子等苦恼如是，依诸经方，求好药草，色香美味、皆悉具足，捣筛和合，与子令服，而作是言：“此大良药，色香美味、皆悉具足，汝等可服，速除苦恼，无复众患。”’","para":true,"t":[389.61,410.21]},{"text":"‘其诸子中、不失心者，见此良药、色香俱好，即便服之，病尽除愈。余失心者，见其父来，虽亦欢喜问讯，求索治病，然与其药、而不肯服。所以者何。","para":false,"t":[410.82,432.45]},{"text":"毒气深入，失本心故，于此好色香药、而谓不美。父作是念：“此子可愍，为毒所中，心皆颠倒，虽见我喜，求索救疗，如是好药、而不肯服，我今当设方便、令服此药。”","para":false,"t":[432.7,453.54]},{"text":"即作是言：“汝等当知，我今衰老，死时已至，是好良药，今留在此，汝可取服，勿忧不瘥。”作是教已，复至他国，遣使还告：“汝父已死。”","para":false,"t":[453.79,469.15]},{"text":"是时诸子闻父背丧，心大忧恼，而作是念：“若父在者，慈愍我等，能见救护，今者、舍我远丧他国。”自惟孤露，无复恃怙，常怀悲感，心遂醒悟，乃知此药色味香美。","para":false,"t":[469.4,487.76]},{"text":"即取服之，毒病皆愈。其父闻子悉已得瘥，寻便来归，咸使见之。’","para":true,"t":[488.01,497.25]},{"text":"‘诸善男子，于意云何，颇有人、能说此良医虚妄罪否？’‘不也，世尊。’","para":false,"t":[497.85,508.01]},{"text":"佛言：‘我亦如是，成佛已来、无量无边百千万亿那由他阿僧祇劫，为众生故，以方便力、言当灭度，亦无有能如法说我虚妄过者。’","para":true,"t":[508.26,526.38]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[526.98,531.14]},{"text":"自我得佛来，所经诸劫数，无量百千万 亿载阿僧祇，","para":true,"t":[531.74,540.34]},{"text":"常说法教化 无数亿众生，令入于佛道。尔来无量劫，","para":true,"t":[540.94,548.54]},{"text":"为度众生故，方便现涅槃、而实不灭度，常住此说法。","para":true,"t":[549.14,555.95]},{"text":"我常住于此，以诸神通力，令颠倒众生、虽近而不见。","para":true,"t":[556.58,564.59]},{"text":"众见我灭度，广供养舍利，咸皆怀恋慕、而生渴仰心。","para":true,"t":[565.18,572.21]},{"text":"众生既信伏，质直意柔软，一心欲见佛，不自惜身命。","para":true,"t":[572.78,580.34]},{"text":"时我及众僧、俱出灵鹫山，我时语众生，常在此不灭，","para":true,"t":[580.94,588.3]},{"text":"以方便力故，现有灭不灭。余国有众生、恭敬信乐者，","para":true,"t":[588.9,596.06]},{"text":"我复于彼中、为说无上法，汝等不闻此，但谓我灭度。","para":true,"t":[596.65,604.13]},{"text":"我见诸众生、没在于苦恼，故不为现身，令其生渴仰，","para":true,"t":[604.73,610.57]},{"text":"因其心恋慕，乃出为说法。神通力如是，于阿僧祇劫，","para":true,"t":[611.17,618.17]},{"text":"常在灵鹫山、及余诸住处，众生见劫尽、大火所烧时，","para":true,"t":[618.77,623.96]},{"text":"我此土安隐，天人常充满。园林诸堂阁、种种宝庄严，","para":true,"t":[624.53,632.97]},{"text":"宝树多花果，众生所游乐。诸天击天鼓，常作众伎乐，","para":true,"t":[633.57,642.05]},{"text":"雨曼陀罗花、散佛及大众。我净土不毁，而众见烧尽，","para":true,"t":[642.66,651.92]},{"text":"忧怖诸苦恼、如是悉充满。是诸罪众生，以恶业因缘，","para":true,"t":[652.86,661.26]},{"text":"过阿僧祇劫、不闻三宝名。诸有修功德、柔和质直者，","para":true,"t":[661.86,667.9]},{"text":"则皆见我身 在此而说法。或时为此众、说佛寿无量，","para":true,"t":[668.5,676.11]},{"text":"久乃见佛者，为说佛难值。我智力如是，慧光照无量，","para":true,"t":[676.7,684.5]},{"text":"寿命无数劫，久修业所得。汝等有智者，勿于此生疑，","para":true,"t":[685.1,693.14]},{"text":"当断令永尽，佛语实不虚。如医善方便，为治狂子故，","para":true,"t":[693.74,700.62]},{"text":"实在而言死，无能说虚妄。我亦为世父，救诸苦患者，","para":true,"t":[701.22,708.59]},{"text":"为凡夫颠倒，实在而言灭。以常见我故，而生憍恣心，","para":true,"t":[709.18,716.22]},{"text":"放逸著五欲，堕于恶道中。我常知众生、行道不行道，","para":true,"t":[716.82,723.83]},{"text":"随所应可度，为说种种法。每自作是意，以何令众生、","para":true,"t":[724.42,731.96]},{"text":"得入无上惠，速成就佛身。","para":true,"t":[732.58,735.5]}]},{"title":"分别功德品第十七","stem":"018_分别功德品第十七","dur":954.48,"src":"audio/018.mp3","pieces":[{"text":"分别功德品第十七","para":true,"t":[0.0,2.4]},{"text":"尔时大会、闻佛说寿命劫数长远如是，无量无边阿僧祇众生、得大饶益。","para":false,"t":[3.0,13.12]},{"text":"于时世尊告弥勒菩萨摩诃萨：‘阿逸多，我说是如来寿命长远时，六百八十万亿那由他恒河沙众生、得无生法忍，复有千倍菩萨摩诃萨、得闻持陀罗尼门，","para":false,"t":[13.37,31.05]},{"text":"复有一世界微尘数菩萨摩诃萨、得乐说无碍辩才，复有一世界微尘数菩萨摩诃萨、得百千万亿无量旋陀罗尼，复有三千大千世界微尘数菩萨摩诃萨、能转不退法轮，","para":false,"t":[31.3,48.02]},{"text":"复有二千中国土微尘数菩萨摩诃萨、能转清净法轮，复有小千国土微尘数菩萨摩诃萨、八生当得阿耨多罗三藐三菩提，复有四四天下微尘数菩萨摩诃萨、","para":false,"t":[48.27,64.67]},{"text":"四生当得阿耨多罗三藐三菩提，复有三四天下微尘数菩萨摩诃萨、三生当得阿耨多罗三藐三菩提，复有二四天下微尘数菩萨摩诃萨、二生当得阿耨多罗三藐三菩提，","para":false,"t":[64.92,84.92]},{"text":"复有一四天下微尘数菩萨摩诃萨、一生当得阿耨多罗三藐三菩提，复有八世界微尘数众生、皆发阿耨多罗三藐三菩提心。’","para":true,"t":[85.17,98.45]},{"text":"‘佛说是诸菩萨摩诃萨得大法利时，于虚空中，雨曼陀罗华、摩诃曼陀罗华，以散无量百千万亿众宝树下、师子座上、诸佛，并散七宝塔中、师子座上、释迦牟尼佛、","para":false,"t":[99.05,116.89]},{"text":"及久灭度多宝如来，亦散一切诸大菩萨、及四部众。","para":false,"t":[117.14,123.11]},{"text":"又雨细末栴檀、沉水香等，于虚空中，天鼓自鸣，妙声深远，又雨千种天衣，垂诸璎珞、真珠璎珞、摩尼珠璎珞、如意珠璎珞，遍于九方，众宝香炉、烧无价香，自然周至，","para":false,"t":[123.35,144.58]},{"text":"供养大会。一一佛上，有诸菩萨、执持幡盖，次第而上，至于梵天。是诸菩萨，以妙音声、歌无量颂，赞叹诸佛。’","para":true,"t":[144.84,159.36]},{"text":"尔时弥勒菩萨从座而起，偏袒右肩，合掌向佛，而说偈言：","para":true,"t":[159.96,166.64]},{"text":"佛说稀有法，昔所未曾闻，世尊有大力，寿命不可量。","para":true,"t":[167.21,173.65]},{"text":"无数诸佛子，闻世尊分别，说得法利者，欢喜充遍身。","para":true,"t":[174.26,180.58]},{"text":"或住不退地，或得陀罗尼，或无碍乐说、万亿旋总持，","para":true,"t":[181.18,188.16]},{"text":"或有大千界、微尘数菩萨，各各皆能转，不退之法轮。","para":true,"t":[188.74,194.39]},{"text":"复有中千界、微尘数菩萨，各各皆能转，清净之法轮。","para":true,"t":[194.98,201.27]},{"text":"复有小千界、微尘数菩萨，余各八生在，当得成佛道。","para":true,"t":[201.86,209.15]},{"text":"复有四三二、如此四天下、微尘诸菩萨，随数生成佛。","para":true,"t":[209.74,216.82]},{"text":"或一四天下、微尘数菩萨，余有一生在，当成一切智。","para":true,"t":[217.42,226.1]},{"text":"如是等众生，闻佛寿长远，得无量无漏，清净之果报。","para":true,"t":[226.7,233.34]},{"text":"复有八世界、微尘数众生，闻佛说寿命，皆发无上心。","para":true,"t":[233.94,241.18]},{"text":"世尊说无量，不可思议法，多有所饶益，如虚空无边。","para":true,"t":[241.78,247.78]},{"text":"雨天曼陀罗、摩诃曼陀罗，释梵如恒沙，无数佛土来。","para":true,"t":[248.38,255.5]},{"text":"雨栴檀沉水，缤纷而乱坠，如鸟飞空下，供散于诸佛。","para":true,"t":[256.1,263.46]},{"text":"天鼓虚空中、自然出妙声，天衣千万种、旋转而来下，","para":true,"t":[264.06,271.74]},{"text":"众宝妙香炉，烧无价之香，自然悉周遍、供养诸世尊。","para":true,"t":[272.34,280.35]},{"text":"其大菩萨众，执七宝幡盖，高妙万亿种，次第至梵天，","para":true,"t":[280.94,287.71]},{"text":"一一诸佛前，宝幢悬胜幡。亦以千万偈、歌咏诸如来。","para":true,"t":[288.34,295.46]},{"text":"如是种种事，昔所未曾有，闻佛寿无量，一切皆欢喜。","para":true,"t":[296.06,303.5]},{"text":"佛名闻十方，广饶益众生，一切具善根，以助无上心。","para":true,"t":[304.1,312.58]},{"text":"尔时佛告弥勒菩萨摩诃萨：‘阿逸多，其有众生、闻佛寿命长远如是，乃至能生一念信解，所得功德、无有限量。","para":false,"t":[313.18,326.5]},{"text":"若有善男子、善女人，为阿耨多罗三藐三菩提故，于八十万亿那由他劫、行五波罗蜜、檀波罗蜜、尸罗波罗蜜、羼提波罗密、毗梨耶波罗蜜、禅波罗蜜、除般若波罗蜜，","para":false,"t":[326.75,343.35]},{"text":"以是功德比前功德，百分、千分、百千万亿分、不及其一，乃至算数譬喻所不能知。若善男子、善女人，有如是功德，于阿耨多罗三藐三菩提、退者，无有是处。’","para":true,"t":[343.6,363.8]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[364.4,368.0]},{"text":"若人求佛慧，于八十万亿、那由他劫数、行五波罗蜜。","para":true,"t":[368.6,375.24]},{"text":"于是诸劫中，布施供养佛、及缘觉弟子、并诸菩萨众，","para":true,"t":[375.84,381.28]},{"text":"珍异之饮食、上服与卧具，栴檀立精舍，以园林庄严。","para":true,"t":[381.88,388.86]},{"text":"如是等布施，种种皆微妙，尽此诸劫数，以回向佛道。","para":true,"t":[389.44,395.89]},{"text":"若复持禁戒，清净无缺漏，求于无上道，诸佛之所叹。","para":true,"t":[396.48,403.84]},{"text":"若复行忍辱，住于调柔地，设众恶来加，其心不倾动。","para":true,"t":[404.43,412.64]},{"text":"诸有得法者，怀于增上慢，为此所轻恼，如是亦能忍。","para":true,"t":[413.24,421.42]},{"text":"若复勤精进，志念常坚固，于无量亿劫、一心不懈息。","para":true,"t":[422.0,430.0]},{"text":"又于无数劫，住于空闲处，若坐若经行，除睡常摄心，","para":true,"t":[430.6,438.0]},{"text":"以是因缘故，能生诸禅定，八十亿万劫、安住心不乱，","para":true,"t":[438.6,445.17]},{"text":"持此一心福，愿求无上道。我得一切智，尽诸禅定际，","para":true,"t":[445.75,453.89]},{"text":"是人于百千、万亿劫数中、行此诸功德，如上之所说。","para":true,"t":[454.52,460.6]},{"text":"有善男女等，闻我说寿命，乃至一念信，其福过于彼。","para":true,"t":[461.2,468.52]},{"text":"若人悉无有，一切诸疑悔，深心须臾信，其福为如此。","para":true,"t":[469.12,477.28]},{"text":"其有诸菩萨，无量劫行道，闻我说寿命，是则能信受。","para":true,"t":[477.88,485.64]},{"text":"如是诸人等，顶受此经典，愿我于未来，长寿度众生，","para":true,"t":[486.24,493.24]},{"text":"如今日世尊、诸释中之王，道场师子吼，说法无所畏。","para":true,"t":[493.84,499.92]},{"text":"我等未来世，一切所尊敬，坐于道场时，说寿亦如是。","para":true,"t":[500.56,508.08]},{"text":"若有深心者，清净而质直，多闻能总持，随义解佛语，","para":true,"t":[508.69,517.2]},{"text":"如是诸人等，于此无有疑。","para":true,"t":[517.8,521.48]},{"text":"‘又、阿逸多，若有闻佛寿命长远，解其言趣，是人所得功德、无有限量，能起如来无上之慧。","para":false,"t":[522.1,532.76]},{"text":"何况广闻是经、若教人闻，若自持、若教人持，若自书、若教人书，若以华、香、璎珞，幢幡、缯盖，香油、酥灯，供养经卷，是人功德、无量无边，能生一切种智。","para":false,"t":[533.01,553.57]},{"text":"阿逸多，若善男子、善女人，闻我说寿命长远，深心信解，则为见佛常在耆阇崛山，共大菩萨、诸声闻众、围绕说法。","para":false,"t":[553.81,566.25]},{"text":"又见此娑婆世界，其地琉璃，坦然平正，阎浮檀金、以界八道，宝树行列，诸台楼观、皆悉宝成，其菩萨众、咸处其中。若有能如是观者，当知是为深信解相。’","para":true,"t":[566.5,587.38]},{"text":"‘又复如来灭后，若闻是经、而不毁呰，起随喜心，当知已为深信解相，何况读诵、受持之者，斯人则为顶戴如来。","para":false,"t":[587.98,600.9]},{"text":"阿逸多，是善男子、善女人，不须为我复起塔寺，及作僧坊、以四事供养众僧。所以者何。是善男子、善女人，受持读诵是经典者，为已起塔、造立僧坊、供养众僧。","para":false,"t":[601.14,619.58]},{"text":"则为以佛舍利、起七宝塔，高广渐小、至于梵天，悬诸幡盖、及众宝铃，华、香、璎珞，末香、涂香、烧香，众鼓、伎乐，箫、笛、箜篌，种种舞戏，以妙音声、歌呗赞颂，","para":false,"t":[619.83,643.23]},{"text":"则为于无量千万亿劫、作是供养已。’","para":true,"t":[643.48,649.37]},{"text":"‘阿逸多，若我灭后，闻是经典，有能受持，若自书、若教人书，则为起立僧坊，以赤栴檀、作诸殿堂三十有二，高八多罗树，高广严好，百千比丘、于其中止，园林、浴池，经行、","para":false,"t":[649.96,673.21]},{"text":"禅窟，衣服、饮食，床褥、汤药，一切乐具、充满其中，如是僧坊、堂阁、若干百千万亿，其数无量，以此现前、供养于我、及比丘僧。","para":false,"t":[673.45,693.01]},{"text":"是故我说，如来灭后，若有受持、读诵、为他人说，若自书、若教人书，供养经卷，不须复起塔寺，及造僧坊、供养众僧。","para":false,"t":[693.26,709.1]},{"text":"况复有人能持是经，兼行布施、持戒、忍辱、精进、一心、智慧，其德最胜，无量无边，譬如虚空、东西南北、四维、上下、无量无边，是人功德，亦复如是无量无边，","para":false,"t":[709.35,730.91]},{"text":"疾至一切种智。","para":false,"t":[731.16,733.32]},{"text":"若人读诵受持是经，为他人说，若自书、若教人书，复能起塔，及造僧坊、供养赞叹声闻众僧，亦以百千万亿赞叹之法、赞叹菩萨功德，又为他人、种种因缘，随义解说此法华经，","para":false,"t":[733.57,753.85]},{"text":"复能清净持戒，与柔和者而共同止，忍辱无嗔，志念坚固，常贵坐禅、得诸深定，精进勇猛、摄诸善法，利根智慧、善答问难。’","para":true,"t":[754.1,770.78]},{"text":"‘阿逸多，若我灭后，诸善男子、善女人，受持读诵是经典者，复有如是诸善功德，当知是人、已趋道场，近阿耨多罗三藐三菩提，坐道树下。","para":false,"t":[771.38,786.68]},{"text":"阿逸多，是善男子、善女人，若坐、若立、若经行处，此中便应起塔，一切天人、皆应供养如佛之塔。’","para":true,"t":[786.91,798.91]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[799.51,803.55]},{"text":"若我灭度后，能奉持此经，斯人福无量，如上之所说。","para":true,"t":[804.15,810.47]},{"text":"是则为具足 一切诸供养、以舍利起塔，七宝而庄严，","para":true,"t":[811.07,817.18]},{"text":"表刹甚高广，渐小至梵天，宝铃千万亿，风动出妙音。","para":true,"t":[817.79,826.86]},{"text":"又于无量劫、而供养此塔，华香诸璎珞，天衣众伎乐，","para":true,"t":[827.43,834.15]},{"text":"燃香油酥灯，周匝常照明。恶世法末时、能持是经者，","para":true,"t":[834.75,842.19]},{"text":"则为已如上、具足诸供养。若能持此经，则如佛现在，","para":true,"t":[842.79,849.39]},{"text":"以牛头栴檀、起僧坊供养，堂有三十二，高八多罗树，","para":true,"t":[849.99,856.2]},{"text":"上馔妙衣服、床卧皆具足，百千众住处，园林诸浴池，","para":true,"t":[856.79,864.75]},{"text":"经行及禅窟，种种皆严好。若有信解心、受持读诵书，","para":true,"t":[865.35,874.23]},{"text":"若复教人书、及供养经卷，散华香末香、以须曼薝卜、","para":true,"t":[874.83,881.47]},{"text":"阿提目多伽、薰油常燃之。如是供养者，得无量功德，","para":true,"t":[882.07,888.79]},{"text":"如虚空无边，其福亦如是。况复持此经，兼布施持戒，","para":true,"t":[889.39,897.59]},{"text":"忍辱乐禅定，不嗔不恶口，恭敬于塔庙，谦下诸比丘，","para":true,"t":[898.18,905.07]},{"text":"远离自高心，常思惟智慧，有问难不嗔，随顺为解说，","para":true,"t":[905.66,913.42]},{"text":"若能行是行，功德不可量。若见此法师、成就如是德，","para":true,"t":[914.02,919.6]},{"text":"应以天华散，天衣覆其身，头面接足礼，生心如佛想。","para":true,"t":[920.18,926.27]},{"text":"又应作是念，不久诣道场，得无漏无为，广利诸人天。","para":true,"t":[926.9,933.99]},{"text":"其所住止处，经行若坐卧，乃至说一偈，是中应起塔，","para":true,"t":[934.58,941.79]},{"text":"庄严令妙好，种种以供养。佛子住此地，则是佛受用，","para":true,"t":[942.42,950.1]},{"text":"常在于其中、经行及坐卧。","para":true,"t":[950.7,953.84]}]},{"title":"随喜功德品第十八","stem":"019_随喜功德品第十八","dur":473.23,"src":"audio/019.mp3","pieces":[{"text":"随喜功德品第十八","para":true,"t":[0.0,2.0]},{"text":"尔时、弥勒菩萨摩诃萨白佛言：‘世尊，若有善男子、善女人，闻是法华经、随喜者，得几所福？’而说偈言：","para":true,"t":[2.6,15.52]},{"text":"世尊灭度后，其有闻是经，若能随喜者，为得几所福。","para":true,"t":[16.12,23.0]},{"text":"尔时佛告弥勒菩萨摩诃萨：‘阿逸多，如来灭后，若比丘、比丘尼、优婆塞、优婆夷，及余智者、若长若幼，闻是经、随喜已，从法会出，至于余处，若在僧坊，若空闲地，若城邑、","para":false,"t":[23.6,45.6]},{"text":"巷陌、聚落、田里，如其所闻，为父母、宗亲、善友、知识、随力演说，是诸人等，闻已、随喜，复行转教，余人闻已，亦随喜转教，如是展转、至第五十，阿逸多，","para":false,"t":[45.85,67.57]},{"text":"其第五十善男子、善女人，随喜功德，我今说之，汝当善听。’","para":true,"t":[67.82,75.06]},{"text":"‘若四百万亿阿僧祇世界六趣四生众生，卵生、胎生、湿生、化生，若有形、无形，有想、无想，非有想、非无想，无足、二足、四足、多足、如是等、在众生数者，有人求福，","para":false,"t":[75.66,93.25]},{"text":"随其所欲娱乐之具、皆给与之，一一众生、与满阎浮提金、银、琉璃、砗磲、玛瑙、珊瑚、琥珀、诸妙珍宝，及象、马、车乘，七宝所成宫殿楼阁等，是大施主、如是布施、","para":false,"t":[93.51,117.44]},{"text":"满八十年已，而作是念：“我已施众生娱乐之具、随意所欲，然此众生、皆已衰老，年过八十，发白、面皱，将死不久，我当以佛法而训导之。”","para":false,"t":[117.72,137.24]},{"text":"即集此众生，宣布法化，示教利喜，一时皆得须陀洹道、斯陀含道、阿那含道、阿罗汉道，尽诸有漏，于深禅定、皆得自在，具八解脱。","para":false,"t":[137.49,156.41]},{"text":"于汝意云何，是大施主所得功德、宁为多否？’","para":true,"t":[156.66,162.5]},{"text":"弥勒白佛言：‘世尊，是人功德甚多，无量无边，若是施主、但施众生一切乐具，功德无量，何况令得阿罗汉果。’","para":false,"t":[163.1,177.86]},{"text":"佛告弥勒：‘我今分明语汝，是人以一切乐具、施于四百万亿阿僧祇世界六趣众生，又令得阿罗汉果，所得功德，不如是第五十人闻法华经一偈、随喜功德，百分、千分、","para":false,"t":[178.11,196.6]},{"text":"百千万亿分、不及其一，乃至算数譬喻所不能知。","para":false,"t":[196.84,201.96]},{"text":"阿逸多，如是第五十人展转闻法华经随喜功德，尚无量无边阿僧祇，何况最初于会中、闻而随喜者，其福复胜，无量无边阿僧祇、不可得比。’","para":true,"t":[202.21,216.97]},{"text":"‘又、阿逸多，若人为是经故，往诣僧坊，若坐、若立、须臾听受，缘是功德，转身所生，得好上妙象、马、车乘、珍宝辇舆，及乘天宫。","para":false,"t":[217.57,237.17]},{"text":"若复有人、于讲法处坐，更有人来，劝令坐听，若分座令坐，是人功德，转身得帝释坐处，若梵王坐处，若转轮圣王所坐之处。’","para":true,"t":[237.42,254.82]},{"text":"‘阿逸多，若复有人、语余人言：“有经、名法华，可共往听。”","para":false,"t":[255.42,264.47]},{"text":"即受其教，乃至须臾间闻，是人功德，转身得与陀罗尼菩萨共生一处，利根智慧，百千万世、终不喑哑，口气不臭，舌常无病，口亦无病，齿不垢黑、不黄、不疏，亦不缺落、不差、","para":false,"t":[264.71,287.35]},{"text":"不曲、唇不下垂，亦不褰缩、不粗涩、不疮胗，亦不缺坏，亦不喎斜，不厚、不大，亦不黧黑，无诸可恶，鼻不匾□，亦不曲戾，面色不黑，亦不狭长，亦不窊曲，","para":false,"t":[287.6,308.0]},{"text":"无有一切不可喜相，唇舌牙齿、悉皆严好，鼻修、高直，面貌圆满，眉高而长，额广、平、正，人相具足，世世所生，见佛闻法、信受教诲。’","para":true,"t":[308.25,325.41]},{"text":"‘阿逸多，汝且观是、劝于一人令往听法，功德如此，何况一心听说、读诵，而于大众、为人分别如说修行？’","para":true,"t":[326.01,340.13]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[340.73,344.85]},{"text":"若人于法会，得闻是经典、乃至于一偈，随喜为他说，","para":true,"t":[345.45,352.01]},{"text":"如是展转教、至于第五十，最后人获福、今当分别之。","para":true,"t":[352.61,358.71]},{"text":"如有大施主，供给无量众，具满八十岁、随意之所欲，","para":true,"t":[359.33,365.15]},{"text":"见彼衰老相，发白而面皱，齿疏形枯竭，念其死不久，","para":true,"t":[365.73,372.84]},{"text":"我今应当教、令得于道果。即为方便说、涅槃真实法，","para":true,"t":[373.41,379.09]},{"text":"世皆不牢固，如水沫泡焰，汝等咸应当、疾生厌离心。","para":true,"t":[379.69,386.78]},{"text":"诸人闻是法，皆得阿罗汉，具足六神通、三明八解脱。","para":true,"t":[387.37,393.69]},{"text":"最后第五十，闻一偈随喜，是人福胜彼、不可为譬喻。","para":true,"t":[394.29,400.6]},{"text":"如是展转闻，其福尚无量，何况于法会、初闻随喜者。","para":true,"t":[401.21,407.13]},{"text":"若有劝一人、将引听法华，言此经深妙，千万劫难遇，","para":true,"t":[407.73,414.47]},{"text":"即受教往听，乃至须臾闻，斯人之福报，今当分别说。","para":true,"t":[415.05,421.61]},{"text":"世世无口患，齿不疏黄黑，唇不厚褰缺，无有可恶相，","para":true,"t":[422.2,429.17]},{"text":"舌不干黑短，鼻高修且直，额广而平正，面目悉端严，","para":true,"t":[429.77,436.74]},{"text":"为人所喜见，口气无臭秽，优钵华之香、当从其口出。","para":true,"t":[437.37,443.93]},{"text":"若故诣僧坊，欲听法华经，须臾闻欢喜，今当说其福。","para":true,"t":[444.53,452.21]},{"text":"后生天人中，得妙象马车、珍宝之辇舆，及乘天宫殿。","para":true,"t":[452.81,459.19]},{"text":"若于讲法处、劝人坐听经，是福因缘得、释梵转轮座。","para":true,"t":[459.77,465.55]},{"text":"何况一心听，解说其义趣，如说而修行，其福不可量。","para":true,"t":[466.13,472.57]}]},{"title":"法师功德品第十九","stem":"020_法师功德品第十九","dur":1151.98,"src":"audio/020.mp3","pieces":[{"text":"法师功德品第十九","para":true,"t":[0.0,2.28]},{"text":"尔时佛告常精进菩萨摩诃萨：‘若善男子、善女人，受持是法华经，若读、若诵，若解说、若书写，是人当得八百眼功德、千二百耳功德、八百鼻功德、千二百舌功德、八百身功德、","para":false,"t":[2.88,22.64]},{"text":"千二百意功德，以是功德、庄严六根，皆令清净。","para":false,"t":[22.89,28.81]},{"text":"是善男子、善女人，父母所生清净肉眼，见于三千大千世界、内外所有山林河海，下至阿鼻地狱，上至有顶，亦见其中一切众生，及业因缘、果报生处，悉见悉知。’","para":true,"t":[29.06,49.3]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[49.9,54.06]},{"text":"若于大众中，以无所畏心、说是法华经，汝听其功德。","para":true,"t":[54.66,61.3]},{"text":"是人得八百、功德殊胜眼，以是庄严故，其目甚清净。","para":true,"t":[61.9,67.94]},{"text":"父母所生眼，悉见三千界、内外弥楼山、须弥及铁围，","para":true,"t":[68.54,75.78]},{"text":"并诸余山林、大海江河水、下至阿鼻狱，上至有顶处，","para":true,"t":[76.38,83.5]},{"text":"其中诸众生，一切皆悉见。虽未得天眼，肉眼力如是。","para":true,"t":[84.1,91.39]},{"text":"‘复次、常精进，若善男子、善女人，受持此经，若读、若诵，若解说、若书写，得千二百耳功德。","para":false,"t":[91.98,103.18]},{"text":"以是清净耳，闻三千大千世界，下至阿鼻地狱，上至有顶，其中内外种种语言音声，象声、马声、牛声、车声，啼哭声、愁叹声，螺声、鼓声、钟声、铃声，笑声、语声，男声、","para":false,"t":[103.43,127.51]},{"text":"女声、童子声、童女声，法声、非法声，苦声、乐声，凡夫声、圣人声，喜声、不喜声，天声、龙声、夜叉声、乾闼婆声、阿修罗声、迦楼罗声、紧那罗声、摩侯罗伽声，火声、","para":false,"t":[127.76,155.04]},{"text":"水声、风声，地狱声、畜生声、饿鬼声，比丘声、比丘尼声，声闻声、辟支佛声，菩萨声、佛声。","para":false,"t":[155.29,167.93]},{"text":"以要言之，三千大千世界中、一切内外所有诸声，虽未得天耳，以父母所生清净常耳，皆悉闻知，如是分别种种音声、而不坏耳根。’","para":true,"t":[168.18,182.42]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[183.02,186.6]},{"text":"父母所生耳，清净无浊秽，以此常耳闻，三千世界声。","para":true,"t":[187.18,195.74]},{"text":"象马车牛声、钟铃螺鼓声，琴瑟箜篌声、箫笛之音声，","para":true,"t":[196.34,204.02]},{"text":"清净好歌声，听之而不著，无数种人声，闻悉能解了。","para":true,"t":[204.62,211.22]},{"text":"又闻诸天声，微妙之歌音，及闻男女声，童子童女声。","para":true,"t":[211.82,219.34]},{"text":"山川险谷中、迦陵频伽声，命命等诸鸟，悉闻其音声。","para":true,"t":[219.94,226.95]},{"text":"地狱众苦痛，种种楚毒声，饿鬼饥渴逼，求索饮食声，","para":true,"t":[227.54,235.18]},{"text":"诸阿修罗等，居在大海边，自共言语时、出于大音声。","para":true,"t":[235.78,242.86]},{"text":"如是说法者，安住于此间，遥闻是众声，而不坏耳根。","para":true,"t":[243.46,250.07]},{"text":"十方世界中、禽兽鸣相呼，其说法之人，于此悉闻之。","para":true,"t":[250.66,256.48]},{"text":"其诸梵天上，光音及遍净，乃至有顶天，言语之音声，","para":true,"t":[257.06,264.73]},{"text":"法师住于此，悉皆得闻之。一切比丘众、及诸比丘尼，","para":true,"t":[265.34,272.95]},{"text":"若读诵经典，若为他人说，法师住于此，悉皆得闻之。","para":true,"t":[273.54,279.92]},{"text":"复有诸菩萨，读诵于经法，若为他人说，撰集解其义，","para":true,"t":[280.5,286.36]},{"text":"如是诸音声，悉皆得闻之。诸佛大圣尊，教化众生者，","para":true,"t":[286.94,294.59]},{"text":"于诸大会中、演说微妙法，持此法华者，悉皆得闻之。","para":true,"t":[295.18,301.21]},{"text":"三千大千界、内外诸音声，下至阿鼻狱，上至有顶天，","para":true,"t":[301.78,310.38]},{"text":"皆闻其音声，而不坏耳根，其耳聪利故，悉能分别知。","para":true,"t":[310.98,317.74]},{"text":"持是法华者，虽未得天耳，但用所生耳，功德已如是。","para":true,"t":[318.34,326.01]},{"text":"‘复次、常精进，若善男子、善女人，受持是经，若读、若诵，若解说，若书写，成就八百鼻功德。","para":false,"t":[326.62,340.26]},{"text":"以是清净鼻根，闻于三千大千世界、上下内外种种诸香，须曼那华香、阇提华香、末利华香、瞻卜华香、波罗罗华香，赤莲华香、青莲华香、白莲华香，华树香、果树香，栴檀香、","para":false,"t":[340.51,362.51]},{"text":"沉水香、多摩罗跋香、多伽罗香，及千万种和香，若末、若丸、若涂香，持是经者，于此间住，悉能分别。","para":false,"t":[362.76,379.32]},{"text":"又复别知众生之香，象香、马香、牛羊等香，男香、女香、童子香、童女香，及草木丛林香，若近、若远、所有诸香，悉皆得闻，分别不错。","para":false,"t":[379.57,395.65]},{"text":"持是经者，虽住于此，亦闻天上诸天之香，波利质多罗、拘鞞陀罗树香，及曼陀罗华香、摩诃曼陀罗华香、曼殊沙华香、摩诃曼殊沙华香、栴檀、沉水、种种末香，诸杂华香，","para":false,"t":[395.9,418.46]},{"text":"如是等天香、和合所出之香，无不闻知。","para":false,"t":[418.71,423.39]},{"text":"又闻诸天身香，释提桓因、在胜殿上，五欲娱乐嬉戏时香，若在妙法堂上、为忉利诸天说法时香，若于诸园游戏时香，及余天等、男女身香，皆悉遥闻。","para":false,"t":[423.63,439.96]},{"text":"如是展转、乃至梵世、上至有顶、诸天身香，亦皆闻之。并闻诸天所烧之香，及声闻香、辟支佛香、菩萨香、诸佛身香，亦皆遥闻，知其所在。","para":false,"t":[440.21,456.29]},{"text":"虽闻此香，然于鼻根不坏不错，若欲分别为他人说，忆念不谬。’","para":true,"t":[456.54,464.9]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[465.5,469.28]},{"text":"是人鼻清净，于此世界中，若香若臭物，种种悉闻知。","para":true,"t":[469.86,477.3]},{"text":"须曼那阇提、多摩罗栴檀、沉水及桂香，种种华果香，","para":true,"t":[477.9,485.58]},{"text":"及知众生香，男子女人香，说法者远住，闻香知所在。","para":true,"t":[486.18,492.9]},{"text":"大势转轮王，小转轮及子，群臣诸宫人，闻香知所在。","para":true,"t":[493.5,500.0]},{"text":"身所著珍宝，及地中宝藏，转轮王宝女，闻香知所在。","para":true,"t":[500.58,508.18]},{"text":"诸人严身具，衣服及璎珞、种种所涂香，闻香知其身。","para":true,"t":[508.78,517.1]},{"text":"诸天若行坐、游戏及神变，持是法华者，闻香悉能知。","para":true,"t":[517.7,525.67]},{"text":"诸树华果实，及酥油香气，持经者住此，悉知其所在。","para":true,"t":[526.3,532.63]},{"text":"诸山深险处，栴檀树花敷，众生在中者，闻香皆能知。","para":true,"t":[533.22,542.96]},{"text":"铁围山大海、地中诸众生，持经者闻香，悉知其所在。","para":true,"t":[543.54,549.98]},{"text":"阿修罗男女、及其诸眷属，斗诤游戏时，闻香皆能知。","para":true,"t":[550.58,555.94]},{"text":"旷野险隘处，狮子象虎狼、野牛水牛等，闻香知所在。","para":true,"t":[556.54,563.59]},{"text":"若有怀妊者，未辩其男女、无根及非人，闻香悉能知。","para":true,"t":[564.18,571.17]},{"text":"以闻香力故，知其初怀妊，成就不成就，安乐产福子。","para":true,"t":[571.78,580.5]},{"text":"以闻香力故，知男女所念、染欲痴恚心，亦知修善者。","para":true,"t":[581.1,589.26]},{"text":"地中众伏藏，金银诸珍宝、铜器之所盛，闻香悉能知。","para":true,"t":[589.86,596.98]},{"text":"种种诸璎珞，无能识其价，闻香知贵贱、出处及所在。","para":true,"t":[597.58,605.86]},{"text":"天上诸华等，曼陀曼殊沙、波利质多树，闻香悉能知。","para":true,"t":[606.46,614.46]},{"text":"天上诸宫殿，上中下差别，众宝花庄严，闻香悉能知。","para":true,"t":[615.06,624.1]},{"text":"天园林胜殿、诸观妙法堂，在中而娱乐，闻香悉能知。","para":true,"t":[624.71,630.9]},{"text":"诸天若听法，或受五欲时，来往行坐卧，闻香悉能知。","para":true,"t":[631.5,639.44]},{"text":"天女所著衣、好华香庄严，周旋游戏时，闻香悉能知。","para":true,"t":[640.03,648.18]},{"text":"如是展转上，乃至于梵世，入禅出禅者，闻香悉能知。","para":true,"t":[648.78,655.34]},{"text":"光音遍净天，乃至于有顶，初生及退没，闻香悉能知。","para":true,"t":[655.94,664.06]},{"text":"诸比丘众等，于法常精进，若坐若经行，及读诵经典，","para":true,"t":[664.66,671.14]},{"text":"或在林树下、专精而坐禅，持经者闻香，悉知其所在。","para":true,"t":[671.74,678.98]},{"text":"菩萨志坚固，坐禅若读诵，或为人说法，闻香悉能知。","para":true,"t":[679.58,688.22]},{"text":"在在方世尊，一切所恭敬，愍众而说法，闻香悉能知。","para":true,"t":[688.82,696.98]},{"text":"众生在佛前，闻经皆欢喜，如法而修行，闻香悉能知。","para":true,"t":[697.58,706.26]},{"text":"虽未得菩萨 无漏法生鼻，而是持经者，先得此鼻相。","para":true,"t":[706.86,713.42]},{"text":"‘复次、常精进，若善男子、善女人，受持是经，若读、若诵、若解说，若书写，得千二百舌功德。","para":false,"t":[714.02,726.06]},{"text":"若好、若丑，若美、不美，及诸苦涩物，在其舌根，皆变成上味，如天甘露，无不美者。若以舌根、于大众中有所演说，出深妙声，能入其心，皆令欢喜快乐。","para":false,"t":[726.31,746.32]},{"text":"又诸天子、天女，释梵诸天，闻是深妙音声，有所演说、言论次第，皆悉来听。","para":false,"t":[746.56,756.76]},{"text":"及诸龙、龙女，夜叉、夜叉女，乾闼婆、乾闼婆女，阿修罗、阿修罗女，迦楼罗、迦楼罗女，紧那罗、紧那罗女，摩侯罗伽、摩侯罗伽女，为听法故，皆来亲近、恭敬供养。","para":false,"t":[757.01,779.33]},{"text":"及比丘、比丘尼，优婆塞、优婆夷，国王、王子、群臣、眷属，小转轮王、大转轮王、七宝千子内外眷属，乘其宫殿，俱来听法，以是菩萨善说法故。","para":false,"t":[779.58,798.98]},{"text":"婆罗门、居士、国内人民、尽其形寿，随侍供养。又诸声闻、辟支佛、菩萨、诸佛，常乐见之。是人所在方面，诸佛皆向其处说法，悉能受持一切佛法，又能出于深妙法音。’","para":true,"t":[799.23,818.47]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[819.07,823.43]},{"text":"是人舌根净，终不受恶味，其有所食啖，悉皆成甘露。","para":true,"t":[824.03,832.71]},{"text":"以深净妙声，于大众说法，以诸因缘喻、引导众生心，","para":true,"t":[833.31,840.23]},{"text":"闻者皆欢喜，设诸上供养。诸天龙夜叉、及阿修罗等，","para":true,"t":[840.83,847.52]},{"text":"皆以恭敬心，而共来听法，是说法之人，若欲以妙音、","para":true,"t":[848.11,855.67]},{"text":"遍满三千界，随意即能至。大小转轮王、及千子眷属，","para":true,"t":[856.27,863.04]},{"text":"合掌恭敬心，常来听受法。诸天龙夜叉、罗刹毗舍阇，","para":true,"t":[863.63,871.92]},{"text":"亦以欢喜心，常乐来供养。梵天王魔王，自在大自在，","para":true,"t":[872.51,879.61]},{"text":"如是诸天众，常来至其所。诸佛及弟子、闻其说法音，","para":true,"t":[880.23,886.95]},{"text":"常念而守护，或时为现身。","para":true,"t":[887.55,890.71]},{"text":"‘复次、常精进，若善男子、善女人，受持是经，若读、若诵，若解说，若书写，得八百身功德。得清净身、如净琉璃，众生喜见。","para":false,"t":[891.31,909.36]},{"text":"其身净故，三千大千世界众生，生时、死时，上下、好丑，生善处、恶处，悉于中现。及铁围山、大铁围山、弥楼山、摩诃弥楼山、等诸山，及其中众生，悉于中现。","para":false,"t":[909.61,931.72]},{"text":"下至阿鼻地狱、上至有顶，所有及众生，悉于中现。若声闻、辟支佛、菩萨、诸佛、说法，皆于身中现其色像。’","para":true,"t":[931.97,947.45]},{"text":"尔时世尊欲重宣此义，而说偈言：","para":true,"t":[948.05,951.91]},{"text":"若持法华者，其身甚清净，如彼净琉璃，众生皆喜见，","para":true,"t":[952.49,959.62]},{"text":"又如净明镜，悉见诸色像，菩萨于净身，皆见世所有，","para":true,"t":[960.21,968.81]},{"text":"唯独自明了，余人所不见。三千世界中、一切诸群萌，","para":true,"t":[969.41,976.28]},{"text":"天人阿修罗、地狱鬼畜生，如是诸色像，皆于身中现。","para":true,"t":[976.85,983.33]},{"text":"诸天等宫殿，乃至于有顶，铁围及弥楼、摩诃弥楼山、","para":true,"t":[983.93,990.1]},{"text":"诸大海水等，皆于身中现。诸佛及声闻、佛子菩萨等，","p
